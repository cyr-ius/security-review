# `prek install` installs the pre-commit hooks and the agent-review post-commit hook
default_install_hook_types: [pre-commit, post-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
        exclude: ^tests/ # scanner tests use fake key fixtures

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      # Prettier of web/ (version locked by web/package-lock.json, as in CI): run `npm ci` in web/ first
      - id: prettier
        name: prettier
        entry: npm --prefix web exec --no -- prettier --write --ignore-unknown
        language: system
        files: ^(web/src/.*\.(ts|html|css)|.*\.(ya?ml|json))$
      # Client of the controller of SECREVIEW_CONTROLLER_URL, with a personal mcp or ci token in
      # SECREVIEW_TOKEN (environment only); skipped while the URL is not set
      - id: scan-deps
        name: dependency scan
        entry: uvx --isolated security-review-ci@latest scan-deps --skip-unconfigured --require-database --allow-http --save --project security-review-mcp
        language: system
        files: ^(uv\.lock|pyproject\.toml|web/package(-lock)?\.json)$
      # Security review of each commit by your agent, in the background, never blocking;
      # see docs/contributing/checks-and-releases.md
      - id: agent-review
        name: agent security review
        entry: uvx --isolated security-review-ci@latest agent-review --project security-review-mcp
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false
