repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
        exclude: ^tests/ # scanner tests use fake key fixtures

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      # Prettier of web/ (version locked by web/package-lock.json, as in CI): run `npm ci` in web/ first
      - id: prettier
        name: prettier
        entry: npm --prefix web exec --no -- prettier --write --ignore-unknown
        language: system
        files: ^(web/src/.*\.(ts|html|css)|.*\.(ya?ml|json))$
      # Needs SECREVIEW_CONTROLLER_URL and a personal ci token in SECREVIEW_TOKEN (environment only)
      - id: scan-deps
        name: dependency scan
        entry: uvx --isolated security-review-ci scan-deps --skip-unconfigured --require-database --allow-http --save --project security-review-mcp
        language: system
        files: ^(uv\.lock|pyproject\.toml|web/package(-lock)?\.json)$
      # Security review of each commit by Claude Code, in the background (opt-in:
      # `prek install --hook-type post-commit`); see docs/contributing
      - id: agent-review
        name: agent security review
        entry: scripts/agent-review.sh
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false
