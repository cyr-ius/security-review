repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
        exclude: ^tests/ # scanner tests use fake key fixtures

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: scan-deps
        name: dependency scan
        entry: uv run --frozen security-review-mcp scan-deps --skip-unconfigured --require-database
        language: system
        files: ^(uv\.lock|pyproject\.toml|web/package(-lock)?\.json)$
