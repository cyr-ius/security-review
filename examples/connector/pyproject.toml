[project]
name = "secreview-acme-connector"
version = "0.1.0"
description = "Example connector for Security Review: findings as Acme risks"
requires-python = ">=3.14"
# Major version of Security Review whose connectors/api.py (API_VERSION) the connector targets
dependencies = ["security-review>=12,<13"]

# The controller loads it only when SECREVIEW_CONNECTORS_PLUGINS lists "acme"
[project.entry-points."security_review_mcp.connectors"]
acme = "acme_connector:AcmeConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acme_connector"]
