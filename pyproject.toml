[build-system]
# 77: license expression (PEP 639)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "security-review"
version = "10.0.0"
description = "MCP server for security code review: prompts, checklists, quick scans and persistent security reports"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2,<3",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.2",
    "fastapi>=0.162",
    "tomlkit>=0.13",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.10",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
    "tree-sitter-rust>=0.24,<0.25",
]

[project.urls]
Homepage = "https://github.com/cyr-ius/security-review"
Documentation = "https://cyr-ius.github.io/security-review/"
Repository = "https://github.com/cyr-ius/security-review"
Issues = "https://github.com/cyr-ius/security-review/issues"

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.5", "debugpy>=1.8"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]

[project.scripts]
security-review-mcp = "security_review_mcp.server:main"
security-review-controller = "security_review_mcp.controller:main"
security-review-ci = "security_review_mcp.ci_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_review_mcp = ["rules/default_rules.toml", "favicon.svg", "storage/migrations/script.py.mako", "webui/*", "webui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto"
markers = ["real_password_hashing: hash passwords with the production scrypt cost"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
