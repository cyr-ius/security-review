[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-review-mcp"
version = "1.0.0"
description = "MCP server for security code review: prompts, checklists, quick scans and persistent security reports"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2,<3",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.2",
    "fastapi>=0.135",
    "tomlkit>=0.13",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.10",
]

[project.urls]
Homepage = "https://github.com/cyr-ius/security-review-mcp"
Documentation = "https://cyr-ius.github.io/security-review-mcp/"
Repository = "https://github.com/cyr-ius/security-review-mcp"
Issues = "https://github.com/cyr-ius/security-review-mcp/issues"

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8", "ruff>=0.5", "debugpy>=1.8"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]

[project.scripts]
security-review-mcp = "security_review_mcp.server:main"
security-review-controller = "security_review_mcp.controller:main"
security-review-ci = "security_review_mcp.ci_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_review_mcp = ["default_rules.toml", "favicon.svg", "migrations/script.py.mako", "webui/*", "webui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
