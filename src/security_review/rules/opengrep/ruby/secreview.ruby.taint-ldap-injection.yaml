# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.ruby.taint-ldap-injection
    message: >-
      Request data is built into an LDAP search filter: characters such as *, ( and )
      rewrite the filter, to bypass a check or read other entries (LDAP injection). Build
      the filter with Net::LDAP::Filter.equals, or escape the value with
      Net::LDAP::Filter.escape.
    languages: [ruby]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: cookies
          - patterns:
              - pattern: request.$ATTR
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(params|parameters|query_parameters|request_parameters|path_parameters|headers|body|raw_post|query_string|cookies|referer|referrer|user_agent|fullpath|original_url|url)$
    pattern-propagators:
      # A value appended to a string or an array taints it (join...)
      - pattern: $TO << $FROM
        from: $FROM
        to: $TO
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.concat($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.unshift($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.prepend($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Net::LDAP::Filter.construct($FILTER)
              - pattern: Net::LDAP::Filter.from_rfc2254($FILTER)
              - pattern: "$LDAP.search(..., filter: $FILTER, ...)"
          # A Filter object built with equals/eq is no string to parse
          - metavariable-regex:
              metavariable: $FILTER
              regex: ^(?!Net::LDAP::Filter\.(equals|eq|present|begins|ends|contains)\b)
          - focus-metavariable: $FILTER
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.to_i
          - pattern: $X.to_f
          - pattern: Integer(...)
          - pattern: Float(...)
          - pattern: Net::LDAP::Filter.escape(...)
          - pattern: Net::LDAP::Filter.equals(...)
