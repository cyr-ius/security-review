# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.ruby.taint-log-injection
    message: >-
      Request data is written to the log as it is: a line break forges log entries that look
      legitimate and can mislead an investigation (log injection). Remove the line breaks
      (value.gsub(/[\r\n]/, " ")) or log the value in a structured field.
    languages: [ruby]
    severity: INFO
    metadata:
      category: security
      cwe: "CWE-117: Improper Output Neutralization for Logs"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: cookies
          - patterns:
              - pattern: request.$ATTR
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(params|parameters|query_parameters|request_parameters|path_parameters|headers|body|raw_post|query_string|cookies|referer|referrer|user_agent|fullpath|original_url|url)$
    pattern-propagators:
      # A value appended to a string or an array taints it (join...)
      - pattern: $TO << $FROM
        from: $FROM
        to: $TO
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.concat($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.unshift($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.prepend($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Rails.logger.$LEVEL($MESSAGE, ...)
              - pattern: logger.$LEVEL($MESSAGE, ...)
              - pattern: $LOGGER.$LEVEL($MESSAGE, ...)
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(debug|info|warn|error|fatal|unknown)$
          - metavariable-regex:
              metavariable: $LOGGER
              regex: (?i).*log.*
          - focus-metavariable: $MESSAGE
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.to_i
          - pattern: $X.inspect
          - pattern: $X.to_json
          - patterns:
              - pattern-either:
                  - pattern: $VALUE.gsub($CHARS, ...)
                  - pattern: $VALUE.tr($CHARS, ...)
                  - pattern: $VALUE.delete($CHARS)
              - metavariable-regex:
                  metavariable: $CHARS
                  regex: .*(\\[rn]|[\r\n])
