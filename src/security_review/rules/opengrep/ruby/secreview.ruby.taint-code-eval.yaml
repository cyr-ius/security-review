# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.ruby.taint-code-eval
    message: >-
      Request data chooses code, a method or a class run at runtime (eval, send, constantize). Map the value to an allow-list of methods or classes.
    languages: [ruby]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: cookies
          - patterns:
              - pattern: request.$ATTR
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(params|parameters|query_parameters|request_parameters|path_parameters|headers|body|raw_post|query_string|cookies|referer|referrer|user_agent|fullpath|original_url|url)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.to_i
          - pattern: $X.to_f
          - pattern: Integer(...)
          - pattern: Float(...)
          # A record found in the database (User.find_by(name: params[:name]).avatar) is not
          # request data
          - patterns:
              - pattern: $MODEL.$FIND(...)
              - metavariable-regex:
                  metavariable: $FIND
                  regex: ^(find|find_by|find_by!|find_or_create_by|first|last|take)$
    pattern-propagators:
      # A value appended to a string or an array taints it (join...)
      - pattern: $TO << $FROM
        from: $FROM
        to: $TO
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.concat($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.unshift($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.prepend($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE, ...)
              - pattern: $O.instance_eval($CODE, ...)
              - pattern: $O.class_eval($CODE, ...)
              - pattern: $O.module_eval($CODE, ...)
              - pattern: $O.send($CODE, ...)
              - pattern: $O.public_send($CODE, ...)
              - pattern: $O.__send__($CODE, ...)
              - pattern: $O.method($CODE)
              - pattern: Object.const_get($CODE, ...)
              - pattern: $CODE.constantize
              - pattern: $CODE.safe_constantize
          - focus-metavariable: $CODE
