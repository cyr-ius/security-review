# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.taint-host-header
    message: >-
      The host name of the request (Host or X-Forwarded-Host header) is written into an e-mail: an
      attacker who requests a password reset for a victim with a forged Host header receives the
      reset token when the victim clicks the link. Build the links of e-mails from a configured base
      URL, or check the host against an allow-list (Spring:
      ServletUriComponentsBuilder.fromCurrentRequest() reads the Host header).
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.getServerName()
          - pattern: $REQ.getRequestURL()
          - pattern: ServletUriComponentsBuilder.fromCurrentRequest()
          - pattern: ServletUriComponentsBuilder.fromCurrentContextPath()
          - pattern: ServletUriComponentsBuilder.fromCurrentRequestUri()
          - pattern: ServletUriComponentsBuilder.fromRequest(...)
          - pattern: ServletUriComponentsBuilder.fromContextPath(...)
          - patterns:
              - pattern: $REQ.getHeader($KEY)
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^"(host|x-forwarded-host)"$
    pattern-propagators:
      # A value appended to a StringBuilder or a writer taints what is built
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM, ...)
        from: $FROM
        to: $TO
      - pattern: $TO.insert($INDEX, $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.write($FROM)
        from: $FROM
        to: $TO
      # A value added to a collection taints it (String.join, a query builder...)
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($INDEX, $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.addAll($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.put($KEY, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $MESSAGE.setText(...)
                  - pattern: $MESSAGE.setContent(...)
              - metavariable-regex:
                  metavariable: $MESSAGE
                  regex: (?i).*(message|mail|helper|msg|part).*
