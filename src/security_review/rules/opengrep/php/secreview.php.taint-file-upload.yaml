# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-file-upload
    message: >-
      An uploaded file is saved under the name chosen by the client ($_FILES[...]['name'],
      getClientOriginalName, getClientOriginalExtension): a file named shell.php in a
      directory served by the web server runs as code. basename() does not help. Name the
      file on the server (hashName(), random_bytes) with an extension taken from an allow-
      list, and store uploads outside the web root.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-434: Unrestricted Upload of File with Dangerous Type"
      owasp: "A04:2021 - Insecure Design"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Superglobals (plain PHP)
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: getallheaders()
          # Laravel: $request->input('x'), request('x'), Request::input('x')
          - patterns:
              - pattern: $REQ->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|query|post|get|cookie|header|all|json|file|route|string|integer|only|except)$
          - pattern: request(...)
          - pattern: request()->$GET(...)
          - pattern: Request::$GET(...)
          # Symfony: $request->query->get('x'), $request->request->all()...
          - patterns:
              - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: move_uploaded_file($TMP, $PATH)
              - pattern: $FILE->move($DIR, $PATH)
              - pattern: $FILE->storeAs($DIR, $PATH, ...)
              - pattern: $FILE->storePubliclyAs($DIR, $PATH, ...)
              - pattern: Storage::putFileAs($DIR, $FILE, $PATH, ...)
          - focus-metavariable: $PATH
    pattern-sanitizers:
      - pattern-either:
          - pattern: $FILE->hashName(...)
          - pattern: $FILE->extension()
          - pattern: $FILE->guessExtension()
          - pattern: uniqid(...)
          - pattern: bin2hex(...)
          - pattern: Str::uuid()
          - pattern: Str::random(...)
