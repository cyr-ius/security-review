# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-nosql-injection
    message: >-
      Request data is a value of a MongoDB filter: PHP turns a parameter such as user[$ne]=x
      into an array, so the client sends an operator ($ne, $gt, $regex, $where) and reads or
      changes other documents. Cast the value to a string ((string) $value, strval) before
      putting it in the filter.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Superglobals (plain PHP)
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: getallheaders()
          # Laravel: $request->input('x'), request('x'), Request::input('x')
          - patterns:
              - pattern: $REQ->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|query|post|get|cookie|header|all|json|file|route|string|integer|only|except)$
          - pattern: request(...)
          - pattern: request()->$GET(...)
          - pattern: Request::$GET(...)
          # Symfony: $request->query->get('x'), $request->request->all()...
          - patterns:
              - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $COLLECTION->$METHOD([..., $KEY => $VALUE, ...], ...)
              - pattern: $COLLECTION->$METHOD([..., $KEY => [..., $OP => $VALUE, ...], ...], ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(find|findOne|findOneAndUpdate|findOneAndDelete|findOneAndReplace|deleteOne|deleteMany|updateOne|updateMany|replaceOne|countDocuments|count|distinct)$
          - focus-metavariable: $VALUE
      - patterns:
          - pattern: $COLLECTION->$METHOD([..., '$where' => $VALUE, ...], ...)
          - focus-metavariable: $VALUE
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: (int) $X
          - pattern: (float) $X
          - pattern: (string) $X
          - pattern: strval(...)
          - pattern: (bool) $X
