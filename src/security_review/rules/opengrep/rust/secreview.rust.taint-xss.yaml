# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.rust.taint-xss
    message: >-
      Request data is sent as HTML without escaping (XSS). Render it with a template engine that
      escapes by default (askama, maud, tera with autoescape) or escape it
      (html_escape::encode_text).
    languages: [rust]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  fn $F(..., $ARG: $EXTRACTOR<$T>, ...) { ... }
              - pattern: $ARG
              - metavariable-regex:
                  metavariable: $EXTRACTOR
                  regex: ^((axum::extract::|web::)?(Query|Path|Json|Form))$
              # An integer, boolean or UUID extractor cannot carry SQL
              - metavariable-regex:
                  metavariable: $T
                  regex: ^(?!(i8|i16|i32|i64|i128|isize|u8|u16|u32|u64|u128|usize|bool|Uuid|uuid::Uuid)$)
          - pattern: "($REQ : HttpRequest).query_string()"
          - pattern: "($REQ : HttpRequest).match_info()"
    pattern-propagators:
      # A value pushed to a String or a Vec taints it (join...)
      - pattern: $TO.push_str($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.extend($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.insert($INDEX, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Html($HTML)
              - pattern: axum::response::Html($HTML)
              - pattern: $RESPONSE.content_type("text/html").body($HTML)
              - pattern: $RESPONSE.content_type(ContentType::html()).body($HTML)
          - focus-metavariable: $HTML
    pattern-sanitizers:
      - pattern-either:
          - pattern: html_escape::encode_text(...)
          - pattern: encode_text(...)
          - pattern: html_escape::encode_safe(...)
          - pattern: ammonia::clean(...)
          - pattern: $VALUE.parse::<$T>()
          - pattern: Uuid::parse_str(...)
