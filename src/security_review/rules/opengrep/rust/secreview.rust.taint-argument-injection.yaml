# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.rust.taint-argument-injection
    message: >-
      Request data is passed as an argument of std::process::Command: a value that starts
      with "-" becomes an option of the program (git --upload-pack, ssh -oProxyCommand, curl
      -o, tar --checkpoint-action...), which runs commands or writes files. Quoting does not
      help. Put "--" before the values, refuse a value that starts with "-", or pass it as
      the value of a long option ("--branch=" + value).
    languages: [rust]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-88: Improper Neutralization of Argument Delimiters in a Command ('Argument Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  fn $F(..., $ARG: $EXTRACTOR<$T>, ...) { ... }
              - pattern: $ARG
              - metavariable-regex:
                  metavariable: $EXTRACTOR
                  regex: ^((axum::extract::|web::)?(Query|Path|Json|Form))$
              # An integer, boolean or UUID extractor cannot carry SQL
              - metavariable-regex:
                  metavariable: $T
                  regex: ^(?!(i8|i16|i32|i64|i128|isize|u8|u16|u32|u64|u128|usize|bool|Uuid|uuid::Uuid)$)
          - pattern: "($REQ : HttpRequest).query_string()"
          - pattern: "($REQ : HttpRequest).match_info()"
    pattern-propagators:
      # A value pushed to a String or a Vec taints it (join...)
      - pattern: $TO.push_str($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.extend($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.insert($INDEX, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Command::new($PROG). ... .arg($ARG)
              - pattern: Command::new($PROG). ... .args([..., $ARG, ...])
              - pattern: Command::new($PROG). ... .args(&[..., $ARG, ...])
              - pattern: std::process::Command::new($PROG). ... .arg($ARG)
              - pattern: std::process::Command::new($PROG). ... .args([..., $ARG, ...])
              - pattern: std::process::Command::new($PROG). ... .args(&[..., $ARG, ...])
              - pattern: tokio::process::Command::new($PROG). ... .arg($ARG)
              - pattern: tokio::process::Command::new($PROG). ... .args([..., $ARG, ...])
              - pattern: tokio::process::Command::new($PROG). ... .args(&[..., $ARG, ...])
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          let mut $C = Command::new($PROG);
                          ...
                      - pattern-inside: |
                          let mut $C = std::process::Command::new($PROG);
                          ...
                      - pattern-inside: |
                          let mut $C = tokio::process::Command::new($PROG);
                          ...
                  - pattern-not-inside: |
                      $C.arg("--");
                      ...
                  - pattern-either:
                      - pattern: $C.arg($ARG)
                      - pattern: $C.args([..., $ARG, ...])
                      - pattern: $C.args(&[..., $ARG, ...])
                  - pattern-not: $C.args([..., "--", ..., $ARG, ...])
          - pattern-not: Command::new($PROG). ... .arg("--"). ... .arg($ARG)
          - pattern-not: std::process::Command::new($PROG). ... .arg("--"). ... .arg($ARG)
          - pattern-not: tokio::process::Command::new($PROG). ... .arg("--"). ... .arg($ARG)
          - pattern-not: Command::new($PROG). ... .args([..., "--", ..., $ARG, ...])
          - pattern-not: std::process::Command::new($PROG). ... .args([..., "--", ..., $ARG, ...])
          - pattern-not: tokio::process::Command::new($PROG). ... .args([..., "--", ..., $ARG, ...])
          - metavariable-regex:
              metavariable: $PROG
              regex: '^["''`](?:[^"''`]*/)?(git|hg|svn|ssh|scp|sftp|rsync|curl|wget|tar|zip|unzip|7z|7za|find|xargs|sed|awk|gawk|ffmpeg|convert|magick|gs|wkhtmltopdf|soffice|libreoffice|chromium|google-chrome|openssl|gpg|psql|mysql|mysqldump|pg_dump|docker|kubectl|helm|sudo|env|npm|npx|pip|man|less)["''`]$'
          - metavariable-regex:
              metavariable: $ARG
              regex: "^(?!&?(?:format!\\()?(?:f|\\$|@)?[\"'`][^\"'`{#$\\\\])"
          - focus-metavariable: $ARG
    pattern-sanitizers:
      - pattern-either:
          - pattern: $VALUE.parse::<$T>()
          - pattern: Uuid::parse_str(...)
