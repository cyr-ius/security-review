# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.csharp.taint-host-header
    message: >-
      The host name of the request (Host or X-Forwarded-Host header) is written into an e-mail: an
      attacker who requests a password reset for a victim with a forged Host header receives the
      reset token when the victim clicks the link. Build the links of e-mails from a configured base
      URL, or check the host against an allow-list (ASP.NET Core: set AllowedHosts or the host
      filtering middleware).
    languages: [csharp]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: Request.Host
                  - pattern: HttpContext.Request.Host
                  - pattern: $CTX.Request.Host
          - patterns:
              - pattern-either:
                  - pattern: Request.Headers[$KEY]
                  - pattern: $CTX.Request.Headers[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^"(host|x-forwarded-host)"$
          # An absolute URL built for a request (the template of ASP.NET Core Identity)
          - pattern: "Url.Action(..., protocol: $SCHEME, ...)"
          - pattern: "Url.Page(..., protocol: $SCHEME, ...)"
          - pattern: Url.ActionLink(...)
          - pattern: Url.PageLink(...)
    pattern-propagators:
      # A value appended to a StringBuilder or a writer taints what is built
      - pattern: $TO.Append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.AppendLine($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.AppendFormat(..., $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.Insert($INDEX, $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.Write($FROM)
        from: $FROM
        to: $TO
      # A value added to a collection taints it (string.Join...)
      - pattern: $TO.Add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.AddRange($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.Add($KEY, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - pattern-either:
          - pattern: $SENDER.SendEmailAsync(...)
          - pattern: $CLIENT.SendMailAsync(...)
          - pattern: new MailMessage(...)
          - pattern: $MESSAGE.Body = $BODY
          - pattern: $BUILDER.HtmlBody = $BODY
          - pattern: $BUILDER.TextBody = $BODY
