# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.go.taint-sql
    message: >-
      Request data reaches a SQL query built as a string (fmt.Sprintf or concatenation). Pass the
      value as a placeholder argument (db.Query("... WHERE id = $1", id)) instead of formatting it
      into the query.
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: "($REQ : *http.Request).FormValue(...)"
          - pattern: "($REQ : *http.Request).PostFormValue(...)"
          - pattern: "($REQ : *http.Request).PathValue(...)"
          - pattern: "($REQ : *http.Request).URL.Query()"
          - pattern: "($REQ : *http.Request).URL.RawQuery"
          - pattern: "($REQ : *http.Request).URL.Path"
          - pattern: "($REQ : *http.Request).Form"
          - pattern: "($REQ : *http.Request).PostForm"
          - pattern: "($REQ : *http.Request).Header"
          - pattern: "($REQ : *http.Request).Body"
          - pattern: "($REQ : *http.Request).Cookie(...)"
          - pattern: mux.Vars(...)
          - pattern: chi.URLParam(...)
          - patterns:
              - pattern: "($CTX : *gin.Context).$METHOD(...)"
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(Query|DefaultQuery|Param|PostForm|DefaultPostForm|GetHeader|GetQuery|GetPostForm|QueryArray|FormFile|Cookie)$
          - patterns:
              - pattern: "($CTX : echo.Context).$METHOD(...)"
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(QueryParam|Param|FormValue|QueryParams|FormParams|Cookie)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Query($QUERY, ...)
              - pattern: $DB.QueryRow($QUERY, ...)
              - pattern: $DB.Exec($QUERY, ...)
              - pattern: $DB.Prepare($QUERY)
              - pattern: $DB.QueryContext($CTX, $QUERY, ...)
              - pattern: $DB.QueryRowContext($CTX, $QUERY, ...)
              - pattern: $DB.ExecContext($CTX, $QUERY, ...)
              - pattern: $DB.PrepareContext($CTX, $QUERY)
              - pattern: $DB.Raw($QUERY, ...)
              - pattern: $DB.Select($DEST, $QUERY, ...)
              - pattern: $DB.Get($DEST, $QUERY, ...)
          - focus-metavariable: $QUERY
    pattern-sanitizers:
      - pattern-either:
          - pattern: strconv.Atoi(...)
          - pattern: strconv.ParseInt(...)
          - pattern: strconv.ParseUint(...)
          - pattern: uuid.Parse(...)
