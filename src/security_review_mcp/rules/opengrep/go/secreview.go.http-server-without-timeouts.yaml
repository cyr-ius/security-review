# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.go.http-server-without-timeouts
    message: >-
      An HTTP server is started without read timeouts (http.ListenAndServe or an http.Server
      without ReadHeaderTimeout or ReadTimeout): slow clients can hold every connection open
      (Slowloris). Use an http.Server with ReadHeaderTimeout, ReadTimeout and WriteTimeout.
    languages: [go]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: http.ListenAndServe(...)
      - pattern: http.ListenAndServeTLS(...)
      - pattern: http.Serve(...)
      - patterns:
          - pattern: "&http.Server{...}"
          - pattern-not: "&http.Server{..., ReadHeaderTimeout: $T, ...}"
          - pattern-not: "&http.Server{..., ReadTimeout: $T, ...}"
