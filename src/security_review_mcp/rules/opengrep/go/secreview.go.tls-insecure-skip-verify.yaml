# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.go.tls-insecure-skip-verify
    message: >-
      InsecureSkipVerify is set on a TLS configuration: any certificate is accepted and a network
      attacker can impersonate the server. Remove it and add the private certificate authority to
      RootCAs.
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"
      - pattern: $CONFIG.InsecureSkipVerify = true
