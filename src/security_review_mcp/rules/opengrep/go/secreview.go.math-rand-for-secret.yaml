# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.go.math-rand-for-secret
    message: >-
      math/rand generates a value that is stored in a token, key, password, nonce or session
      identifier: its output is predictable. Use crypto/rand (rand.Read, rand.Text in Go 1.24+).
    languages: [go]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern-either:
          - pattern-inside: |
              import "math/rand"
              ...
          - pattern-inside: |
              import "math/rand/v2"
              ...
      - pattern-either:
          - pattern: $SECRET := <... rand.$FUNC(...) ...>
          - pattern: $SECRET = <... rand.$FUNC(...) ...>
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(token|secret|password|passwd|nonce|salt|session|otp|apikey|api_key|key)$
