# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.go.non-constant-time-compare
    message: >-
      A signature, token or secret is compared with ==, != or bytes.Equal: the comparison stops at
      the first different byte, and its timing reveals the expected value byte by byte. Use
      hmac.Equal or subtle.ConstantTimeCompare.
    languages: [go]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-208: Observable Timing Discrepancy"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $LEFT == $RIGHT
              - pattern: $LEFT != $RIGHT
              - pattern: bytes.Equal($LEFT, $RIGHT)
          - metavariable-regex:
              metavariable: $LEFT
              regex: ^(?![A-Z0-9_]+$)(?![A-Z]\w*\.)(?i:.*(signature|hmac|mac|token|secret|api_?key|otp|nonce))$
          - metavariable-regex:
              metavariable: $RIGHT
              regex: ^(?![A-Z0-9_]+$)(?![A-Z]\w*\.)(?i:.*(signature|hmac|mac|token|secret|api_?key|otp|nonce))$
      - pattern: bytes.Equal($X, $MAC.Sum(nil))
      - pattern: bytes.Equal($MAC.Sum(nil), $X)
