# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.go.cookie-insecure
    message: >-
      A session or token cookie is created without Secure or HttpOnly: it is sent over plain HTTP
      or readable by a script after an XSS. Set Secure: true and HttpOnly: true (and SameSite) in
      the http.Cookie literal.
    languages: [go]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: "http.Cookie{..., Secure: false, ...}"
      - pattern: "http.Cookie{..., HttpOnly: false, ...}"
      - patterns:
          - pattern: "http.Cookie{..., Name: $NAME, ...}"
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(session|token|auth|sid|jwt|csrf|remember).*
          - pattern-not: "http.Cookie{..., Secure: true, ..., HttpOnly: true, ...}"
          - pattern-not: "http.Cookie{..., HttpOnly: true, ..., Secure: true, ...}"
