# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.go.taint-path-traversal
    message: >-
      Request data is used as a file path: "../" sequences or an absolute path can read or
      overwrite any file. Keep only the base name (filepath.Base), use os.Root (Go 1.24+), or
      clean the path and check that it stays inside the expected directory.
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: "($REQ : *http.Request).FormValue(...)"
          - pattern: "($REQ : *http.Request).PostFormValue(...)"
          - pattern: "($REQ : *http.Request).PathValue(...)"
          - pattern: "($REQ : *http.Request).URL.Query()"
          - pattern: "($REQ : *http.Request).URL.RawQuery"
          - pattern: "($REQ : *http.Request).URL.Path"
          - pattern: "($REQ : *http.Request).Form"
          - pattern: "($REQ : *http.Request).PostForm"
          - pattern: "($REQ : *http.Request).Header"
          - pattern: "($REQ : *http.Request).Body"
          - pattern: "($REQ : *http.Request).Cookie(...)"
          - pattern: mux.Vars(...)
          - pattern: chi.URLParam(...)
          - patterns:
              - pattern: "($CTX : *gin.Context).$METHOD(...)"
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(Query|DefaultQuery|Param|PostForm|DefaultPostForm|GetHeader|GetQuery|GetPostForm|QueryArray|FormFile|Cookie)$
          - patterns:
              - pattern: "($CTX : echo.Context).$METHOD(...)"
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(QueryParam|Param|FormValue|QueryParams|FormParams|Cookie)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($PATH)
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.ReadFile($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: ioutil.ReadFile($PATH)
              - pattern: http.ServeFile($W, $R, $PATH)
              - pattern: "($CTX : *gin.Context).File($PATH)"
          - focus-metavariable: $PATH
    pattern-sanitizers:
      - pattern-either:
          - pattern: filepath.Base(...)
          - pattern: path.Base(...)
