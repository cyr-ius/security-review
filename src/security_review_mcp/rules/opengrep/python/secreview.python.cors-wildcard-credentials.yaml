# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.cors-wildcard-credentials
    message: >-
      CORS accepts every origin while allowing credentials: any website can send authenticated
      requests and read the answers. List the allowed origins explicitly.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: |
          $APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)
      - pattern: |
          $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origins=["*"], ...)
      - pattern: |
          $APP.add_middleware(CORSMiddleware, ..., allow_origin_regex=".*", ..., allow_credentials=True, ...)
      - pattern: flask_cors.CORS(..., supports_credentials=True, ..., origins="*", ...)
      - pattern: flask_cors.CORS(..., origins="*", ..., supports_credentials=True, ...)
