# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.weak-hash-for-security
    message: >-
      MD5 or SHA-1 hashes a password, secret, token or signature: both are broken for this use
      (collisions, fast brute force). Use SHA-256 or better, HMAC for signatures and a password hash
      such as Argon2id, scrypt or bcrypt for passwords.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    # MD5 and SHA-1 stay fine for cache keys, checksums and ETags: only a secret counts
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: hashlib.md5($...ARGS)
              - pattern: hashlib.sha1($...ARGS)
              - pattern: hashlib.new("md5", $...ARGS)
              - pattern: hashlib.new("sha1", $...ARGS)
              - pattern: hashlib.new("MD5", $...ARGS)
              - pattern: hashlib.new("SHA1", $...ARGS)
          - pattern-not: hashlib.$FUNC(..., usedforsecurity=False, ...)
          - metavariable-regex:
              metavariable: $...ARGS
              regex: (?i).*(password|passwd|pwd|secret|token|signature|hmac|otp|nonce|salt|api_?key|credential).*
      - patterns:
          - pattern-either:
              - pattern: hashlib.md5($...ARGS)
              - pattern: hashlib.sha1($...ARGS)
              - pattern: hashlib.new("md5", $...ARGS)
              - pattern: hashlib.new("sha1", $...ARGS)
              - pattern: hashlib.new("MD5", $...ARGS)
              - pattern: hashlib.new("SHA1", $...ARGS)
          - pattern-not: hashlib.$FUNC(..., usedforsecurity=False, ...)
          - pattern-inside: $TARGET = ...
          - metavariable-regex:
              metavariable: $TARGET
              regex: (?i).*(password|passwd|pwd|secret|token|signature|hmac|otp|nonce|salt|api_?key|credential).*
