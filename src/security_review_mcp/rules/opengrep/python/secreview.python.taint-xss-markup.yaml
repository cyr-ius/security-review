# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.taint-xss-markup
    message: >-
      Request data is marked as safe HTML (Markup, mark_safe, format_html with a dynamic format
      string): template autoescaping no longer applies and the value can inject scripts. Let the
      template escape the value, or escape it with markupsafe.escape.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - patterns:
              - pattern: $REQ.$ATTR
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(GET|POST|COOKIES|FILES|META|body|headers|cookies|query_params|path_params|args|form|values|json|data)$
          - patterns:
              - pattern: await $REQ.$METHOD()
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(json|form|body)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: Annotated[str, ...], ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: Annotated[str, ...], ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: markupsafe.Markup($HTML)
              - pattern: flask.Markup($HTML)
              - pattern: django.utils.safestring.mark_safe($HTML)
              - pattern: django.utils.html.format_html($HTML, ...)
              - pattern: django.http.HttpResponse($HTML, ...)
              - pattern: fastapi.responses.HTMLResponse($HTML, ...)
              - pattern: starlette.responses.HTMLResponse($HTML, ...)
          - focus-metavariable: $HTML
    pattern-sanitizers:
      - pattern-either:
          - pattern: markupsafe.escape(...)
          - pattern: html.escape(...)
          - pattern: django.utils.html.escape(...)
          - pattern: bleach.clean(...)
          - pattern: nh3.clean(...)
