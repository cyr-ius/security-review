# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.taint-open-redirect
    message: >-
      Request data is used as a redirect target: an attacker can send users to a phishing site
      with a link to this application. Redirect to a relative path only, or check the target
      against an allow-list (url_has_allowed_host_and_scheme in Django).
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - patterns:
              - pattern: $REQ.$ATTR
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(GET|POST|COOKIES|FILES|META|body|headers|cookies|query_params|path_params|args|form|values|json|data)$
          - patterns:
              - pattern: await $REQ.$METHOD()
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(json|form|body)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: Annotated[str, ...], ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: Annotated[str, ...], ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.redirect($URL, ...)
              - pattern: django.shortcuts.redirect($URL, ...)
              - pattern: django.http.HttpResponseRedirect($URL, ...)
              - pattern: starlette.responses.RedirectResponse($URL, ...)
              - pattern: fastapi.responses.RedirectResponse($URL, ...)
          - pattern-not-inside: |
              if <... url_has_allowed_host_and_scheme(...) ...>:
                ...
          - focus-metavariable: $URL
    pattern-sanitizers:
      - pattern-either:
          - pattern: django.urls.reverse(...)
          - pattern: flask.url_for(...)
          - pattern: $REQUEST.url_for(...)
      # Django checks the URL in place: the value is safe after the call
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: django.utils.http.url_has_allowed_host_and_scheme($URL, ...)
              - pattern: django.utils.http.url_has_allowed_host_and_scheme(url=$URL, ...)
          - focus-metavariable: $URL
