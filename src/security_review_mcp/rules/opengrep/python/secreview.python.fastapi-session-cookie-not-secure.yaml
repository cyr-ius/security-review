# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.fastapi-session-cookie-not-secure
    message: >-
      SessionMiddleware sends its session cookie without the Secure attribute unless
      https_only=True: the browser also sends it over plain HTTP, where it can be read and reused.
      Set https_only=True (and keep same_site at lax or strict).
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: HIGH
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern-either:
          - pattern: $APP.add_middleware(SessionMiddleware, ...)
          - pattern: $APP.add_middleware(starlette.middleware.sessions.SessionMiddleware, ...)
          - pattern: Middleware(SessionMiddleware, ...)
          - pattern: starlette.middleware.Middleware(starlette.middleware.sessions.SessionMiddleware, ...)
      - pattern-not: $APP.add_middleware($M, ..., https_only=True, ...)
      - pattern-not: Middleware($M, ..., https_only=True, ...)
