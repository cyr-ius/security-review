# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.taint-deserialization
    message: >-
      Request data is deserialized with pickle, marshal, dill, jsonpickle or an unsafe YAML
      loader: deserializing untrusted bytes runs arbitrary code. Use a data-only format (JSON,
      yaml.safe_load) and validate it with a schema.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          # aiohttp, Azure Functions, Tornado
          - patterns:
              - pattern: $REQ.get_json(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
          - patterns:
              - pattern: self.$GET(...)
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(get_argument|get_arguments|get_body_argument|get_body_arguments|get_query_argument|get_query_arguments|get_cookie)$
          # Remote data outside a web framework: sockets, websockets, serverless events.
          # Local data (command line, standard input, environment) is left out on purpose: a
          # command line tool acting on what its own user asks crosses no trust boundary.
          - pattern: $SOCKET.recv(...)
          - pattern: $SOCKET.recvfrom(...)
          - pattern: await $WEBSOCKET.recv()
          - pattern: await $WEBSOCKET.receive_text()
          - pattern: await $WEBSOCKET.receive_json()
          - patterns:
              - pattern-inside: |
                  def $HANDLER(event, context): ...
              - pattern: event
          - patterns:
              - pattern: $REQ.$ATTR
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $ATTR
                  # url, path and full_path are left out: a client request object (requests) has them too
                  regex: ^(GET|POST|COOKIES|FILES|META|body|headers|cookies|query_params|path_params|args|form|values|json|data|query_string|environ|query|forms|params|matchdict|match_info|json_body|route_params|files)$
          - patterns:
              - pattern: await $REQ.$METHOD()
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(json|form|body|post|text|read)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: Annotated[str, ...], ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: Annotated[str, ...], ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern: $P
    pattern-propagators:
      # A request value added to a list or a dict taints the container (argument lists, kwargs)
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.extend($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.insert($INDEX, $FROM)
        from: $FROM
        to: $TO
      # A request value stored in a container (configparser, cache, set, dict) taints it
      - pattern: $TO.set(..., $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.put(..., $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.update($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.setdefault($KEY, $FROM)
        from: $FROM
        to: $TO
      # A value written to a text buffer (io.StringIO) taints what is read back
      - pattern: $TO.write($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: pickle.loads($DATA, ...)
              - pattern: pickle.load($DATA, ...)
              - pattern: _pickle.loads($DATA, ...)
              - pattern: marshal.loads($DATA, ...)
              - pattern: dill.loads($DATA, ...)
              - pattern: jsonpickle.decode($DATA, ...)
              - pattern: yaml.unsafe_load($DATA, ...)
              - pattern: yaml.load($DATA, Loader=yaml.Loader, ...)
              - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader, ...)
              - pattern: yaml.load($DATA, Loader=yaml.FullLoader, ...)
          - focus-metavariable: $DATA
