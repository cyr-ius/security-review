# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.taint-ssrf
    message: >-
      Request data is used as the URL of an outgoing request (SSRF): an attacker can reach
      internal services or cloud metadata endpoints. Build the URL from a fixed base and check the
      host against an allow-list.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - patterns:
              - pattern: $REQ.$ATTR
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(GET|POST|COOKIES|FILES|META|body|headers|cookies|query_params|path_params|args|form|values|json|data)$
          - patterns:
              - pattern: await $REQ.$METHOD()
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(json|form|body)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: Annotated[str, ...], ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: Annotated[str, ...], ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$METHOD($URL, ...)
              - pattern: requests.request($VERB, $URL, ...)
              - pattern: httpx.$METHOD($URL, ...)
              - pattern: httpx.request($VERB, $URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.Request($URL, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          with $FACTORY(...) as $CLIENT:
                            ...
                      - pattern-inside: |
                          async with $FACTORY(...) as $CLIENT:
                            ...
                      - pattern-inside: |
                          $CLIENT = $FACTORY(...)
                          ...
                  - metavariable-regex:
                      metavariable: $FACTORY
                      regex: ^(httpx[.]Client|httpx[.]AsyncClient|requests[.]Session|aiohttp[.]ClientSession)$
                  - pattern: $CLIENT.$METHOD($URL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|head|options|stream|request)$
          - focus-metavariable: $URL
