# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.taint-xss-response
    message: >-
      Request data is sent back in an HTML response without escaping (a string returned by a Flask
      route, make_response, Response, Django HttpResponse, FastAPI HTMLResponse): it can inject
      scripts in the page. Render a template (Jinja escapes by default), return JSON with jsonify, or
      escape the value with markupsafe.escape or html.escape.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          # aiohttp, Azure Functions, Tornado
          - patterns:
              - pattern: $REQ.get_json(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
          - patterns:
              - pattern: self.$GET(...)
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(get_argument|get_arguments|get_body_argument|get_body_arguments|get_query_argument|get_query_arguments|get_cookie)$
          - patterns:
              - pattern: $REQ.$ATTR
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $ATTR
                  # url, path and full_path are left out: a client request object (requests) has them too
                  regex: ^(GET|POST|COOKIES|FILES|META|body|headers|cookies|query_params|path_params|args|form|values|json|data|query_string|environ|query|forms|params|matchdict|match_info|json_body|route_params|files)$
          - patterns:
              - pattern: await $REQ.$METHOD()
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(json|form|body|post|text|read)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: Annotated[str, ...], ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: Annotated[str, ...], ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern: $P
    pattern-propagators:
      # A request value added to a list or a dict taints the container (argument lists, kwargs)
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.extend($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.insert($INDEX, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          @$APP.$ROUTE(...)
                          def $VIEW(...):
                              ...
                      - pattern-inside: |
                          @$APP.$ROUTE(...)
                          async def $VIEW(...):
                              ...
                  - metavariable-regex:
                      metavariable: $ROUTE
                      regex: ^(route|get|post|put|patch|delete)$
                  # Flask sends a returned str as HTML; FastAPI encodes it as JSON
                  - pattern-either:
                      - pattern-inside: |
                          from flask import $NAME
                          ...
                      - pattern-inside: |
                          import flask
                          ...
                  - pattern: return $HTML
                  # Flask sends a returned dict or list as JSON
                  - pattern-not: return {...}
                  - pattern-not: return [...]
              - pattern: flask.make_response($HTML, ...)
              - pattern: flask.Response($HTML, ...)
              - pattern: django.http.HttpResponse($HTML, ...)
              - pattern: fastapi.responses.HTMLResponse($HTML, ...)
              - pattern: starlette.responses.HTMLResponse($HTML, ...)
          - focus-metavariable: $HTML
    pattern-sanitizers:
      - pattern-either:
          - pattern: flask.render_template(...)
          - pattern: django.shortcuts.render(...)
          - pattern: $TEMPLATES.TemplateResponse(...)
          - pattern: flask.jsonify(...)
          - pattern: json.dumps(...)
          - pattern: markupsafe.escape(...)
          - pattern: flask.escape(...)
          - pattern: html.escape(...)
          - pattern: django.utils.html.escape(...)
          - pattern: int(...)
          - pattern: float(...)
          - pattern: flask.redirect(...)
          - pattern: flask.url_for(...)
          # Files, redirects and the rules of their own (Markup, template injection)
          - pattern: flask.send_file(...)
          - pattern: flask.send_from_directory(...)
          - pattern: $RESPONSES.FileResponse(...)
          - pattern: $RESPONSES.RedirectResponse(...)
          - pattern: FileResponse(...)
          - pattern: RedirectResponse(...)
          - pattern: markupsafe.Markup(...)
          - pattern: flask.Markup(...)
          - pattern: flask.render_template_string(...)
