# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.taint-trust-boundary
    message: >-
      Request data is stored in the session (Flask session, Django request.session): later code reads
      session values as trusted values set by the server, so the client can plant data there (trust
      boundary violation). Validate the value before storing it, and keep the session keys constant.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-501: Trust Boundary Violation"
      owasp: "A04:2021 - Insecure Design"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          # aiohttp, Azure Functions, Tornado
          - patterns:
              - pattern: $REQ.get_json(...)
              - metavariable-regex:
                  metavariable: $REQ
                  # self.request: Django class-based views, Tornado handlers
                  regex: ^(self\.)?(request|req)$
          - patterns:
              - pattern: self.$GET(...)
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(get_argument|get_arguments|get_body_argument|get_body_arguments|get_query_argument|get_query_arguments|get_cookie)$
          - patterns:
              - pattern: $REQ.$ATTR
              - metavariable-regex:
                  metavariable: $REQ
                  # self.request: Django class-based views, Tornado handlers
                  regex: ^(self\.)?(request|req)$
              - metavariable-regex:
                  metavariable: $ATTR
                  # url, path and full_path are left out: a client request object (requests) has them too
                  regex: ^(GET|POST|COOKIES|FILES|META|body|headers|cookies|query_params|path_params|args|form|values|json|data|query_string|environ|query|forms|params|matchdict|match_info|json_body|route_params|files)$
          - patterns:
              - pattern: await $REQ.$METHOD()
              - metavariable-regex:
                  metavariable: $REQ
                  # self.request: Django class-based views, Tornado handlers
                  regex: ^(self\.)?(request|req)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(json|form|body|post|text|read)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: Annotated[str, ...], ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: Annotated[str, ...], ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern: $P
          # Route parameters declared without a type: Flask "<name>" segments, FastAPI query
          # parameters (a dependency, "= Depends(...)", is not request data)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P, ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern-not-inside: |
                  def $F(..., $P: $TYPE, ...): ...
              - pattern-not-inside: |
                  async def $F(..., $P: $TYPE, ...): ...
              - pattern-not-inside: |
                  def $F(..., $P = $DEPENDS(...), ...): ...
              - pattern-not-inside: |
                  async def $F(..., $P = $DEPENDS(...), ...): ...
              - metavariable-regex:
                  metavariable: $P
                  regex: ^(?!(self|cls|request|req|websocket)$)
              - pattern: $P
          # Request bodies parsed into a model (FastAPI and Pydantic): "item: Item", with no
          # default, or "Annotated[Item, Body()]"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: $TYPE, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: $TYPE, ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern-not-inside: |
                  def $F(..., $P: $TYPE = $DEFAULT, ...): ...
              - pattern-not-inside: |
                  async def $F(..., $P: $TYPE = $DEFAULT, ...): ...
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: ^((list|List|Optional)\[)?[A-Z]\w*\]?( *\| *None)?$|^Annotated\[\w+, *(Body|Form|File|Query|Path|Header|Cookie)\(
              - metavariable-regex:
                  metavariable: $TYPE
                  # Framework objects and dependencies, not request data
                  regex: ^(?!.*\b(Request|Response|WebSocket|BackgroundTasks|HTTPConnection|SecurityScopes|Session|AsyncSession|Connection|Engine|int|float|bool|UUID|date|datetime)\b)
              - pattern: $P
          # Django views: the URL parameters after "request" (function views, then the HTTP
          # methods of class-based views and Django REST framework view sets)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      def $F(request, ..., $P, ...): ...
                  - pattern-inside: |
                      async def $F(request, ..., $P, ...): ...
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              def $F(self, request, ..., $P, ...): ...
                          - pattern-inside: |
                              async def $F(self, request, ..., $P, ...): ...
                      - metavariable-regex:
                          metavariable: $F
                          regex: ^(get|post|put|patch|delete|retrieve|update|partial_update|destroy|list|create)$
              - pattern-not-inside: |
                  def $F(..., $P: $TYPE, ...): ...
              - pattern-not-inside: |
                  async def $F(..., $P: $TYPE, ...): ...
              - metavariable-regex:
                  metavariable: $P
                  # Middleware, admin and template helpers take framework objects after "request"
                  regex: ^(?!(view|view_func|view_args|view_kwargs|callback|obj|exception|response|template_name|template|context|extra_context|form|formset|queryset|serializer|user|instance|model_admin)$)
              - pattern: $P
          # URL parameters of a Django class-based view
          - patterns:
              - pattern-inside: |
                  class $VIEW(..., $BASE, ...):
                    ...
              - metavariable-regex:
                  metavariable: $BASE
                  regex: (View|ViewSet|APIView)$
              - pattern: self.kwargs
    pattern-propagators:
      # A request value added to a list or a dict taints the container (argument lists, kwargs)
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.extend($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.insert($INDEX, $FROM)
        from: $FROM
        to: $TO
      # A request value stored in a container (configparser, cache, set, dict) taints it
      - pattern: $TO.set(..., $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.put(..., $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.update($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.setdefault($KEY, $FROM)
        from: $FROM
        to: $TO
      # A value written to a text buffer (io.StringIO) taints what is read back
      - pattern: $TO.write($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern: flask.session.update($VALUE)
          - focus-metavariable: $VALUE
      - patterns:
          - pattern-either:
              - pattern: flask.session[$NAME] = $VALUE
              - pattern: $REQ.session[$NAME] = $VALUE
          - focus-metavariable: $VALUE
      - patterns:
          - pattern-either:
              - pattern: flask.session[$NAME] = $VALUE
              - pattern: $REQ.session[$NAME] = $VALUE
          - focus-metavariable: $NAME
    pattern-sanitizers:
      - pattern-either:
          # A row read from the database (the user found at login) is not request data
          - pattern: $CURSOR.fetchone()
          - pattern: $CURSOR.fetchall()
          - pattern: $QUERY.first()
          - pattern: $QUERY.one()
          - pattern: $QUERY.one_or_none()
          - pattern: $QUERY.scalar()
          - pattern: $QUERY.scalar_one()
          - pattern: $QUERY.get_or_404(...)
          - pattern: $MODEL.objects.get(...)
          - pattern: django.shortcuts.get_object_or_404(...)
          - pattern: int(...)
      # Django META keys other than HTTP_* are set by the server, not by the client
      - patterns:
          - pattern: $REQ.META[$KEY]
          - metavariable-regex:
              metavariable: $KEY
              regex: ^["'](?!HTTP_)
