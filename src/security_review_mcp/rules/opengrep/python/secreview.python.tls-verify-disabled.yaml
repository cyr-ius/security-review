# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.tls-verify-disabled
    message: >-
      TLS certificate verification is disabled: a network attacker can impersonate the server and
      read or change the traffic. Keep verification on and point verify= at the CA bundle of a
      private certificate authority.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: requests.Session(...).$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: httpx.AsyncClient(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: $SESSION.verify = False
      - pattern: $CTX.verify_mode = ssl.CERT_NONE
      - pattern: $CTX.check_hostname = False
