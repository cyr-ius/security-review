# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.taint-nosql-injection
    message: >-
      Request data is used as a MongoDB filter or in a $where clause: a JSON object such as
      {"$ne": null} changes the query (NoSQL injection), and $where runs JavaScript. Build the filter
      from typed values (str(value)), or validate the body with a schema first.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - label: ANY
        pattern-either:
          - pattern: flask.request.$ATTR
          - patterns:
              - pattern: $REQ.$ATTR
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(GET|POST|COOKIES|FILES|META|body|headers|cookies|query_params|path_params|args|form|values|json|data)$
          - patterns:
              - pattern: await $REQ.$METHOD()
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(json|form|body)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: Annotated[str, ...], ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: Annotated[str, ...], ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern: $P
      - label: OBJECT
        pattern-either:
          - pattern: flask.request.json
          - pattern: flask.request.get_json(...)
          - pattern: json.loads(request.body)
          - patterns:
              - pattern-either:
                  - pattern: $REQ.json
                  - pattern: $REQ.get_json(...)
                  - pattern: $REQ.data
                  - pattern: await $REQ.json()
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
    pattern-sinks:
      - requires: OBJECT
        patterns:
          - pattern: $COLL.$FIND($FILTER, ...)
          - metavariable-regex:
              metavariable: $FIND
              regex: ^(find|find_one|find_one_and_update|find_one_and_delete|find_one_and_replace|update_one|update_many|delete_one|delete_many|count_documents)$
          - focus-metavariable: $FILTER
      - requires: ANY
        patterns:
          - pattern: |
              $COLL.$FIND({..., "$where": $FILTER, ...}, ...)
          - metavariable-regex:
              metavariable: $FIND
              regex: ^(find|find_one|count_documents)$
          - focus-metavariable: $FILTER
    pattern-sanitizers:
      - pattern-either:
          - pattern: str(...)
          - pattern: int(...)
          - pattern: bson.ObjectId(...)
          - pattern: ObjectId(...)
