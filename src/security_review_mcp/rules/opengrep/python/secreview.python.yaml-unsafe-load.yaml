# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.yaml-unsafe-load
    message: >-
      yaml.load() is called with a loader that can build arbitrary Python objects: a crafted
      document can run code. Use yaml.safe_load() or Loader=yaml.SafeLoader.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=CSafeLoader, ...)
          - pattern-not: yaml.load($DATA, yaml.SafeLoader)
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.load_all(..., Loader=yaml.Loader, ...)
      - pattern: yaml.load_all(..., Loader=yaml.UnsafeLoader, ...)
