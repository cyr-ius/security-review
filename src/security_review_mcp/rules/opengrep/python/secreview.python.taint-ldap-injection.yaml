# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.taint-ldap-injection
    message: >-
      Request data is built into an LDAP search filter (ldap3, python-ldap): characters such as *, (
      and ) change the filter and can return or match any entry (LDAP injection). Escape the value
      with ldap3.utils.conv.escape_filter_chars or ldap.filter.escape_filter_chars.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          # aiohttp, Azure Functions, Tornado
          - patterns:
              - pattern: $REQ.get_json(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
          - patterns:
              - pattern: self.$GET(...)
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(get_argument|get_arguments|get_body_argument|get_body_arguments|get_query_argument|get_query_arguments|get_cookie)$
          # Remote data outside a web framework: sockets, websockets, serverless events.
          # Local data (command line, standard input, environment) is left out on purpose: a
          # command line tool acting on what its own user asks crosses no trust boundary.
          - pattern: $SOCKET.recv(...)
          - pattern: $SOCKET.recvfrom(...)
          - pattern: await $WEBSOCKET.recv()
          - pattern: await $WEBSOCKET.receive_text()
          - pattern: await $WEBSOCKET.receive_json()
          - patterns:
              - pattern-inside: |
                  def $HANDLER(event, context): ...
              - pattern: event
          - patterns:
              - pattern: $REQ.$ATTR
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $ATTR
                  # url, path and full_path are left out: a client request object (requests) has them too
                  regex: ^(GET|POST|COOKIES|FILES|META|body|headers|cookies|query_params|path_params|args|form|values|json|data|query_string|environ|query|forms|params|matchdict|match_info|json_body|route_params|files)$
          - patterns:
              - pattern: await $REQ.$METHOD()
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(json|form|body|post|text|read)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: str = $DEFAULT, ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $F(..., $P: Annotated[str, ...], ...): ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      async def $F(..., $P: Annotated[str, ...], ...): ...
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(get|post|put|patch|delete|route|api_route|websocket)$
              - pattern: $P
    pattern-propagators:
      # A request value added to a list or a dict taints the container (argument lists, kwargs)
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.extend($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.insert($INDEX, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  # search() is a common name: only in code that uses ldap3
                  - pattern-either:
                      - pattern-inside: |
                          import ldap3
                          ...
                      - pattern-inside: |
                          from ldap3 import $NAME
                          ...
                  - pattern-either:
                      - pattern: $CONN.search($BASE, $FILTER, ...)
                      - pattern: $CONN.search(..., search_filter=$FILTER, ...)
              - pattern: $CONN.search_s($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search_st($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search_ext_s($BASE, $SCOPE, $FILTER, ...)
          - focus-metavariable: $FILTER
    pattern-sanitizers:
      - pattern-either:
          - pattern: ldap3.utils.conv.escape_filter_chars(...)
          - pattern: ldap.filter.escape_filter_chars(...)
          - pattern: escape_filter_chars(...)
