# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.python.insecure-random-for-secret
    message: >-
      The random module generates a value that is stored in a token, key, password, nonce or
      session identifier: its output is predictable (Mersenne Twister). Use the secrets module
      (secrets.token_urlsafe, secrets.token_hex, secrets.choice).
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern: $SECRET = <... random.$FUNC(...) ...>
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(random|randint|randrange|choice|choices|getrandbits|sample|randbytes|uniform)$
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(token|secret|password|passwd|nonce|salt|session|otp|apikey|api_key|key)$
