# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-host-header
    message: >-
      The host name of the request (Host or X-Forwarded-Host header) is written into an e-mail: an
      attacker who requests a password reset for a victim with a forged Host header receives the
      reset token when the victim clicks the link. Build the links of e-mails from a configured base
      URL, or check the host against an allow-list (Symfony: set trusted_hosts; Laravel: enable the
      TrustHosts middleware).
    languages: [php]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_SERVER['HTTP_HOST']
          - pattern: $_SERVER['SERVER_NAME']
          - pattern: $_SERVER['HTTP_X_FORWARDED_HOST']
          - patterns:
              - pattern: $REQ->$GETTER(...)
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(getHost|getHttpHost|getSchemeAndHttpHost|getUriForPath|root)$
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - pattern-either:
          - pattern: mail(...)
          - pattern: mb_send_mail(...)
          - pattern: $MAILER->Body = $BODY
          - pattern: $MAILER->AltBody = $BODY
          - pattern: $MAILER->msgHTML(...)
          - pattern: Mail::raw(...)
          - pattern: Mail::html(...)
