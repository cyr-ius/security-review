# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-sql
    message: >-
      Request data reaches a SQL query string. Use prepared statements with bound parameters (PDO::prepare then execute([$value]), mysqli_prepare, Eloquent bindings).
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Superglobals (plain PHP)
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: getallheaders()
          # Laravel: $request->input('x'), request('x'), Request::input('x')
          - patterns:
              - pattern: $REQ->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|query|post|get|cookie|header|all|json|file|route|string|integer|only|except)$
          - pattern: request(...)
          - pattern: request()->$GET(...)
          - pattern: Request::$GET(...)
          # Symfony: $request->query->get('x'), $request->request->all()...
          - patterns:
              - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: (int) $X
          - pattern: (float) $X
          - pattern: $PDO->quote(...)
          - pattern: mysqli_real_escape_string(...)
          - pattern: $DB->real_escape_string(...)
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: mysqli_query($CONN, $Q, ...)
              - pattern: mysqli_multi_query($CONN, $Q)
              - pattern: mysql_query($Q, ...)
              - pattern: pg_query($CONN, $Q)
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: $DB->query($Q, ...)
              - pattern: $DB->exec($Q)
              - pattern: $DB->multi_query($Q)
              - pattern: $DB->prepare($Q, ...)
          # $request->query('x') is a source of Laravel, not a database call
          - metavariable-regex:
              metavariable: $DB
              regex: ^(?!\$(request|req)\b)
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: DB::$RAW($Q, ...)
              - pattern: $QB->$RAW($Q, ...)
          - metavariable-regex:
              metavariable: $RAW
              regex: ^(select|insert|update|delete|statement|unprepared|raw|whereRaw|orWhereRaw|havingRaw|orderByRaw|selectRaw|groupByRaw)$
          - focus-metavariable: $Q
