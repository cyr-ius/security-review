# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-ssrf
    message: >-
      Request data chooses the URL of an outgoing request. Check the host against an allow-list, and refuse private and loopback addresses.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Superglobals (plain PHP)
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: getallheaders()
          # Laravel: $request->input('x'), request('x'), Request::input('x')
          - patterns:
              - pattern: $REQ->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|query|post|get|cookie|header|all|json|file|route|string|integer|only|except)$
          - pattern: request(...)
          - pattern: request()->$GET(...)
          - pattern: Request::$GET(...)
          # Symfony: $request->query->get('x'), $request->request->all()...
          - patterns:
              - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: (int) $X
          - pattern: (float) $X
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          - pattern: http_build_query(...)
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: curl_init($URL)
              - pattern: curl_setopt($CH, CURLOPT_URL, $URL)
              - pattern: get_headers($URL, ...)
              - pattern: $CLIENT->request($METHOD, $URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: Http::$VERB($URL, ...)
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(get|post|put|patch|delete|head|send)$
          - focus-metavariable: $URL
