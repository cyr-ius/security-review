# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-regex-injection
    message: >-
      Request data is compiled as a regular expression: a pattern such as (a+)+$ blocks the
      process for minutes on a short input (ReDoS), and the value can change what the
      expression matches. Escape the value (preg_quote($value, '/')) or match it as plain
      text.
    languages: [php]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-1333: Inefficient Regular Expression Complexity"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Superglobals (plain PHP)
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: getallheaders()
          # Laravel: $request->input('x'), request('x'), Request::input('x')
          - patterns:
              - pattern: $REQ->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|query|post|get|cookie|header|all|json|file|route|string|integer|only|except)$
          - pattern: request(...)
          - pattern: request()->$GET(...)
          - pattern: Request::$GET(...)
          # Symfony: $request->query->get('x'), $request->request->all()...
          - patterns:
              - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: preg_match($PATTERN, ...)
              - pattern: preg_match_all($PATTERN, ...)
              - pattern: preg_replace($PATTERN, ...)
              - pattern: preg_replace_callback($PATTERN, ...)
              - pattern: preg_split($PATTERN, ...)
              - pattern: preg_grep($PATTERN, ...)
          - focus-metavariable: $PATTERN
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: (int) $X
          - pattern: (float) $X
          - pattern: preg_quote(...)
