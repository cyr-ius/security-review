# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-mail-header
    message: >-
      Request data is written into the headers of mail() (To, Subject or additional headers): a line
      break adds headers such as Bcc and turns the form into a spam relay. Check addresses with
      filter_var(FILTER_VALIDATE_EMAIL), remove line breaks from the subject, or use a mail library
      (Symfony Mailer, PHPMailer) that encodes headers.
    languages: [php]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-93: Improper Neutralization of CRLF Sequences ('CRLF Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Superglobals (plain PHP)
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: getallheaders()
          # Laravel: $request->input('x'), request('x'), Request::input('x')
          - patterns:
              - pattern: $REQ->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|query|post|get|cookie|header|all|json|file|route|string|integer|only|except)$
          - pattern: request(...)
          - pattern: request()->$GET(...)
          - pattern: Request::$GET(...)
          # Symfony: $request->query->get('x'), $request->request->all()...
          - patterns:
              - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern: mail($TO, $SUBJECT, $BODY, $HEADERS, ...)
          - focus-metavariable: $TO
      - patterns:
          - pattern: mail($TO, $SUBJECT, ...)
          - focus-metavariable: $SUBJECT
      - patterns:
          - pattern: mail($TO, $SUBJECT, $BODY, $HEADERS, ...)
          - focus-metavariable: $HEADERS
      - patterns:
          - pattern: mb_send_mail($TO, $SUBJECT, ...)
          - focus-metavariable: $TO
      - patterns:
          - pattern: mb_send_mail($TO, $SUBJECT, ...)
          - focus-metavariable: $SUBJECT
    pattern-sanitizers:
      - pattern-either:
          - patterns:
              - pattern: filter_var($VALUE, FILTER_VALIDATE_EMAIL, ...)
          - patterns:
              - pattern: str_replace($CHARS, ...)
              - metavariable-regex:
                  metavariable: $CHARS
                  regex: .*(\\[rn]|[\r\n])
          - patterns:
              - pattern: preg_replace($PATTERN, ...)
              - metavariable-regex:
                  metavariable: $PATTERN
                  regex: .*(\\[rn]|[\r\n])
          - pattern: intval(...)
