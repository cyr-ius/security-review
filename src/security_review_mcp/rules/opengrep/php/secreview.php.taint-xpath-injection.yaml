# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-xpath-injection
    message: >-
      Request data is built into an XPath expression: a value such as ' or '1'='1 changes
      the query and can read the whole document (XPath injection). Use a constant expression
      and compare the value in code, or validate it against a strict pattern.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Superglobals (plain PHP)
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: getallheaders()
          # Laravel: $request->input('x'), request('x'), Request::input('x')
          - patterns:
              - pattern: $REQ->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|query|post|get|cookie|header|all|json|file|route|string|integer|only|except)$
          - pattern: request(...)
          - pattern: request()->$GET(...)
          - pattern: Request::$GET(...)
          # Symfony: $request->query->get('x'), $request->request->all()...
          - patterns:
              - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $XML->xpath($EXPR)
              - patterns:
                  - pattern-either:
                      - pattern: $XPATH->query($EXPR, ...)
                      - pattern: $XPATH->evaluate($EXPR, ...)
                  - metavariable-regex:
                      metavariable: $XPATH
                      regex: (?i).*xpath.*
              - pattern: (new DOMXPath(...))->query($EXPR, ...)
              - pattern: (new DOMXPath(...))->evaluate($EXPR, ...)
          - focus-metavariable: $EXPR
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: (int) $X
          - pattern: (float) $X
