# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-template-injection
    message: >-
      Request data is compiled as a template (Twig createTemplate or ArrayLoader, Smarty
      string: or eval: resources, Blade::render): template syntax in the value runs on the
      server, up to code execution. Render a fixed template and pass the value as a
      variable.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Superglobals (plain PHP)
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: getallheaders()
          # Laravel: $request->input('x'), request('x'), Request::input('x')
          - patterns:
              - pattern: $REQ->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|query|post|get|cookie|header|all|json|file|route|string|integer|only|except)$
          - pattern: request(...)
          - pattern: request()->$GET(...)
          - pattern: Request::$GET(...)
          # Symfony: $request->query->get('x'), $request->request->all()...
          - patterns:
              - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $TWIG->createTemplate($TEMPLATE, ...)
              - pattern: new ArrayLoader([..., $NAME => $TEMPLATE, ...])
              - pattern: new \Twig\Loader\ArrayLoader([..., $NAME => $TEMPLATE, ...])
              - pattern: Blade::render($TEMPLATE, ...)
              - pattern: Blade::compileString($TEMPLATE)
              - patterns:
                  - pattern-either:
                      - pattern: $SMARTY->fetch($TEMPLATE, ...)
                      - pattern: $SMARTY->display($TEMPLATE, ...)
                      - pattern: $SMARTY->createTemplate($TEMPLATE, ...)
                  # Smarty compiles the rest of a "string:" or "eval:" resource name as a template
                  - metavariable-regex:
                      metavariable: $TEMPLATE
                      regex: '^["''](string|eval):'
          - focus-metavariable: $TEMPLATE
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: (int) $X
          - pattern: (float) $X
