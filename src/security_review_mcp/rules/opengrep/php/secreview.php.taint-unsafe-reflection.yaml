# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.php.taint-unsafe-reflection
    message: >-
      Request data names the class instantiated, the method or the function called (new
      $class, $object->$method(), $function(), ReflectionClass): an attacker instantiates
      any class (autoloaded gadgets) or calls any function. Map the value to the allowed
      classes or functions with an array.
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-470: Use of Externally-Controlled Input to Select Classes or Code ('Unsafe Reflection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Superglobals (plain PHP)
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: getallheaders()
          # Laravel: $request->input('x'), request('x'), Request::input('x')
          - patterns:
              - pattern: $REQ->$GET(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req)$
              - metavariable-regex:
                  metavariable: $GET
                  regex: ^(input|query|post|get|cookie|header|all|json|file|route|string|integer|only|except)$
          - pattern: request(...)
          - pattern: request()->$GET(...)
          - pattern: Request::$GET(...)
          # Symfony: $request->query->get('x'), $request->request->all()...
          - patterns:
              - pattern: $REQ->$BAG->$GET(...)
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
    pattern-propagators:
      # A value added to an array taints it (implode...)
      - pattern: array_push($TO, $FROM)
        from: $FROM
        to: $TO
      - pattern: array_unshift($TO, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new $NAME(...)
              - pattern: $NAME(...)
              - pattern: $OBJ->$NAME(...)
              - pattern: $CLASS::$NAME(...)
              - pattern: new ReflectionClass($NAME)
              - pattern: new ReflectionMethod($CLASS, $NAME)
              - pattern: new ReflectionFunction($NAME)
          # A variable, not the method or function named in the code (a source is $request->input())
          - metavariable-regex:
              metavariable: $NAME
              regex: ^\$\w+(\[[^\]]*\])*$
          - focus-metavariable: $NAME
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: (int) $X
          - pattern: (float) $X
