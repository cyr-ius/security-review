# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.ruby.taint-command
    message: >-
      Request data reaches a shell command. Pass the program and each argument separately (system("convert", input, output)), or escape them with Shellwords.escape.
    languages: [ruby]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: cookies
          - patterns:
              - pattern: request.$ATTR
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(params|parameters|query_parameters|request_parameters|path_parameters|headers|body|raw_post|query_string|cookies|referer|referrer|user_agent|fullpath|original_url|url)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.to_i
          - pattern: $X.to_f
          - pattern: Integer(...)
          - pattern: Float(...)
          # A record found in the database (User.find_by(name: params[:name]).avatar) is not
          # request data
          - patterns:
              - pattern: $MODEL.$FIND(...)
              - metavariable-regex:
                  metavariable: $FIND
                  regex: ^(find|find_by|find_by!|find_or_create_by|first|last|take)$
          - pattern: Shellwords.escape(...)
          - pattern: Shellwords.shellescape(...)
          - pattern: $X.shellescape
    pattern-sinks:
      - patterns:
          # A single string is run by a shell; separate arguments are not
          - pattern-either:
              - pattern: system($CMD)
              - pattern: exec($CMD)
              - pattern: spawn($CMD)
              - pattern: Kernel.system($CMD)
              - pattern: IO.popen($CMD, ...)
              - pattern: Open3.$RUN($CMD)
              - pattern: Process.spawn($CMD)
          - focus-metavariable: $CMD
