# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.ruby.taint-deserialization
    message: >-
      Request data is deserialized into Ruby objects (Marshal.load, YAML.unsafe_load, Oj.load): a crafted payload runs code. Use JSON.parse, YAML.safe_load or Oj in :strict mode.
    languages: [ruby]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: cookies
          - patterns:
              - pattern: request.$ATTR
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(params|parameters|query_parameters|request_parameters|path_parameters|headers|body|raw_post|query_string|cookies|referer|referrer|user_agent|fullpath|original_url|url)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.to_i
          - pattern: $X.to_f
          - pattern: Integer(...)
          - pattern: Float(...)
          # A record found in the database (User.find_by(name: params[:name]).avatar) is not
          # request data
          - patterns:
              - pattern: $MODEL.$FIND(...)
              - metavariable-regex:
                  metavariable: $FIND
                  regex: ^(find|find_by|find_by!|find_or_create_by|first|last|take)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Marshal.load($DATA, ...)
              - pattern: Marshal.restore($DATA, ...)
              - pattern: YAML.unsafe_load($DATA, ...)
              - pattern: Psych.unsafe_load($DATA, ...)
              - pattern: YAML.load($DATA)
              - pattern: Oj.load($DATA)
          - focus-metavariable: $DATA
