# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.ruby.taint-template-injection
    message: >-
      Request data is compiled as a template (ERB.new, Erubi, Haml, render inline:): Ruby
      code in the value runs on the server. Render a fixed template and pass the value as a
      local variable.
    languages: [ruby]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: cookies
          - patterns:
              - pattern: request.$ATTR
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(params|parameters|query_parameters|request_parameters|path_parameters|headers|body|raw_post|query_string|cookies|referer|referrer|user_agent|fullpath|original_url|url)$
    pattern-propagators:
      # A value appended to a string or an array taints it (join...)
      - pattern: $TO << $FROM
        from: $FROM
        to: $TO
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.concat($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.unshift($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.prepend($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: ERB.new($TEMPLATE, ...)
              - pattern: Erubi::Engine.new($TEMPLATE, ...)
              - pattern: Erubis::Eruby.new($TEMPLATE, ...)
              - pattern: Haml::Engine.new($TEMPLATE, ...)
              - pattern: Haml::Template.new(...) { $TEMPLATE }
              - pattern: Slim::Template.new(...) { $TEMPLATE }
              - pattern: Tilt::ERBTemplate.new(...) { $TEMPLATE }
              - pattern: "render(..., inline: $TEMPLATE, ...)"
              - pattern: "render_to_string(..., inline: $TEMPLATE, ...)"
          - focus-metavariable: $TEMPLATE
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.to_i
          - pattern: $X.to_f
          - pattern: Integer(...)
          - pattern: Float(...)
