# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.ruby.taint-view-injection
    message: >-
      Request data chooses what a Rails controller renders (render params[:page], render
      template:, file:, partial: or action:): an attacker renders any template, or a file of
      the server (CVE-2016-0752). Map the value to a template name with an allow-list.
    languages: [ruby]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-73: External Control of File Name or Path"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: cookies
          - patterns:
              - pattern: request.$ATTR
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(params|parameters|query_parameters|request_parameters|path_parameters|headers|body|raw_post|query_string|cookies|referer|referrer|user_agent|fullpath|original_url|url)$
    pattern-propagators:
      # A value appended to a string or an array taints it (join...)
      - pattern: $TO << $FROM
        from: $FROM
        to: $TO
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.concat($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.unshift($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.prepend($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: render($NAME)
              - pattern: render($NAME, ...)
              - pattern: "render(..., template: $NAME, ...)"
              - pattern: "render(..., file: $NAME, ...)"
              - pattern: "render(..., partial: $NAME, ...)"
              - pattern: "render(..., action: $NAME, ...)"
              - pattern: "render_to_string(..., template: $NAME, ...)"
              - pattern: "render_to_string(..., partial: $NAME, ...)"
          # Inline templates have their own rule (template injection); plain data is no template
          - metavariable-regex:
              metavariable: $NAME
              regex: "^(?!(inline|json|plain|html|body|xml|js):)"
          - focus-metavariable: $NAME
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.to_i
          - pattern: $X.to_f
          - pattern: Integer(...)
          - pattern: Float(...)
