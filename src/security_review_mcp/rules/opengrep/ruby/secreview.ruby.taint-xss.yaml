# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.ruby.taint-xss
    message: >-
      Request data is marked as safe HTML (html_safe, raw, render html:): Rails does not escape it. Let the view escape the value, or use sanitize with an allow-list of tags.
    languages: [ruby]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: cookies
          - patterns:
              - pattern: request.$ATTR
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(params|parameters|query_parameters|request_parameters|path_parameters|headers|body|raw_post|query_string|cookies|referer|referrer|user_agent|fullpath|original_url|url)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.to_i
          - pattern: $X.to_f
          - pattern: Integer(...)
          - pattern: Float(...)
          # A record found in the database (User.find_by(name: params[:name]).avatar) is not
          # request data
          - patterns:
              - pattern: $MODEL.$FIND(...)
              - metavariable-regex:
                  metavariable: $FIND
                  regex: ^(find|find_by|find_by!|find_or_create_by|first|last|take)$
          - pattern: h(...)
          - pattern: html_escape(...)
          - pattern: ERB::Util.html_escape(...)
          - pattern: CGI.escapeHTML(...)
          - pattern: sanitize(...)
          - pattern: strip_tags(...)
    pattern-propagators:
      # A value appended to a string or an array taints it (join...)
      - pattern: $TO << $FROM
        from: $FROM
        to: $TO
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.concat($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.unshift($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.prepend($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $OUT.html_safe
              - pattern: raw($OUT)
              - pattern: "render(html: $OUT, ...)"
              - pattern: "render(inline: $OUT, ...)"
          - focus-metavariable: $OUT
