# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.ruby.taint-argument-injection
    message: >-
      Request data is passed as an argument of a program run without a shell (system, spawn
      or Open3 with separate arguments): a value that starts with "-" becomes an option of
      the program (git --upload-pack, ssh -oProxyCommand, curl -o, tar --checkpoint-
      action...), which runs commands or writes files. Quoting does not help. Put "--"
      before the values, refuse a value that starts with "-", or pass it as the value of a
      long option ("--branch=" + value).
    languages: [ruby]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-88: Improper Neutralization of Argument Delimiters in a Command ('Argument Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: cookies
          - patterns:
              - pattern: request.$ATTR
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(params|parameters|query_parameters|request_parameters|path_parameters|headers|body|raw_post|query_string|cookies|referer|referrer|user_agent|fullpath|original_url|url)$
    pattern-propagators:
      # A value appended to a string or an array taints it (join...)
      - pattern: $TO << $FROM
        from: $FROM
        to: $TO
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.concat($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.unshift($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.prepend($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: system($PROG, ..., $ARG, ...)
              - pattern: exec($PROG, ..., $ARG, ...)
              - pattern: spawn($PROG, ..., $ARG, ...)
              - pattern: Process.spawn($PROG, ..., $ARG, ...)
              - pattern: Open3.$RUN($PROG, ..., $ARG, ...)
              - pattern: IO.popen([$PROG, ..., $ARG, ...], ...)
          - pattern-not: system($PROG, ..., "--", ..., $ARG, ...)
          - pattern-not: exec($PROG, ..., "--", ..., $ARG, ...)
          - pattern-not: spawn($PROG, ..., "--", ..., $ARG, ...)
          - pattern-not: Process.spawn($PROG, ..., "--", ..., $ARG, ...)
          - pattern-not: Open3.$RUN($PROG, ..., "--", ..., $ARG, ...)
          - pattern-not: IO.popen([$PROG, ..., "--", ..., $ARG, ...], ...)
          - metavariable-regex:
              metavariable: $PROG
              regex: '^["''`](?:[^"''`]*/)?(git|hg|svn|ssh|scp|sftp|rsync|curl|wget|tar|zip|unzip|7z|7za|find|xargs|sed|awk|gawk|ffmpeg|convert|magick|gs|wkhtmltopdf|soffice|libreoffice|chromium|google-chrome|openssl|gpg|psql|mysql|mysqldump|pg_dump|docker|kubectl|helm|sudo|env|npm|npx|pip|man|less)["''`]$'
          - metavariable-regex:
              metavariable: $ARG
              regex: "^(?!&?(?:format!\\()?(?:f|\\$|@)?[\"'`][^\"'`{#$\\\\])"
          - focus-metavariable: $ARG

      - patterns:
          - pattern-either:
              - pattern: system($CMD)
              - pattern: exec($CMD)
              - pattern: IO.popen($CMD, ...)
              - pattern: Open3.$RUN($CMD)
          - metavariable-pattern:
              metavariable: $CMD
              pattern: <... Shellwords.escape($ARG) ...>
          - metavariable-regex:
              metavariable: $CMD
              regex: "^(?:f|\\$|@)?[\"'`](?:[^\"'`]*/)?(git|hg|svn|ssh|scp|sftp|rsync|curl|wget|tar|zip|unzip|7z|7za|find|xargs|sed|awk|gawk|ffmpeg|convert|magick|gs|wkhtmltopdf|soffice|libreoffice|chromium|google-chrome|openssl|gpg|psql|mysql|mysqldump|pg_dump|docker|kubectl|helm|sudo|env|npm|npx|pip|man|less)\\s(?!.*\\s--\\s)"
          - focus-metavariable: $ARG
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.to_i
          - pattern: $X.to_f
          - pattern: Integer(...)
          - pattern: Float(...)
