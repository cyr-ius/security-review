# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.github-actions.action-not-pinned
    message: >-
      A third-party action is referenced by a tag or a branch instead of a full commit SHA:
      whoever controls the action's repository can change the code your workflow runs, with its
      secrets. Pin the action on a 40-character commit SHA and keep the version in a comment
      (uses: owner/action@<sha> # v1.2.3).
    languages: [yaml]
    severity: INFO
    metadata:
      category: security
      cwe: "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern-inside: |
          steps: [...]
      - pattern: |
          uses: $ACTION
      - metavariable-regex:
          metavariable: $ACTION
          regex: ^(?!\./)(?!docker://)(?!actions/)(?!github/)[^@\s]+@(?![0-9a-f]{40}$).+$
