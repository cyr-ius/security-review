# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.github-actions.secrets-inherit
    message: >-
      Every secret of the repository is passed to a reusable workflow of another repository
      (secrets: inherit): a change in that workflow can read them all. Pass only the secrets it
      needs, by name, and pin the workflow on a commit SHA.
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern-inside: |
          $JOB:
            ...
            uses: $WORKFLOW
            ...
      - pattern: |
          secrets: inherit
      - metavariable-regex:
          metavariable: $WORKFLOW
          regex: ^(?!\./).*
