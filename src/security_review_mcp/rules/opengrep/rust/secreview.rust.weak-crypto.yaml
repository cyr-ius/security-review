# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.rust.weak-crypto
    message: >-
      A broken hash or cipher is used (MD5, SHA-1, DES, RC4): use SHA-256 or better, AES-GCM or
      ChaCha20-Poly1305, and a password hash (argon2, scrypt, bcrypt) for passwords.
    languages: [rust]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: md5::compute(...)
      - pattern: Md5::new()
      - pattern: Md5::digest(...)
      - pattern: Sha1::new()
      - pattern: Sha1::digest(...)
      - pattern: sha1::Sha1::new()
      - pattern: Des::new(...)
      - pattern: Rc4::new(...)
      - pattern: openssl::hash::MessageDigest::md5()
      - pattern: openssl::hash::MessageDigest::sha1()
      - pattern: MessageDigest::md5()
      - pattern: MessageDigest::sha1()
