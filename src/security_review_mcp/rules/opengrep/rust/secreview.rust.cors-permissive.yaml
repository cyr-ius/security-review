# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.rust.cors-permissive
    message: >-
      A permissive CORS layer is installed (tower-http CorsLayer::permissive or very_permissive,
      actix Cors::permissive): any website can call the API, and very_permissive also allows
      credentials. List the allowed origins explicitly.
    languages: [rust]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: CorsLayer::permissive()
      - pattern: CorsLayer::very_permissive()
      - pattern: Cors::permissive()
      - pattern: $CORS.allow_any_origin(). ... .supports_credentials()
