# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.rust.html-built-with-format
    message: >-
      An HTML response is built with format!: values are not escaped and can inject scripts.
      Render a template engine with autoescaping (askama, maud, tera), or escape the values
      (html_escape::encode_text).
    languages: [rust]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: Html(format!(...))
      - pattern: axum::response::Html(format!(...))
      - pattern: HttpResponse::Ok().content_type($TYPE).body(format!(...))
