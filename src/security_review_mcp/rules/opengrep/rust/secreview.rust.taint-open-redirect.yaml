# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.rust.taint-open-redirect
    message: >-
      Request data (an axum or actix-web extractor, the query string) is used as a redirect target:
      the application can send users to any site (phishing). Redirect only to relative paths or to
      an allowlist of hosts.
    languages: [rust]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  fn $F(..., $ARG: $EXTRACTOR<$T>, ...) { ... }
              - pattern: $ARG
              - metavariable-regex:
                  metavariable: $EXTRACTOR
                  regex: ^((axum::extract::|web::)?(Query|Path|Json|Form))$
              # An integer, boolean or UUID extractor cannot carry a URL
              - metavariable-regex:
                  metavariable: $T
                  regex: ^(?!(i8|i16|i32|i64|i128|isize|u8|u16|u32|u64|u128|usize|bool|Uuid|uuid::Uuid)$)
          - pattern: "($REQ : HttpRequest).query_string()"
          - pattern: "($REQ : HttpRequest).match_info()"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Redirect::to($URL)
              - pattern: Redirect::temporary($URL)
              - pattern: Redirect::permanent($URL)
              - pattern: $RESP.insert_header((header::LOCATION, $URL))
              - pattern: $RESP.insert_header(("Location", $URL))
              - pattern: $RESP.append_header((header::LOCATION, $URL))
          - focus-metavariable: $URL
