# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.rust.tls-verification-disabled
    message: >-
      TLS certificate or host name verification is disabled (danger_accept_invalid_certs,
      danger_accept_invalid_hostnames, a dangerous rustls verifier): a network attacker can
      impersonate the server. Keep verification on and add the private certificate authority with
      add_root_certificate.
    languages: [rust]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: $BUILDER.danger_accept_invalid_certs(true)
      - pattern: $BUILDER.danger_accept_invalid_hostnames(true)
      - pattern: $CONFIG.dangerous().set_certificate_verifier(...)
      - pattern: $BUILDER.dangerous().with_custom_certificate_verifier(...)
