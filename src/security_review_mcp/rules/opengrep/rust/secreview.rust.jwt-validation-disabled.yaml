# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.rust.jwt-validation-disabled
    message: >-
      JWT validation is weakened (signature check disabled, expiry not checked): forged or expired
      tokens are accepted. Keep signature validation and validate_exp on, and set the expected
      issuer and audience.
    languages: [rust]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: $VALIDATION.insecure_disable_signature_validation()
      - pattern: $VALIDATION.validate_exp = false
      - pattern: jsonwebtoken::dangerous_insecure_decode(...)
      - pattern: dangerous_insecure_decode(...)
