# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.dockerfile.secret-in-env
    message: >-
      A secret is set with ENV or ARG: its value stays in the image layers and history, readable by
      whoever pulls the image. Pass it at build time with RUN --mount=type=secret, or at run time
      from a secret store.
    languages: [dockerfile]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-538: Insertion of Sensitive Information into Externally-Accessible File or Directory"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    # A key naming a secret, set to a literal (not ${VAR}, not a *_FILE or *_PATH pointer); ENV
    # key=value pairs are not bound by a pattern, hence the regex on the instruction
    pattern-regex: (?im)^[ \t]*(ENV|ARG)[ \t]+(?!\w*_(file|path|dir)\b)\w*(password|passwd|secret|token|api_?key|private_?key|credentials?)\w*([ \t]*=[ \t]*|[ \t]+)[^$\s]
