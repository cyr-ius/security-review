# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.taint-ssrf
    message: >-
      Request data is used as the URL of an outgoing request (SSRF): an attacker can reach
      internal services or cloud metadata endpoints. Build the URL from a fixed base and check the
      host against an allow-list.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern: $REQ.$FIELD
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request|ctx\.request)$
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(query|body|params|headers|cookies|signedCookies|files|file|originalUrl|url|path|hostname)$
          - patterns:
              - pattern: $REQ.$GETTER(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(param|get|header)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$ROUTE(...)
                      $METHOD(..., $PARAM, ...) { ... }
                  - pattern-inside: |
                      @$ROUTE(...)
                      async $METHOD(..., $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(Get|Post|Put|Patch|Delete|All|Head|Options)$
              - pattern: $PARAM
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: "axios({..., url: $URL, ...})"
              - pattern: axios.$METHOD($URL, ...)
              - pattern: got($URL, ...)
              - pattern: got.$METHOD($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: https.request($URL, ...)
              - patterns:
                  - pattern: $HTTP.$METHOD($URL, ...)
                  - metavariable-regex:
                      metavariable: $HTTP
                      regex: ^(this\.)?(http|httpService)$
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|post|put|patch|delete|head|request)$
          - focus-metavariable: $URL
    pattern-sanitizers:
      - pattern-either:
          - pattern: encodeURIComponent(...)
          - pattern: parseInt(...)
          - pattern: Number(...)
