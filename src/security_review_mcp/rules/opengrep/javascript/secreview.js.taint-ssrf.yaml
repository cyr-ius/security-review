# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.taint-ssrf
    message: >-
      Request data is used as the URL of an outgoing request (SSRF): an attacker can reach
      internal services or cloud metadata endpoints. Build the URL from a fixed base and check the
      host against an allow-list.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern: $REQ.$FIELD
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request|ctx\.request)$
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(query|body|params|headers|cookies|signedCookies|files|file|originalUrl|url|path|hostname)$
          - patterns:
              - pattern: $REQ.$GETTER(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(param|get|header)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$ROUTE(...)
                      $METHOD(..., $PARAM, ...) { ... }
                  - pattern-inside: |
                      @$ROUTE(...)
                      async $METHOD(..., $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(Get|Post|Put|Patch|Delete|All|Head|Options)$
              - pattern: $PARAM
          # Koa: the request fields exposed on the context (ctx.body is the response, left out)
          - patterns:
              - pattern: ctx.$FIELD
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(query|params|querystring|search|headers|header|cookies|url|originalUrl|href|path|hostname)$
          - pattern: ctx.get(...)
          # Hono: c.req.query(), c.req.param(), await c.req.json()...
          - patterns:
              - pattern: $CTX.req.$GETTER(...)
              - metavariable-regex:
                  metavariable: $CTX
                  regex: ^(c|ctx|context)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(query|queries|param|header|json|text|parseBody|formData)$
          # AWS Lambda behind API Gateway or a function URL
          - patterns:
              - pattern: event.$FIELD
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(body|queryStringParameters|multiValueQueryStringParameters|pathParameters|headers|multiValueHeaders|cookies|rawPath|rawQueryString)$
          # Messages received on a socket (socket.io, ws): the first argument of the handler
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $SOCKET.on($EVENT, ($DATA, ...) => { ... })
                  - pattern-inside: |
                      $SOCKET.on($EVENT, async ($DATA, ...) => { ... })
                  - pattern-inside: |
                      $SOCKET.on($EVENT, function ($DATA, ...) { ... })
              - metavariable-regex:
                  metavariable: $SOCKET
                  regex: ^(socket|sock|ws|client|conn|connection)$
              - metavariable-regex:
                  metavariable: $EVENT
                  # Connection life cycle events carry no message
                  regex: ^(?!["'](connection|connect|disconnect|disconnecting|open|close|error|ping|pong|upgrade)["']$)
              - pattern: $DATA
    pattern-propagators:
      # A value added to an array or a set taints it (join, spread...)
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.unshift($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: "axios({..., url: $URL, ...})"
              - pattern: axios.$METHOD($URL, ...)
              - pattern: got($URL, ...)
              - pattern: got.$METHOD($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: https.request($URL, ...)
              - patterns:
                  - pattern: $HTTP.$METHOD($URL, ...)
                  - metavariable-regex:
                      metavariable: $HTTP
                      regex: ^(this\.)?(http|httpService)$
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|post|put|patch|delete|head|request)$
          - focus-metavariable: $URL
    pattern-sanitizers:
      - pattern-either:
          - pattern: encodeURIComponent(...)
          - pattern: parseInt(...)
          - pattern: Number(...)
