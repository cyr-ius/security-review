# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.taint-regex-injection
    message: >-
      Request data is compiled as a regular expression: a crafted pattern can block the event loop
      with catastrophic backtracking (ReDoS) or change what the check accepts. Escape the value
      (lodash escapeRegExp) or compare strings without a regular expression.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-1333: Inefficient Regular Expression Complexity"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern: $REQ.$FIELD
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request|ctx\.request)$
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(query|body|params|headers|cookies|signedCookies|files|file|originalUrl|url|path|hostname)$
          - patterns:
              - pattern: $REQ.$GETTER(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(param|get|header)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$ROUTE(...)
                      $METHOD(..., $PARAM, ...) { ... }
                  - pattern-inside: |
                      @$ROUTE(...)
                      async $METHOD(..., $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(Get|Post|Put|Patch|Delete|All|Head|Options)$
              - pattern: $PARAM
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new RegExp($PATTERN, ...)
              - pattern: RegExp($PATTERN, ...)
          - focus-metavariable: $PATTERN
    pattern-sanitizers:
      - pattern-either:
          - pattern: escapeRegExp(...)
          - pattern: _.escapeRegExp(...)
          - pattern: escapeStringRegexp(...)
