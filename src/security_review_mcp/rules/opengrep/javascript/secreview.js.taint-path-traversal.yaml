# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.taint-path-traversal
    message: >-
      Request data is used as a file path: "../" sequences or an absolute path can read or
      overwrite any file. Keep only the base name (path.basename), or resolve the path and check
      that it stays inside the expected directory; with res.sendFile, pass the root option.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern: $REQ.$FIELD
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request|ctx\.request)$
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(query|body|params|headers|cookies|signedCookies|files|file|originalUrl|url|path|hostname)$
          - patterns:
              - pattern: $REQ.$GETTER(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(param|get|header)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$ROUTE(...)
                      $METHOD(..., $PARAM, ...) { ... }
                  - pattern-inside: |
                      @$ROUTE(...)
                      async $METHOD(..., $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(Get|Post|Put|Patch|Delete|All|Head|Options)$
              - pattern: $PARAM
          # Koa: the request fields exposed on the context (ctx.body is the response, left out)
          - patterns:
              - pattern: ctx.$FIELD
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(query|params|querystring|search|headers|header|cookies|url|originalUrl|href|path|hostname)$
          - pattern: ctx.get(...)
          # Hono: c.req.query(), c.req.param(), await c.req.json()...
          - patterns:
              - pattern: $CTX.req.$GETTER(...)
              - metavariable-regex:
                  metavariable: $CTX
                  regex: ^(c|ctx|context)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(query|queries|param|header|json|text|parseBody|formData)$
          # AWS Lambda behind API Gateway or a function URL
          - patterns:
              - pattern: event.$FIELD
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(body|queryStringParameters|multiValueQueryStringParameters|pathParameters|headers|multiValueHeaders|cookies|rawPath|rawQueryString)$
          # Messages received on a socket (socket.io, ws): the first argument of the handler
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $SOCKET.on($EVENT, ($DATA, ...) => { ... })
                  - pattern-inside: |
                      $SOCKET.on($EVENT, async ($DATA, ...) => { ... })
                  - pattern-inside: |
                      $SOCKET.on($EVENT, function ($DATA, ...) { ... })
              - metavariable-regex:
                  metavariable: $SOCKET
                  regex: ^(socket|sock|ws|client|conn|connection)$
              - metavariable-regex:
                  metavariable: $EVENT
                  # Connection life cycle events carry no message
                  regex: ^(?!["'](connection|connect|disconnect|disconnecting|open|close|error|ping|pong|upgrade)["']$)
              - pattern: $DATA
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $FS.$METHOD($PATH, ...)
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(readFile|readFileSync|createReadStream|createWriteStream|writeFile|writeFileSync|appendFile|appendFileSync|unlink|unlinkSync|rm|rmSync|readdir|readdirSync|copyFile|copyFileSync|rename|renameSync)$
              - patterns:
                  - pattern: $RES.sendFile($PATH, ...)
                  - pattern-not: "$RES.sendFile($PATH, {..., root: $ROOT, ...}, ...)"
              - patterns:
                  - pattern: $RES.download($PATH, ...)
                  - pattern-not: "$RES.download($PATH, {..., root: $ROOT, ...}, ...)"
          - focus-metavariable: $PATH
    pattern-sanitizers:
      - pattern-either:
          - pattern: path.basename(...)
          - pattern: basename(...)
