# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.cors-reflects-any-origin
    message: >-
      CORS accepts any origin while allowing credentials (origin: true, "*" or the reflected
      Origin header): any website can send authenticated requests and read the answers. List the
      allowed origins explicitly.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: "cors({..., origin: true, ..., credentials: true, ...})"
      - pattern: "cors({..., credentials: true, ..., origin: true, ...})"
      - pattern: 'cors({..., origin: "*", ..., credentials: true, ...})'
      - pattern: 'cors({..., credentials: true, ..., origin: "*", ...})'
      - pattern: "$APP.enableCors({..., origin: true, ..., credentials: true, ...})"
      - pattern: "$APP.enableCors({..., credentials: true, ..., origin: true, ...})"
      - pattern: $RES.$SET("Access-Control-Allow-Origin", $REQ.headers.origin)
      - pattern: $RES.$SET("Access-Control-Allow-Origin", $REQ.header("origin"))
      - pattern: $RES.$SET("Access-Control-Allow-Origin", $REQ.get("origin"))
