# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.taint-host-header
    message: >-
      The host name of the request (Host or X-Forwarded-Host header) is written into an e-mail: an
      attacker who requests a password reset for a victim with a forged Host header receives the
      reset token when the victim clicks the link. Build the links of e-mails from a configured base
      URL, or check the host against an allow-list (Express: do not use req.hostname behind a proxy
      that forwards X-Forwarded-Host).
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $REQ.headers.host
                  - pattern: $REQ.headers[$KEY]
                  - pattern: $REQ.get($KEY)
                  - pattern: $REQ.header($KEY)
                  - pattern: $REQ.headers.get($KEY)
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^["'`](host|x-forwarded-host)["'`]$
          - patterns:
              - pattern: $REQ.$FIELD
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request|ctx|ctx\.request)$
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(hostname|host|origin)$
    pattern-propagators:
      # A value added to an array or a set taints it (join, spread...)
      - pattern: $TO.push($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.unshift($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - pattern-either:
          - pattern: $TRANSPORT.sendMail(...)
          - pattern: sgMail.send(...)
          - pattern: $CLIENT.emails.send(...)
          - pattern: $CLIENT.messages.create(...)
