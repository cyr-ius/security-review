# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.insecure-random-for-secret
    message: >-
      Math.random generates a value that is stored in a token, key, password, nonce or session
      identifier: its output is predictable. Use crypto.randomBytes, crypto.randomUUID or
      crypto.getRandomValues.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern-either:
          - pattern: $SECRET = <... Math.random() ...>
          - pattern: |
              { ..., $SECRET: <... Math.random() ...>, ... }
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(token|secret|password|passwd|nonce|salt|session|otp|apikey|api_key|key)$
      - focus-metavariable: $SECRET
