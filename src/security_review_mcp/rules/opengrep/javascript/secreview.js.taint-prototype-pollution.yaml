# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.taint-prototype-pollution
    message: >-
      Request data is used as a property name in a nested assignment (obj[a][b] = value) or as
      the path of a deep set: "__proto__" or "constructor" changes Object.prototype for the whole
      process (prototype pollution). Reject these keys, use a Map, or objects created with
      Object.create(null).
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes ('Prototype Pollution')"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern: $REQ.$FIELD
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request|ctx\.request)$
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(query|body|params|headers|cookies|signedCookies|files|file|originalUrl|url|path|hostname)$
          - patterns:
              - pattern: $REQ.$GETTER(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(param|get|header)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$ROUTE(...)
                      $METHOD(..., $PARAM, ...) { ... }
                  - pattern-inside: |
                      @$ROUTE(...)
                      async $METHOD(..., $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(Get|Post|Put|Patch|Delete|All|Head|Options)$
              - pattern: $PARAM
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $OBJ[$KEY][$SUB] = $VALUE
              - pattern: $OBJ[$KEY][$SUB] ||= $VALUE
              - pattern: _.set($OBJ, $KEY, ...)
              - pattern: _.setWith($OBJ, $KEY, ...)
              - pattern: lodash.set($OBJ, $KEY, ...)
              - pattern: dot.str($KEY, ...)
              - pattern: setValue($OBJ, $KEY, ...)
          - pattern-not-inside: |
              if (<... ['__proto__', ...].includes($KEY) ...>) { ... }
              ...
          - focus-metavariable: $KEY
    pattern-sanitizers:
      - pattern-either:
          - pattern: parseInt(...)
          - pattern: Number(...)
