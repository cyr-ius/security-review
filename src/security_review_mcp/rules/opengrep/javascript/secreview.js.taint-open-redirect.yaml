# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.taint-open-redirect
    message: >-
      Request data is used as a redirect target: an attacker can send users to a phishing site
      with a link to this application. Redirect to a relative path or check the target against an
      allow-list.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern: $REQ.$FIELD
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request|ctx\.request)$
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: ^(query|body|params|headers|cookies|signedCookies|files|file|originalUrl|url|path|hostname)$
          - patterns:
              - pattern: $REQ.$GETTER(...)
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(req|request)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(param|get|header)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$ROUTE(...)
                      $METHOD(..., $PARAM, ...) { ... }
                  - pattern-inside: |
                      @$ROUTE(...)
                      async $METHOD(..., $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(Get|Post|Put|Patch|Delete|All|Head|Options)$
              - pattern: $PARAM
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($URL)
              - pattern: $RES.redirect($STATUS, $URL)
              - pattern: $CTX.redirect($URL)
          - focus-metavariable: $URL
