# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.js.tls-verification-disabled
    message: >-
      TLS certificate verification is disabled (rejectUnauthorized: false or
      NODE_TLS_REJECT_UNAUTHORIZED=0): a network attacker can impersonate the server. Keep
      verification on and pass the private certificate authority with the ca option.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
