# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.csharp.xml-dtd-enabled
    message: >-
      XML DTD processing or an XML resolver is enabled: a document can read local files or reach
      internal hosts through external entities (XXE). Keep DtdProcessing at Prohibit and
      XmlResolver at null.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-611: Improper Restriction of XML External Entity Reference"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: DtdProcessing.Parse
      - pattern: $X.XmlResolver = new XmlUrlResolver()
      - pattern: "new XmlDocument { ..., XmlResolver = new XmlUrlResolver(), ... }"
      - pattern: $SETTINGS.ProhibitDtd = false
