# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.csharp.cookie-insecure
    message: >-
      A cookie is created with Secure or HttpOnly set to false: it is sent over plain HTTP or
      readable by a script after an XSS. Set Secure = true and HttpOnly = true (and SameSite) in the
      CookieOptions, or in the authentication and session cookie settings.
    languages: [csharp]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: HIGH
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: "new CookieOptions { ..., Secure = false, ... }"
      - pattern: "new CookieOptions { ..., HttpOnly = false, ... }"
      - pattern: $OPTIONS.Cookie.HttpOnly = false
      - pattern: $OPTIONS.Cookie.SecurePolicy = CookieSecurePolicy.None
      - pattern: (CookieOptions $C).Secure = false
      - pattern: (CookieOptions $C).HttpOnly = false
