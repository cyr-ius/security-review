# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.csharp.antiforgery-disabled
    message: >-
      CSRF protection is disabled ([IgnoreAntiforgeryToken], DisableAntiforgery): with cookie
      authentication, another site can submit forms on behalf of the user. Keep antiforgery
      validation, or make sure the endpoint only accepts token-based authentication without cookies.
    languages: [csharp]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-352: Cross-Site Request Forgery (CSRF)"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: |
          [IgnoreAntiforgeryToken]
          public $RET $METHOD(...) { ... }
      - pattern: |
          [IgnoreAntiforgeryToken]
          public class $CLASS { ... }
      - pattern: |
          [IgnoreAntiforgeryToken]
          public class $CLASS : $BASE { ... }
      - pattern: $ENDPOINT.DisableAntiforgery()
      - pattern: $FILTERS.Add(new IgnoreAntiforgeryTokenAttribute(...))
