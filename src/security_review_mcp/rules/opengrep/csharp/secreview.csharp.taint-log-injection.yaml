# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.csharp.taint-log-injection
    message: >-
      Request data is written to a log as-is: a line break in it forges log entries in a text log
      that mislead an investigation or a log parser. Remove the line breaks (Replace("\n", "")), or
      write the log with a structured (JSON) formatter.
    languages: [csharp]
    severity: INFO
    metadata:
      category: security
      cwe: "CWE-117: Improper Output Neutralization for Logs"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $RET $METHOD(..., [$ATTR] $TYPE $PARAM, ...) { ... }
                  - pattern-inside: |
                      $RET $METHOD(..., [$ATTR(...)] $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(FromQuery|FromRoute|FromBody|FromForm|FromHeader)$
              # A number, a boolean, a GUID or a date cannot carry an injection
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: ^(?!(int|long|short|byte|uint|ulong|ushort|bool|decimal|double|float|Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly)\??$)
              - pattern: $PARAM
          - patterns:
              - pattern-inside: |
                  class $CONTROLLER : $BASE { ... }
              - metavariable-regex:
                  metavariable: $BASE
                  regex: ^(Controller|ControllerBase|ApiController)$
              - pattern-either:
                  - pattern-inside: |
                      public $RET $METHOD(..., string $PARAM, ...) { ... }
                  - pattern-inside: |
                      public async $RET $METHOD(..., string $PARAM, ...) { ... }
              - pattern: $PARAM
          - patterns:
              - pattern-either:
                  - pattern: Request.$COLLECTION[...]
                  - pattern: HttpContext.Request.$COLLECTION[...]
                  - pattern: $CTX.Request.$COLLECTION[...]
              - metavariable-regex:
                  metavariable: $COLLECTION
                  regex: ^(Query|Form|Headers|Cookies|RouteValues)$
          - pattern: Request.Body
          - pattern: Request.QueryString
          # Minimal API handlers: the string parameters and the [From...] parameters of the lambda
          - patterns:
              - pattern-either:
                  - patterns:
                      - pattern-either:
                          - pattern-inside: $APP.$MAP($ROUTE, (..., $TYPE $PARAM, ...) => $BODY)
                          - pattern-inside: $APP.$MAP($ROUTE, (..., $TYPE $PARAM, ...) => { ... })
                      - metavariable-regex:
                          metavariable: $TYPE
                          regex: ^string\??$
                  - patterns:
                      - pattern-either:
                          - pattern-inside: $APP.$MAP($ROUTE, (..., [$ATTR] $TYPE $PARAM, ...) => $BODY)
                          - pattern-inside: $APP.$MAP($ROUTE, (..., [$ATTR] $TYPE $PARAM, ...) => { ... })
                          - pattern-inside: $APP.$MAP($ROUTE, (..., [$ATTR(...)] $TYPE $PARAM, ...) => $BODY)
                          - pattern-inside: $APP.$MAP($ROUTE, (..., [$ATTR(...)] $TYPE $PARAM, ...) => { ... })
                      - metavariable-regex:
                          metavariable: $ATTR
                          regex: ^(FromQuery|FromRoute|FromBody|FromForm|FromHeader)$
              - metavariable-regex:
                  metavariable: $MAP
                  regex: ^Map(Get|Post|Put|Patch|Delete|Methods)$
              - pattern: $PARAM
    pattern-propagators:
      # A value appended to a StringBuilder or a writer taints what is built
      - pattern: $TO.Append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.AppendLine($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.AppendFormat(..., $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.Insert($INDEX, $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.Write($FROM)
        from: $FROM
        to: $TO
      # A value added to a collection taints it (string.Join...)
      - pattern: $TO.Add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.AddRange($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.Add($KEY, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^Log(Trace|Debug|Information|Warning|Error|Critical)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: int.Parse(...)
          - pattern: Guid.Parse(...)
          - patterns:
              - pattern-either:
                  - pattern: $VALUE.Replace($CHARS, ...)
              - metavariable-regex:
                  metavariable: $CHARS
                  regex: .*(\\[rn]|[\r\n])
