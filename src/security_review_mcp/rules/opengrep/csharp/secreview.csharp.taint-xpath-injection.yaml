# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.csharp.taint-xpath-injection
    message: >-
      Request data is built into an XPath expression (SelectNodes, SelectSingleNode, XPathNavigator):
      a value such as ' or '1'='1 changes the query and can read the whole document (XPath
      injection). Keep the expression constant and pass the value through an XsltArgumentList
      variable, or validate it against a strict pattern.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $RET $METHOD(..., [$ATTR] $TYPE $PARAM, ...) { ... }
                  - pattern-inside: |
                      $RET $METHOD(..., [$ATTR(...)] $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ATTR
                  regex: ^(FromQuery|FromRoute|FromBody|FromForm|FromHeader)$
              - pattern: $PARAM
          - patterns:
              - pattern-inside: |
                  class $CONTROLLER : $BASE { ... }
              - metavariable-regex:
                  metavariable: $BASE
                  regex: ^(Controller|ControllerBase|ApiController)$
              - pattern-either:
                  - pattern-inside: |
                      public $RET $METHOD(..., string $PARAM, ...) { ... }
                  - pattern-inside: |
                      public async $RET $METHOD(..., string $PARAM, ...) { ... }
              - pattern: $PARAM
          - patterns:
              - pattern-either:
                  - pattern: Request.$COLLECTION[...]
                  - pattern: HttpContext.Request.$COLLECTION[...]
                  - pattern: $CTX.Request.$COLLECTION[...]
              - metavariable-regex:
                  metavariable: $COLLECTION
                  regex: ^(Query|Form|Headers|Cookies|RouteValues)$
          - pattern: Request.Body
          - pattern: Request.QueryString
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $NODE.SelectNodes($EXPR, ...)
              - pattern: $NODE.SelectSingleNode($EXPR, ...)
              - pattern: (XPathNavigator $NAV).Select($EXPR, ...)
              - pattern: (XPathNavigator $NAV).Evaluate($EXPR, ...)
              - pattern: (XPathNavigator $NAV).Compile($EXPR)
              - pattern: XPathExpression.Compile($EXPR, ...)
          - focus-metavariable: $EXPR
    pattern-sanitizers:
      - pattern-either:
          - pattern: int.Parse(...)
          - pattern: long.Parse(...)
