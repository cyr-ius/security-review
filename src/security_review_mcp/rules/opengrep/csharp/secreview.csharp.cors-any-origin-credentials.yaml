# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.csharp.cors-any-origin-credentials
    message: >-
      A CORS policy accepts any origin while allowing credentials (SetIsOriginAllowed returning
      true): any website can send authenticated requests and read the answers. List the allowed
      origins with WithOrigins.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: $POLICY.SetIsOriginAllowed($ORIGIN => true). ... .AllowCredentials()
      - pattern: $POLICY.SetIsOriginAllowed(_ => true). ... .AllowCredentials()
      - pattern: $POLICY.AllowCredentials(). ... .SetIsOriginAllowed($ORIGIN => true)
      - pattern: $POLICY.AllowAnyOrigin(). ... .AllowCredentials()
