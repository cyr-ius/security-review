# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.csharp.insecure-random-for-secret
    message: >-
      System.Random generates a value that is stored in a token, key, password, nonce or session
      identifier: its output is predictable. Use RandomNumberGenerator (GetBytes, GetInt32,
      GetHexString in .NET 8+).
    languages: [csharp]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern-either:
          - pattern: $TYPE $SECRET = <... new Random(...).$METHOD(...) ...>;
          - pattern: var $SECRET = <... new Random(...).$METHOD(...) ...>;
          - pattern: $SECRET = <... new Random(...).$METHOD(...) ...>;
          - pattern: $TYPE $SECRET = <... (Random $R).$METHOD(...) ...>;
          - pattern: var $SECRET = <... (Random $R).$METHOD(...) ...>;
          - pattern: $SECRET = <... (Random $R).$METHOD(...) ...>;
          - pattern: $TYPE $SECRET = <... Random.Shared.$METHOD(...) ...>;
          - pattern: var $SECRET = <... Random.Shared.$METHOD(...) ...>;
          - pattern: $SECRET = <... Random.Shared.$METHOD(...) ...>;
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(token|secret|password|passwd|nonce|salt|session|otp|apikey|api_key|key)$
