# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.weak-cipher
    message: >-
      A broken cipher or the ECB mode is requested: DES, 3DES, RC2, RC4 and Blowfish are weak, and
      "AES" alone defaults to ECB, which leaks patterns of the plaintext. Use AES/GCM/NoPadding
      (or ChaCha20-Poly1305) with a random nonce.
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGORITHM, ...)
          - pattern: javax.crypto.Cipher.getInstance($ALGORITHM, ...)
      - metavariable-regex:
          metavariable: $ALGORITHM
          regex: (?i)^"((DES|DESede|TripleDES|RC2|RC4|ARCFOUR|Blowfish)(/[^"]*)?|AES|[^"/]+/ECB/[^"]*)"$
