# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.taint-path-traversal
    message: >-
      Request data is used as a file path: "../" sequences or an absolute path can read or
      overwrite any file. Keep only the file name (Path.getFileName, FilenameUtils.getName) or
      normalize the path and check that it starts with the expected directory.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN(...) $TYPE $PARAM, ...) { ... }
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ANN
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $PARAM
          # Spring binds a handler parameter without annotation too: a simple type from the
          # query string or the form, an object (form, DTO) as an implicit @ModelAttribute
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$MAPPING(...)
                      $RET $METHOD(..., $TYPE $PARAM, ...) { ... }
                  - pattern-inside: |
                      @$MAPPING
                      $RET $METHOD(..., $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $MAPPING
                  regex: ^(Get|Post|Put|Patch|Delete|Request)Mapping$
              # An annotated parameter is either request data (above) or not (@AuthenticationPrincipal)
              - pattern-not-inside: |
                  $RET $METHOD(..., @$ANN $TYPE $PARAM, ...) { ... }
              - pattern-not-inside: |
                  $RET $METHOD(..., @$ANN(...) $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: ^(String|String\[\]|List<String>|Optional<String>|[A-Z]\w*(Form|Dto|DTO|Request|Command|Params|Criteria|Filter))$
              - metavariable-regex:
                  metavariable: $TYPE
                  # Framework objects, whose getters are the sources below
                  regex: ^(?!(HttpServletRequest|ServletRequest|WebRequest|NativeWebRequest|ServerHttpRequest|ServerRequest|RequestEntity|MultipartHttpServletRequest)$)
              - pattern: $PARAM
          - patterns:
              - pattern-either:
                  - pattern: (HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (ServletRequest $REQ).$GETTER(...)
                  - pattern: (javax.servlet.ServletRequest $REQ).$GETTER(...)
                  - pattern: (jakarta.servlet.ServletRequest $REQ).$GETTER(...)
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getCookies|getInputStream|getReader|getRequestURI|getRequestURL|getPathInfo|getPart|getParts)$
    pattern-propagators:
      # A value appended to a StringBuilder or a writer taints what is built
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM, ...)
        from: $FROM
        to: $TO
      - pattern: $TO.insert($INDEX, $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.write($FROM)
        from: $FROM
        to: $TO
      # A value added to a collection taints it (String.join, a query builder...)
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($INDEX, $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.addAll($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.put($KEY, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new File($PATH)
              - pattern: new java.io.File($PATH)
              - pattern: new File($PARENT, $PATH)
              - pattern: new java.io.File($PARENT, $PATH)
              - pattern: Paths.get($PATH, ...)
              - pattern: java.nio.file.Paths.get($PATH, ...)
              - pattern: Path.of($PATH, ...)
              - pattern: java.nio.file.Path.of($PATH, ...)
              - pattern: new FileInputStream($PATH)
              - pattern: new java.io.FileInputStream($PATH)
              - pattern: new FileOutputStream($PATH, ...)
              - pattern: new java.io.FileOutputStream($PATH, ...)
              - pattern: new FileReader($PATH, ...)
              - pattern: new java.io.FileReader($PATH, ...)
              - pattern: new FileWriter($PATH, ...)
              - pattern: new java.io.FileWriter($PATH, ...)
              - pattern: (Path $DIR).resolve($PATH)
              - pattern: (java.nio.file.Path $DIR).resolve($PATH)
              - pattern: new FileSystemResource($PATH)
              - pattern: new UrlResource($PATH)
          - focus-metavariable: $PATH
    pattern-sanitizers:
      - pattern-either:
          - pattern: FilenameUtils.getName(...)
          - pattern: $X.getFileName()
          - pattern: StringUtils.cleanPath(...)
