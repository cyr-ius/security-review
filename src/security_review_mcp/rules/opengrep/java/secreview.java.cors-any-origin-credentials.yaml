# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.cors-any-origin-credentials
    message: >-
      CORS accepts every origin (allowedOriginPatterns("*") or a "*" origin) together with
      credentials: any site can send authenticated requests and read the answers with the user's
      cookies. List the allowed origins explicitly when credentials are allowed.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: HIGH
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: '@CrossOrigin(..., originPatterns = "*", ..., allowCredentials = "true", ...)'
      - pattern: '@CrossOrigin(..., allowCredentials = "true", ..., originPatterns = "*", ...)'
      - pattern: '@CrossOrigin(..., origins = "*", ..., allowCredentials = "true", ...)'
      - pattern: '@CrossOrigin(..., allowCredentials = "true", ..., origins = "*", ...)'
      - pattern: $REG. ... .allowedOriginPatterns("*"). ... .allowCredentials(true)
      - pattern: $REG. ... .allowCredentials(true). ... .allowedOriginPatterns("*")
      - patterns:
          - pattern-inside: |
              $RET $METHOD(...) {
                ...
                $CFG.setAllowCredentials(true);
                ...
              }
          - pattern-either:
              - pattern: $CFG.addAllowedOriginPattern("*")
              - pattern: $CFG.setAllowedOriginPatterns(List.of("*"))
              - pattern: $CFG.setAllowedOriginPatterns(Arrays.asList("*"))
              - pattern: $CFG.setAllowedOriginPatterns(Collections.singletonList("*"))
