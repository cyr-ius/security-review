# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.taint-ssrf
    message: >-
      Request data is used as the URL of an outgoing request (SSRF): an attacker can reach
      internal services or cloud metadata endpoints. Build the URL from a fixed base and check the
      host against an allow-list.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN(...) $TYPE $PARAM, ...) { ... }
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ANN
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $PARAM
          - patterns:
              - pattern-either:
                  - pattern: (HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (ServletRequest $REQ).$GETTER(...)
                  - pattern: (javax.servlet.ServletRequest $REQ).$GETTER(...)
                  - pattern: (jakarta.servlet.ServletRequest $REQ).$GETTER(...)
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getCookies|getInputStream|getReader|getRequestURI|getRequestURL|getPathInfo|getPart|getParts)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new URL($URL)
              - pattern: new java.net.URL($URL)
              - pattern: (RestTemplate $REST).$METHOD($URL, ...)
              - pattern: (WebClient $CLIENT).$VERB().uri($URL, ...)
              - pattern: (RestClient $CLIENT).$VERB().uri($URL, ...)
              - pattern: HttpRequest.newBuilder($URL)
              - pattern: HttpRequest.newBuilder().uri($URL)
              - pattern: new HttpGet($URL)
              - pattern: new HttpPost($URL)
          - focus-metavariable: $URL
