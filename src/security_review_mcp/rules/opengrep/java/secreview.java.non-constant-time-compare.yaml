# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.non-constant-time-compare
    message: >-
      A signature, token or secret is compared with equals or Arrays.equals: the comparison stops at
      the first different byte, and its timing reveals the expected value byte by byte. Use
      MessageDigest.isEqual on the bytes.
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-208: Observable Timing Discrepancy"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $LEFT.equals($RIGHT)
              - pattern: Arrays.equals($LEFT, $RIGHT)
              - pattern: $LEFT.contentEquals($RIGHT)
          - metavariable-regex:
              metavariable: $LEFT
              regex: ^(?![A-Z0-9_]+$)(?![A-Z]\w*\.)(?i:.*(signature|hmac|mac|token|secret|api_?key|otp|nonce))$
          - metavariable-regex:
              metavariable: $RIGHT
              regex: ^(?![A-Z0-9_]+$)(?![A-Z]\w*\.)(?i:.*(signature|hmac|mac|token|secret|api_?key|otp|nonce))$
      - pattern: Arrays.equals($X, $MAC.doFinal(...))
      - pattern: Arrays.equals($MAC.doFinal(...), $X)
