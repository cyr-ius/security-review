# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.xml-decoder
    message: >-
      java.beans.XMLDecoder builds any object and calls any method that the XML document names: a
      document from outside the application runs code (unsafe deserialization). Parse untrusted XML
      with a data binding (JAXB, Jackson XML) into known classes instead.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: new XMLDecoder(...)
      - pattern: new java.beans.XMLDecoder(...)
