# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.taint-xss-response
    message: >-
      Request data is written to the HTTP response without HTML encoding: it can inject scripts in
      the page. Render it with an escaping template engine (Thymeleaf th:text) or encode it
      (HtmlUtils.htmlEscape, OWASP Encoder Encode.forHtml).
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN(...) $TYPE $PARAM, ...) { ... }
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ANN
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $PARAM
          - patterns:
              - pattern-either:
                  - pattern: (HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (ServletRequest $REQ).$GETTER(...)
                  - pattern: (javax.servlet.ServletRequest $REQ).$GETTER(...)
                  - pattern: (jakarta.servlet.ServletRequest $REQ).$GETTER(...)
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(getParameter|getParameterValues|getParameterMap|getHeader|getHeaders|getQueryString|getCookies|getInputStream|getReader|getRequestURI|getRequestURL|getPathInfo|getPart|getParts)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (HttpServletResponse $RESP).getWriter().$WRITE($HTML)
              - pattern: (javax.servlet.http.HttpServletResponse $RESP).getWriter().$WRITE($HTML)
              - pattern: (jakarta.servlet.http.HttpServletResponse $RESP).getWriter().$WRITE($HTML)
              - pattern: (PrintWriter $WRITER).$WRITE($HTML)
              - pattern: (java.io.PrintWriter $WRITER).$WRITE($HTML)
              - pattern: (ServletOutputStream $OUT).$WRITE($HTML)
              - pattern: (javax.servlet.ServletOutputStream $OUT).$WRITE($HTML)
              - pattern: (jakarta.servlet.ServletOutputStream $OUT).$WRITE($HTML)
          - metavariable-regex:
              metavariable: $WRITE
              regex: ^(write|print|println|append|format|printf)$
          - focus-metavariable: $HTML
    pattern-sanitizers:
      - pattern-either:
          - pattern: HtmlUtils.htmlEscape(...)
          - pattern: org.springframework.web.util.HtmlUtils.htmlEscape(...)
          - pattern: Encode.forHtml(...)
          - pattern: Encode.forHtmlContent(...)
          - pattern: StringEscapeUtils.escapeHtml4(...)
          - pattern: Integer.parseInt(...)
