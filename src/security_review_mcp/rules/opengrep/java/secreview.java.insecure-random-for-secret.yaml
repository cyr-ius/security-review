# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.insecure-random-for-secret
    message: >-
      java.util.Random, Math.random or RandomStringUtils.random* generate a value that is stored in
      a token, key, password, nonce or session identifier: their output is predictable. Use
      java.security.SecureRandom (or RandomStringUtils.secure() in commons-lang3 3.16+).
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern-either:
          - pattern: $TYPE $SECRET = <... $RANDOM ...>;
          - pattern: $SECRET = <... $RANDOM ...>;
      - metavariable-pattern:
          metavariable: $RANDOM
          patterns:
            - pattern-either:
                - pattern: new Random(...).$METHOD(...)
                - pattern: new java.util.Random(...).$METHOD(...)
                - pattern: (Random $R).$METHOD(...)
                - pattern: (java.util.Random $R).$METHOD(...)
                - pattern: ThreadLocalRandom.current().$METHOD(...)
                - pattern: Math.random()
                - pattern: RandomStringUtils.$METHOD(...)
            - pattern-not: RandomStringUtils.secure()
            - pattern-not: RandomStringUtils.secureStrong()
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(token|secret|password|passwd|nonce|salt|session|otp|apikey|api_key|key)$
