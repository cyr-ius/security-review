# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.taint-sql
    message: >-
      Request data reaches a SQL or JPQL query built as a string. Use a PreparedStatement with ?
      placeholders, named parameters (setParameter) or the Criteria API instead of concatenating
      the value.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN(...) $TYPE $PARAM, ...) { ... }
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ANN
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $PARAM
          - patterns:
              - pattern-either:
                  - pattern: (HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (ServletRequest $REQ).$GETTER(...)
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(getParameter|getParameterValues|getParameterMap|getHeader|getHeaders|getQueryString|getCookies|getInputStream|getReader|getRequestURI|getRequestURL|getPathInfo|getPart|getParts)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $STMT.executeQuery($QUERY)
              - pattern: $STMT.executeUpdate($QUERY, ...)
              - pattern: $STMT.execute($QUERY, ...)
              - pattern: $STMT.addBatch($QUERY)
              - pattern: $CONN.prepareStatement($QUERY, ...)
              - pattern: $CONN.prepareCall($QUERY, ...)
              - pattern: $EM.createQuery($QUERY, ...)
              - pattern: $EM.createNativeQuery($QUERY, ...)
              - pattern: (JdbcTemplate $JDBC).$METHOD($QUERY, ...)
              - pattern: (NamedParameterJdbcTemplate $JDBC).$METHOD($QUERY, ...)
              - pattern: (JdbcClient $JDBC).sql($QUERY)
          - focus-metavariable: $QUERY
    pattern-sanitizers:
      - pattern-either:
          - pattern: Integer.parseInt(...)
          - pattern: Integer.valueOf(...)
          - pattern: Long.parseLong(...)
          - pattern: Long.valueOf(...)
          - pattern: UUID.fromString(...)
