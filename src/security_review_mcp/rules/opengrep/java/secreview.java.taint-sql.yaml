# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.taint-sql
    message: >-
      Request data reaches a SQL or JPQL query built as a string. Use a PreparedStatement with ?
      placeholders, named parameters (setParameter) or the Criteria API instead of concatenating
      the value.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN(...) $TYPE $PARAM, ...) { ... }
                  - pattern-inside: |
                      $RET $METHOD(..., @$ANN $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $ANN
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $PARAM
          # Spring binds a handler parameter without annotation too: a simple type from the
          # query string or the form, an object (form, DTO) as an implicit @ModelAttribute
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$MAPPING(...)
                      $RET $METHOD(..., $TYPE $PARAM, ...) { ... }
                  - pattern-inside: |
                      @$MAPPING
                      $RET $METHOD(..., $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $MAPPING
                  regex: ^(Get|Post|Put|Patch|Delete|Request)Mapping$
              # An annotated parameter is either request data (above) or not (@AuthenticationPrincipal)
              - pattern-not-inside: |
                  $RET $METHOD(..., @$ANN $TYPE $PARAM, ...) { ... }
              - pattern-not-inside: |
                  $RET $METHOD(..., @$ANN(...) $TYPE $PARAM, ...) { ... }
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: ^(String|String\[\]|List<String>|Optional<String>|[A-Z]\w*(Form|Dto|DTO|Request|Command|Params|Criteria|Filter))$
              - metavariable-regex:
                  metavariable: $TYPE
                  # Framework objects, whose getters are the sources below
                  regex: ^(?!(HttpServletRequest|ServletRequest|WebRequest|NativeWebRequest|ServerHttpRequest|ServerRequest|RequestEntity|MultipartHttpServletRequest)$)
              - pattern: $PARAM
          - patterns:
              - pattern-either:
                  - pattern: (HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GETTER(...)
                  - pattern: (ServletRequest $REQ).$GETTER(...)
                  - pattern: (javax.servlet.ServletRequest $REQ).$GETTER(...)
                  - pattern: (jakarta.servlet.ServletRequest $REQ).$GETTER(...)
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getCookies|getInputStream|getReader|getRequestURI|getRequestURL|getPathInfo|getPart|getParts)$
    pattern-propagators:
      # A value appended to a StringBuilder or a writer taints what is built
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.append($FROM, ...)
        from: $FROM
        to: $TO
      - pattern: $TO.insert($INDEX, $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.write($FROM)
        from: $FROM
        to: $TO
      # A value added to a collection taints it (String.join, a query builder...)
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($INDEX, $FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.addAll($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.put($KEY, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $STMT.executeQuery($QUERY)
              - pattern: $STMT.executeUpdate($QUERY, ...)
              - pattern: (Statement $STMT).execute($QUERY, ...)
              - pattern: (java.sql.Statement $STMT).execute($QUERY, ...)
              - pattern: $CONN.createStatement(...).execute($QUERY, ...)
              - pattern: $STMT.addBatch($QUERY)
              - pattern: $CONN.prepareStatement($QUERY, ...)
              - pattern: $CONN.prepareCall($QUERY, ...)
              - pattern: $EM.createQuery($QUERY, ...)
              - pattern: $EM.createNativeQuery($QUERY, ...)
              - pattern: (JdbcTemplate $JDBC).$METHOD($QUERY, ...)
              - pattern: (NamedParameterJdbcTemplate $JDBC).$METHOD($QUERY, ...)
              - pattern: (JdbcClient $JDBC).sql($QUERY)
              # JdbcTemplate reached through a field of another class: its type is not visible
              - patterns:
                  - pattern: $JDBC.$METHOD($QUERY, ...)
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(queryForObject|queryForList|queryForMap|queryForRowSet|queryForLong|queryForInt|queryForStream|batchUpdate)$
              - patterns:
                  - pattern: $JDBC.$METHOD($QUERY, ...)
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(query|update|execute)$
                  - metavariable-regex:
                      metavariable: $JDBC
                      regex: (?i).*jdbc.*
          - focus-metavariable: $QUERY
    pattern-sanitizers:
      - pattern-either:
          - pattern: Integer.parseInt(...)
          - pattern: Integer.valueOf(...)
          - pattern: Long.parseLong(...)
          - pattern: Long.valueOf(...)
          - pattern: UUID.fromString(...)
