# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.xstream-without-allowlist
    message: >-
      XStream reads XML without an allowlist of types: before 1.4.18, it builds any class named in
      the document, which runs code (unsafe deserialization). Call allowTypes / allowTypesByWildcard
      (or addPermission) before fromXML, and keep XStream up to date.
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    patterns:
      - pattern-inside: |
          $X = new XStream(...);
          ...
      - pattern: $X.fromXML(...)
      - pattern-not-inside: |
          $X = new XStream(...);
          ...
          $X.allowTypes(...);
          ...
      - pattern-not-inside: |
          $T $X = new XStream(...);
          ...
          $X.allowTypes(...);
          ...
      - pattern-not-inside: |
          $X = new XStream(...);
          ...
          $X.allowTypesByWildcard(...);
          ...
      - pattern-not-inside: |
          $T $X = new XStream(...);
          ...
          $X.allowTypesByWildcard(...);
          ...
      - pattern-not-inside: |
          $X = new XStream(...);
          ...
          $X.allowTypesByRegExp(...);
          ...
      - pattern-not-inside: |
          $T $X = new XStream(...);
          ...
          $X.allowTypesByRegExp(...);
          ...
      - pattern-not-inside: |
          $X = new XStream(...);
          ...
          $X.allowTypeHierarchy(...);
          ...
      - pattern-not-inside: |
          $T $X = new XStream(...);
          ...
          $X.allowTypeHierarchy(...);
          ...
      - pattern-not-inside: |
          $X = new XStream(...);
          ...
          $X.addPermission(...);
          ...
      - pattern-not-inside: |
          $T $X = new XStream(...);
          ...
          $X.addPermission(...);
          ...
      - pattern-not-inside: |
          $X = new XStream(...);
          ...
          $X.setupDefaultSecurity(...);
          ...
      - pattern-not-inside: |
          $T $X = new XStream(...);
          ...
          $X.setupDefaultSecurity(...);
          ...
