# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.hostname-verification-disabled
    message: >-
      TLS host name verification is disabled: any valid certificate, issued for any host, is
      accepted. Remove the custom HostnameVerifier and keep the default one.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-297: Improper Validation of Certificate with Host Mismatch"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - pattern: |
          public boolean verify(String $HOST, SSLSession $SESSION) { return true; }
      - pattern: ($HOST, $SESSION) -> true
      - pattern: NoopHostnameVerifier.INSTANCE
      - pattern: new NoopHostnameVerifier()
      - pattern: SSLConnectionSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER
