# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.java.weak-hash
    message: >-
      MD5 or SHA-1 is requested from MessageDigest: both are broken for signatures and integrity
      checks, and every fast hash is unfit for passwords. Use SHA-256 or better, and a password
      hash (Argon2id, bcrypt, scrypt, PBKDF2) for passwords.
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    pattern-either:
      - patterns:
          - pattern: MessageDigest.getInstance($ALGORITHM, ...)
          - metavariable-regex:
              metavariable: $ALGORITHM
              regex: (?i)^"(MD2|MD4|MD5|SHA-?1|SHA)"$
      - patterns:
          - pattern: DigestUtils.$FUNC(...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: ^(md5|md5Hex|sha1|sha1Hex|md5Digest|md5DigestAsHex)$
