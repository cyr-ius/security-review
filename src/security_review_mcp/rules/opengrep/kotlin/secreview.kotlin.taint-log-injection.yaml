# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.kotlin.taint-log-injection
    message: >-
      Request data is written to a log as-is: a line break in it forges log entries that mislead an
      investigation or a log parser. Remove the line breaks (replace("\n", "")) or use a log layout
      that encodes them (JSON).
    languages: [kotlin]
    severity: INFO
    metadata:
      category: security
      cwe: "CWE-117: Improper Output Neutralization for Logs"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      confidence: LOW
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Spring: parameters bound from the request by an annotation
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fun $METHOD(..., @$ANN $PARAM: $TYPE, ...) { ... }
                  - pattern-inside: |
                      fun $METHOD(..., @$ANN $PARAM: $TYPE, ...) = $BODY
                  - pattern-inside: |
                      fun $METHOD(..., @$ANN(...) $PARAM: $TYPE, ...) { ... }
                  - pattern-inside: |
                      fun $METHOD(..., @$ANN(...) $PARAM: $TYPE, ...) = $BODY
              - metavariable-regex:
                  metavariable: $ANN
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
              - pattern: $PARAM
          # Spring binds a String parameter of a handler without annotation too
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$MAPPING(...)
                      fun $METHOD(..., $PARAM: $TYPE, ...) { ... }
                  - pattern-inside: |
                      @$MAPPING(...)
                      fun $METHOD(..., $PARAM: $TYPE, ...) = $BODY
                  - pattern-inside: |
                      @$MAPPING
                      fun $METHOD(..., $PARAM: $TYPE, ...) { ... }
                  - pattern-inside: |
                      @$MAPPING
                      fun $METHOD(..., $PARAM: $TYPE, ...) = $BODY
              - metavariable-regex:
                  metavariable: $MAPPING
                  regex: ^(Get|Post|Put|Patch|Delete|Request)Mapping$
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: ^(String\??|List<String>\??|Array<String>\??)$
              - pattern: $PARAM
          # Ktor: the call of a route handler
          - pattern: call.parameters
          - pattern: call.request.queryParameters
          - pattern: call.request.headers
          - pattern: call.request.cookies
          - pattern: call.request.uri
          - pattern: call.receiveText()
          - pattern: call.receiveParameters()
          - pattern: call.receive<$T>()
          # Servlets (Kotlin calls the getters or reads them as properties)
          - patterns:
              - pattern-either:
                  - pattern: $REQ.$GETTER(...)
                  - pattern: $REQ.$GETTER
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req|httpRequest|servletRequest)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(getParameter|getParameterValues|getParameterMap|getHeader|getHeaders|getQueryString|getCookies|getInputStream|getReader|getRequestURI|getPathInfo|getPart|queryString|inputStream|reader|requestURI|pathInfo|parameterMap|cookies)$
          # Android: what another application sends to an exported component
          - patterns:
              - pattern-either:
                  - pattern: $INTENT.$EXTRA(...)
                  - pattern: $INTENT?.$EXTRA(...)
              - metavariable-regex:
                  metavariable: $EXTRA
                  regex: ^(getStringExtra|getStringArrayExtra|getStringArrayListExtra|getCharSequenceExtra|getBundleExtra)$
          - pattern: intent.data
          - pattern: intent.dataString
          - pattern: intent.extras
          - patterns:
              - pattern-either:
                  - pattern: $URI.getQueryParameter(...)
                  - pattern: $URI?.getQueryParameter(...)
                  - pattern: $URI.lastPathSegment
                  - pattern: $URI?.lastPathSegment
    pattern-propagators:
      # A value appended to a StringBuilder or added to a collection taints it
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.put($KEY, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $LOGGER
              regex: ^(log|logger|LOG|LOGGER)$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(trace|debug|info|warn|error)$
    pattern-sanitizers:
      - pattern-either:
          - patterns:
              - pattern: $VALUE.replace($CHARS, ...)
              - metavariable-regex:
                  metavariable: $CHARS
                  regex: .*(\\[rn]|[\r\n])
          - pattern: $VALUE.toInt()
          - pattern: $VALUE.toIntOrNull()
          - pattern: $VALUE.toLong()
          - pattern: $VALUE.toLongOrNull()
          - pattern: UUID.fromString(...)
