# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.kotlin.taint-host-header
    message: >-
      The host name of the request (Host or X-Forwarded-Host header) is written into an
      e-mail: an attacker who requests a password reset for a victim with a forged Host
      header receives the reset token when the victim clicks the link. Build the links of
      e-mails from a configured base URL.
    languages: [kotlin]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.getServerName()
          - pattern: $REQ.serverName
          - pattern: $REQ.getRequestURL()
          - pattern: $REQ.requestURL
          - pattern: ServletUriComponentsBuilder.fromCurrentRequest()
          - pattern: ServletUriComponentsBuilder.fromCurrentContextPath()
          - pattern: ServletUriComponentsBuilder.fromCurrentRequestUri()
          - pattern: ServletUriComponentsBuilder.fromRequest(...)
          # Ktor
          - pattern: call.request.host()
          - pattern: call.request.origin.serverHost
          - pattern: call.request.origin.remoteHost
          - patterns:
              - pattern-either:
                  - pattern: $REQ.getHeader($KEY)
                  - pattern: $REQ.header($KEY)
                  - pattern: $REQ.headers[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^"(host|x-forwarded-host)"$
    pattern-propagators:
      # A value appended to a StringBuilder or added to a collection taints it
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.put($KEY, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $MESSAGE.setText(...)
              - pattern: $MESSAGE.setContent(...)
              - pattern: $MESSAGE.text = $BODY
              - pattern: $MESSAGE.setHtml(...)
          - metavariable-regex:
              metavariable: $MESSAGE
              regex: (?i).*(message|mail|helper|msg|part|email).*
