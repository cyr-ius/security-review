# Security Review default OpenGrep rule (Apache-2.0), written for this project.
rules:
  - id: secreview.kotlin.taint-argument-injection
    message: >-
      Request data is passed as an argument of a program run without a shell
      (ProcessBuilder, an array given to Runtime.exec): a value that starts with "-" becomes
      an option of the program (git --upload-pack, ssh -oProxyCommand, curl -o, tar
      --checkpoint-action...), which runs commands or writes files. Quoting does not help.
      Put "--" before the values, refuse a value that starts with "-", or pass it as the
      value of a long option ("--branch=" + value).
    languages: [kotlin]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-88: Improper Neutralization of Argument Delimiters in a Command ('Argument Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      source: Security Review
      license: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          # Spring: parameters bound from the request by an annotation
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fun $METHOD(..., @$ANN $PARAM: $TYPE, ...) { ... }
                  - pattern-inside: |
                      fun $METHOD(..., @$ANN $PARAM: $TYPE, ...) = $BODY
                  - pattern-inside: |
                      fun $METHOD(..., @$ANN(...) $PARAM: $TYPE, ...) { ... }
                  - pattern-inside: |
                      fun $METHOD(..., @$ANN(...) $PARAM: $TYPE, ...) = $BODY
              - metavariable-regex:
                  metavariable: $ANN
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
              - pattern: $PARAM
          # Spring binds a String parameter of a handler without annotation too
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      @$MAPPING(...)
                      fun $METHOD(..., $PARAM: $TYPE, ...) { ... }
                  - pattern-inside: |
                      @$MAPPING(...)
                      fun $METHOD(..., $PARAM: $TYPE, ...) = $BODY
                  - pattern-inside: |
                      @$MAPPING
                      fun $METHOD(..., $PARAM: $TYPE, ...) { ... }
                  - pattern-inside: |
                      @$MAPPING
                      fun $METHOD(..., $PARAM: $TYPE, ...) = $BODY
              - metavariable-regex:
                  metavariable: $MAPPING
                  regex: ^(Get|Post|Put|Patch|Delete|Request)Mapping$
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: ^(String\??|List<String>\??|Array<String>\??)$
              - pattern: $PARAM
          # Ktor: the call of a route handler
          - pattern: call.parameters
          - pattern: call.request.queryParameters
          - pattern: call.request.headers
          - pattern: call.request.cookies
          - pattern: call.request.uri
          - pattern: call.receiveText()
          - pattern: call.receiveParameters()
          - pattern: call.receive<$T>()
          # Servlets (Kotlin calls the getters or reads them as properties)
          - patterns:
              - pattern-either:
                  - pattern: $REQ.$GETTER(...)
                  - pattern: $REQ.$GETTER
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^(request|req|httpRequest|servletRequest)$
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^(getParameter|getParameterValues|getParameterMap|getHeader|getHeaders|getQueryString|getCookies|getInputStream|getReader|getRequestURI|getPathInfo|getPart|queryString|inputStream|reader|requestURI|pathInfo|parameterMap|cookies)$
          # Android: what another application sends to an exported component
          - patterns:
              - pattern-either:
                  - pattern: $INTENT.$EXTRA(...)
                  - pattern: $INTENT?.$EXTRA(...)
              - metavariable-regex:
                  metavariable: $EXTRA
                  regex: ^(getStringExtra|getStringArrayExtra|getStringArrayListExtra|getCharSequenceExtra|getBundleExtra)$
          - pattern: intent.data
          - pattern: intent.dataString
          - pattern: intent.extras
          - patterns:
              - pattern-either:
                  - pattern: $URI.getQueryParameter(...)
                  - pattern: $URI?.getQueryParameter(...)
                  - pattern: $URI.lastPathSegment
                  - pattern: $URI?.lastPathSegment
    pattern-propagators:
      # A value appended to a StringBuilder or added to a collection taints it
      - pattern: $TO.append($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.add($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.put($KEY, $FROM)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: ProcessBuilder($PROG, ..., $ARG, ...)
              - pattern: ProcessBuilder(listOf($PROG, ..., $ARG, ...))
              - pattern: $PB.command($PROG, ..., $ARG, ...)
              - pattern: $RT.exec(arrayOf($PROG, ..., $ARG, ...), ...)
          - pattern-not: ProcessBuilder($PROG, ..., "--", ..., $ARG, ...)
          - pattern-not: ProcessBuilder(listOf($PROG, ..., "--", ..., $ARG, ...))
          - pattern-not: $PB.command($PROG, ..., "--", ..., $ARG, ...)
          - pattern-not: $RT.exec(arrayOf($PROG, ..., "--", ..., $ARG, ...), ...)
          - metavariable-regex:
              metavariable: $PROG
              regex: '^["''`](?:[^"''`]*/)?(git|hg|svn|ssh|scp|sftp|rsync|curl|wget|tar|zip|unzip|7z|7za|find|xargs|sed|awk|gawk|ffmpeg|convert|magick|gs|wkhtmltopdf|soffice|libreoffice|chromium|google-chrome|openssl|gpg|psql|mysql|mysqldump|pg_dump|docker|kubectl|helm|sudo|env|npm|npx|pip|man|less)["''`]$'
          - metavariable-regex:
              metavariable: $ARG
              regex: "^(?!&?(?:format!\\()?(?:f|\\$|@)?[\"'`][^\"'`{#$\\\\])"
          - focus-metavariable: $ARG
    pattern-sanitizers:
      - pattern-either:
          - pattern: $VALUE.toInt()
          - pattern: $VALUE.toIntOrNull()
          - pattern: $VALUE.toLong()
          - pattern: $VALUE.toLongOrNull()
          - pattern: UUID.fromString(...)
