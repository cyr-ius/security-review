# Default scan rules and checklists of security-review-mcp.
#
# This file seeds the database on the first run (see rule_store.seed_defaults) and is the
# fallback when the database is unavailable. A newer version of a default entry replaces the
# stored one at startup only if an administrator has not modified it.
#
# Never reuse or renumber an id: users cite them in `secreview:ignore` and disabled_rules.
# Same format as the packs of `security-review-mcp rules import`.

[[rules]]
id = "GEN-001"
title = "Hard-coded credential"
severity = "high"
cwe = "CWE-798"
languages = ["*"]
pattern = "(password|passwd|pwd|secret|api[_-]?key|token)\\s*[:=]\\s*[\\\"'][^\\\"'\\s]{6,}[\\\"']"
advice = "Move the secret to a vault or environment variable and rotate it."

[[rules]]
id = "GEN-002"
title = "Private key material"
severity = "critical"
cwe = "CWE-321"
languages = ["*"]
pattern = "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
advice = "Remove the key from the repository, rotate it and purge it from history."

[[rules]]
id = "GEN-003"
title = "Cloud access key identifier"
severity = "high"
cwe = "CWE-798"
languages = ["*"]
pattern = '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
advice = "Revoke the key and use short-lived credentials."

[[rules]]
id = "GEN-004"
title = "Plain HTTP URL for a non-local host"
severity = "low"
cwe = "CWE-319"
languages = ["*"]
pattern = 'http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])[\w.-]+'
advice = "Use HTTPS unless the endpoint is strictly local."

[[rules]]
id = "PY-001"
title = "eval/exec on dynamic data"
severity = "high"
cwe = "CWE-95"
languages = ["python"]
pattern = '(?<!\.)\b(eval|exec)\s*\('
advice = "Avoid dynamic execution; use ast.literal_eval or an explicit dispatch table."

[[rules]]
id = "PY-002"
title = "Unsafe deserialization (pickle/marshal)"
severity = "high"
cwe = "CWE-502"
languages = ["python"]
pattern = '\b(pickle|cPickle|marshal|shelve)\.(loads?|Unpickler)\b'
advice = "Never load untrusted data; use JSON or a schema-validated format."

[[rules]]
id = "PY-003"
title = "yaml.load without SafeLoader"
severity = "high"
cwe = "CWE-502"
languages = ["python"]
pattern = 'yaml\.load\s*\((?![^)]*SafeLoader)'
advice = "Use yaml.safe_load."

[[rules]]
id = "PY-004"
title = "Shell command execution"
severity = "high"
cwe = "CWE-78"
languages = ["python"]
pattern = '(shell\s*=\s*True|os\.system\s*\(|os\.popen\s*\()'
advice = "Pass an argument list to subprocess without shell=True and validate inputs."

[[rules]]
id = "PY-005"
title = "SQL built with string formatting"
severity = "high"
cwe = "CWE-89"
languages = ["python"]
pattern = "(execute|executemany|text)\\s*\\(\\s*(f[\\\"']|[\\\"'][^\\\"']*[\\\"']\\s*(%|\\.format|\\+))"
advice = "Use bound parameters (cursor.execute(sql, params))."

[[rules]]
id = "PY-006"
title = "TLS verification disabled"
severity = "high"
cwe = "CWE-295"
languages = ["python"]
pattern = 'verify\s*=\s*False'
advice = "Keep verification on; supply a CA bundle for internal CAs."

[[rules]]
id = "PY-007"
title = "Weak hash function"
severity = "medium"
cwe = "CWE-327"
languages = ["python"]
pattern = 'hashlib\.(md5|sha1)\s*\('
advice = "Use SHA-256+ for integrity and argon2/bcrypt/scrypt for passwords."

[[rules]]
id = "PY-008"
title = "Non-cryptographic random for security use"
severity = "medium"
cwe = "CWE-338"
languages = ["python"]
pattern = '\brandom\.(random|randint|choice|randrange)\s*\('
advice = "Use the secrets module for tokens, passwords and keys."

[[rules]]
id = "PY-009"
title = "Debug mode enabled"
severity = "medium"
cwe = "CWE-489"
languages = ["python"]
pattern = '(debug\s*=\s*True|app\.run\([^)]*debug\s*=\s*True)'
advice = "Disable debug outside local development."

[[rules]]
id = "PY-010"
title = "Insecure temporary file"
severity = "low"
cwe = "CWE-377"
languages = ["python"]
pattern = '\btempfile\.mktemp\s*\('
advice = "Use tempfile.mkstemp or NamedTemporaryFile."

[[rules]]
id = "PY-026"
title = "User input reaches a dynamic SQL query"
severity = "high"
cwe = "CWE-89"
languages = ["python"]
# The AST engine handles this rule; this pattern intentionally never matches.
pattern = '(?=a)b'
advice = "Use bound parameters instead of interpolating user input into SQL."

[[rules]]
id = "PY-027"
title = "JWT signature verification explicitly disabled"
severity = "high"
cwe = "CWE-347"
languages = ["python"]
pattern = '''['"]?verify_signature['"]?\s*[:=]\s*False|verify\s*=\s*False|algorithms\s*=\s*\[\s*['"]none['"]'''
advice = "Verify JWT signatures with a fixed algorithm allow-list; never accept unsigned tokens."

[[rules]]
id = "JV-001"
title = "Java deserialization"
severity = "high"
cwe = "CWE-502"
languages = ["java"]
pattern = '\b(new\s+ObjectInputStream|XMLDecoder|enableDefaultTyping|activateDefaultTyping)\b'
advice = "Use an allow-list ObjectInputFilter or a data-only format such as JSON."

[[rules]]
id = "JV-002"
title = "OS command execution"
severity = "high"
cwe = "CWE-78"
languages = ["java"]
pattern = '(Runtime\.getRuntime\(\)\.exec|new\s+ProcessBuilder)\s*\('
advice = "Avoid shell invocation; pass fixed commands and validated arguments."

[[rules]]
id = "JV-003"
title = "SQL built by concatenation"
severity = "high"
cwe = "CWE-89"
languages = ["java"]
pattern = '(createStatement\(\)|executeQuery|executeUpdate|createQuery|createNativeQuery)\s*\([^;]*\+'
advice = "Use PreparedStatement or named parameters."

[[rules]]
id = "JV-004"
title = "XML parser possibly vulnerable to XXE"
severity = "medium"
cwe = "CWE-611"
languages = ["java"]
pattern = '\b(DocumentBuilderFactory|SAXParserFactory|XMLInputFactory|TransformerFactory)\.newInstance\s*\('
advice = "Enable secure processing and disallow DOCTYPE declarations."

[[rules]]
id = "JV-005"
title = "CSRF protection disabled"
severity = "medium"
cwe = "CWE-352"
languages = ["java"]
pattern = 'csrf\s*\(\s*\)\s*\.\s*disable\s*\(|csrf\s*\(\s*\w+\s*->\s*\w+\.disable\s*\('
advice = "Keep CSRF on for browser/session clients; disable only for stateless token APIs."

[[rules]]
id = "JV-006"
title = "Wildcard CORS"
severity = "medium"
cwe = "CWE-942"
languages = ["java"]
pattern = '(@CrossOrigin\s*(\(\s*\))?\s*$|allowedOrigins?\s*\(\s*\"\*\"|origins\s*=\s*\"\*\")'
advice = "Restrict allowed origins; never combine * with credentials."

[[rules]]
id = "JV-007"
title = "Weak hash/cipher"
severity = "medium"
cwe = "CWE-327"
languages = ["java"]
pattern = '(MessageDigest\.getInstance\(\s*\"(MD5|SHA-?1)\"|Cipher\.getInstance\(\s*\"(DES|AES/ECB|AES\")|NoOpPasswordEncoder)'
advice = "Use SHA-256+, AES-GCM and a strong PasswordEncoder (BCrypt/Argon2)."

[[rules]]
id = "JV-008"
title = "Trust-all TLS"
severity = "high"
cwe = "CWE-295"
languages = ["java"]
pattern = '(ALLOW_ALL_HOSTNAME_VERIFIER|NoopHostnameVerifier|checkServerTrusted\s*\([^)]*\)\s*\{\s*\})'
advice = "Validate certificates and hostnames."

[[rules]]
id = "NG-001"
title = "Sanitizer bypass"
severity = "high"
cwe = "CWE-79"
languages = ["angular", "javascript", "typescript"]
pattern = 'bypassSecurityTrust(Html|Script|Style|Url|ResourceUrl)\s*\('
advice = "Remove the bypass or sanitize with a strict allow-list (e.g. DOMPurify)."

[[rules]]
id = "NG-002"
title = "innerHTML / DOM write"
severity = "medium"
cwe = "CWE-79"
languages = ["angular", "javascript", "typescript"]
pattern = '(\.innerHTML\s*=|\[innerHTML\]|outerHTML\s*=|document\.write\s*\()'
advice = "Prefer text binding; if HTML is required, sanitize it."

[[rules]]
id = "NG-003"
title = "Dynamic code execution"
severity = "high"
cwe = "CWE-95"
languages = ["angular", "javascript", "typescript"]
pattern = '(\beval\s*\(|new\s+Function\s*\()'
advice = "Remove dynamic code execution."

[[rules]]
id = "NG-004"
title = "Token stored in web storage"
severity = "medium"
cwe = "CWE-922"
languages = ["angular", "javascript", "typescript"]
pattern = "(localStorage|sessionStorage)\\.setItem\\s*\\(\\s*[\\\"'][^\\\"']*(token|jwt|secret|password)"
advice = "Prefer HttpOnly, Secure, SameSite cookies handled by the backend."

[[rules]]
id = "NG-005"
title = "Direct DOM access"
severity = "low"
cwe = "CWE-79"
languages = ["angular", "typescript"]
pattern = 'nativeElement\s*\.(innerHTML|outerHTML)'
advice = "Use Angular bindings or Renderer2 with sanitized values."

[[rules]]
id = "NG-021"
title = "URL input flows to an Angular HTML sink"
severity = "high"
cwe = "CWE-79"
languages = ["angular", "typescript", "javascript"]
pattern = '(?=a)b' # Structural rule evaluated by the Tree-sitter analyzer.
advice = "Treat URL data as untrusted; render it as text or sanitize with a strict allow-list before using an HTML sink."

[[rules]]
id = "NG-022"
title = "Message data read without checking its origin"
severity = "medium"
cwe = "CWE-346"
languages = ["angular", "typescript", "javascript"]
pattern = '(?=a)b' # Structural rule evaluated by the Tree-sitter analyzer.
advice = "Before trusting event.data, compare event.origin with an explicit allow-list of expected origins."

[[rules]]
id = "NG-023"
title = "Prototype chain mutation"
severity = "high"
cwe = "CWE-1321"
languages = ["angular", "typescript", "javascript"]
pattern = '''(?:\.__proto__|\[['"]__proto__['"]\]|\.constructor\.prototype)\s*(?:\.[\w$]+\s*)?(?:=|\+=)'''
advice = "Avoid mutating object prototypes; validate object keys and use objects without a prototype for dictionaries."

[[rules]]
id = "CFG-001"
title = "Privileged container"
severity = "high"
cwe = "CWE-250"
languages = ["config", "docker", "yaml"]
pattern = 'privileged\s*:\s*true'
advice = "Drop privileged mode; add only the capabilities needed."

[[rules]]
id = "CFG-002"
title = "Docker socket mounted"
severity = "high"
cwe = "CWE-250"
languages = ["config", "docker", "yaml"]
pattern = '/var/run/docker\.sock'
advice = "Avoid mounting the Docker socket; use a rootless builder."

[[rules]]
id = "CFG-003"
title = "Container image uses :latest"
severity = "low"
cwe = "CWE-1357"
languages = ["config", "docker", "yaml"]
pattern = '(^|\s)(image\s*:|FROM)\s+[\w./-]+(:latest)?\s*$'
advice = "Pin images by version or, better, by digest."

[[rules]]
id = "CFG-004"
title = "Unrestricted network range"
severity = "high"
cwe = "CWE-668"
languages = ["config", "docker", "yaml"]
pattern = '0\.0\.0\.0/0'
advice = "Restrict the source range to what is strictly required."

[[rules]]
id = "CFG-005"
title = "World-writable permissions"
severity = "medium"
cwe = "CWE-732"
languages = ["config", "docker", "yaml"]
pattern = 'chmod\s+(-R\s+)?(777|666)'
advice = "Apply least-privilege file modes."

[[rules]]
id = "CFG-006"
title = "Remote script piped to shell"
severity = "high"
cwe = "CWE-829"
languages = ["config", "docker", "yaml"]
pattern = '(curl|wget)[^|\n]*\|\s*(sudo\s+)?(ba)?sh'
advice = "Download, verify checksum/signature, then execute."

[[rules]]
id = "CFG-007"
title = "Debug enabled in configuration"
severity = "medium"
cwe = "CWE-489"
languages = ["config", "yaml"]
pattern = '\b(debug|DEBUG)\s*[:=]\s*(true|1|yes)\b'
advice = "Disable debug in non-development environments."

[[rules]]
id = "CFG-008"
title = "TLS verification disabled in configuration"
severity = "high"
cwe = "CWE-295"
languages = ["config", "docker", "yaml"]
pattern = "(ssl[_-]?verify|verify[_-]?ssl|insecure[_-]?skip[_-]?verify|NODE_TLS_REJECT_UNAUTHORIZED)\\s*[:=]\\s*[\\\"']?(false|0|true)"
advice = "Keep certificate verification enabled."

[[rules]]
id = "CFG-009"
title = "Actuator/management endpoints fully exposed"
severity = "medium"
cwe = "CWE-200"
languages = ["config", "yaml"]
pattern = 'management\.endpoints\.web\.exposure\.include\s*[:=]\s*\*'
advice = "Expose only health/info and protect the rest."

[[rules]]
id = "GL-001"
title = "Remote include in the pipeline"
severity = "medium"
cwe = "CWE-829"
languages = ["gitlab-ci"]
pattern = "^\\s*-?\\s*remote\\s*:\\s*[\\\"']?https?://"
advice = "A remote include can change without review; vendor it or pin it to a commit."

[[rules]]
id = "GL-002"
title = "Secret variable echoed in a job log"
severity = "high"
cwe = "CWE-532"
languages = ["gitlab-ci", "jenkins"]
pattern = '\b(echo|printf|cat)\b[^|\n]*\$\{?[A-Z0-9_]*(TOKEN|PASSWORD|PASSWD|SECRET|API_?KEY)[A-Z0-9_]*'
advice = "Never print secrets; job logs are readable by many people and masking is not complete."

[[rules]]
id = "GL-003"
title = "Docker-in-Docker without TLS"
severity = "high"
cwe = "CWE-319"
languages = ["gitlab-ci"]
pattern = "(DOCKER_TLS_CERTDIR\\s*:\\s*[\\\"']{2}|DOCKER_HOST\\s*:\\s*[\\\"']?tcp://[\\w.-]+:2375)"
advice = "Enable TLS for docker:dind (DOCKER_TLS_CERTDIR: /certs) or use a rootless builder."

[[rules]]
id = "GL-004"
title = "Security job allowed to fail"
severity = "medium"
cwe = "CWE-693"
languages = ["gitlab-ci"]
pattern = 'allow_failure\s*:\s*true'
advice = "Check that this job is not a security gate; failures would be silently ignored."

[[rules]]
id = "GL-005"
title = "CI token passed on the command line"
severity = "medium"
cwe = "CWE-214"
languages = ["gitlab-ci", "jenkins"]
pattern = '(https?://)?(gitlab-ci-token|oauth2):\$\{?[A-Z_]+'
advice = "Prefer credential helpers or header-based auth to keep tokens out of process lists."

[[rules]]
id = "JK-001"
title = "Shell step interpolating user-controlled value"
severity = "high"
cwe = "CWE-78"
languages = ["jenkins"]
pattern = '\bsh\b[^\n]*\"[^\"\n]*\$\{?(params\.|env\.(BRANCH_NAME|GIT_BRANCH|CHANGE_\w+)|BRANCH_NAME|CHANGE_\w+)'
advice = "Branch names, MR titles and parameters are attacker-controlled: pass them as environment variables and quote them in single-quoted shell strings."

[[rules]]
id = "JK-002"
title = "Shared library not pinned to a version"
severity = "medium"
cwe = "CWE-829"
languages = ["jenkins"]
pattern = "@Library\\(\\s*[\\\"'][^@\\\"']+[\\\"']\\s*\\)"
advice = "Pin shared libraries to a tag or commit (@Library('name@v1.2.3'))."

[[rules]]
id = "JK-003"
title = "Pipeline runs on any agent"
severity = "low"
cwe = "CWE-250"
languages = ["jenkins"]
pattern = '\bagent\s+any\b'
advice = "Target a labelled, isolated agent for untrusted code."

[[rules]]
id = "JK-004"
title = "Script approval bypass / sandbox disabled"
severity = "high"
cwe = "CWE-693"
languages = ["jenkins"]
pattern = '(sandbox\s*[:=]\s*false|@NonCPS\s*\n.*Runtime|GroovyShell|evaluate\s*\()'
advice = "Keep the Groovy sandbox enabled and avoid dynamic evaluation."

[[rules]]
id = "CI-001"
title = "Certificate verification disabled in a download"
severity = "high"
cwe = "CWE-295"
languages = ["config", "docker", "gitlab-ci", "jenkins"]
pattern = '\b(curl|wget)\b[^\n]*(\s-k\b|--insecure|--no-check-certificate)'  # secreview:ignore CI-001 (rule text, not configuration)
advice = "Fix the trust chain (internal CA bundle) instead of disabling verification."

[[rules]]
id = "CI-002"
title = "Package manager checks disabled"
severity = "medium"
cwe = "CWE-494"
languages = ["config", "docker", "gitlab-ci", "jenkins"]
pattern = '(--no-gpg-check|--allow-unauthenticated|--trusted-host|npm\s+config\s+set\s+strict-ssl\s+false|pip[^\n]*--trusted-host)'  # secreview:ignore CI-002 (rule text, not configuration)
advice = "Keep signature and TLS checks on; mirror internally if needed."

[[rules]]
id = "SP-001"
title = "Health details exposed to everyone"
severity = "medium"
cwe = "CWE-200"
languages = ["config", "yaml"]
pattern = 'show-details\s*[:=]\s*always'
advice = "Use when-authorized and restrict actuator endpoints."

[[rules]]
id = "SP-002"
title = "H2 console enabled"
severity = "high"
cwe = "CWE-489"
languages = ["config", "yaml"]
pattern = 'spring\.h2\.console\.enabled\s*[:=]\s*true|h2-console'  # secreview:ignore SP-002 (rule text, not configuration)
advice = "Disable the H2 console outside local development."

[[rules]]
id = "SP-003"
title = "TLS disabled on the server"
severity = "medium"
cwe = "CWE-319"
languages = ["config", "yaml"]
pattern = 'server\.ssl\.enabled\s*[:=]\s*false'
advice = "Terminate TLS on the server or on a trusted proxy."

[[rules]]
id = "SP-004"
title = "SQL logging enabled"
severity = "low"
cwe = "CWE-532"
languages = ["config", "yaml"]
pattern = '(spring\.jpa\.show-sql|hibernate\.show_sql)\s*[:=]\s*true'
advice = "SQL logs can contain personal data; disable in production."

[[rules]]
id = "SP-005"
title = "Every request permitted"
severity = "high"
cwe = "CWE-862"
languages = ["java"]
pattern = 'anyRequest\(\)\s*\.\s*permitAll\(\)'
advice = "Default to authenticated() and open only the specific public routes."

[[rules]]
id = "SP-006"
title = "Entity bound directly from the request body"
severity = "medium"
cwe = "CWE-915"
languages = ["java"]
pattern = '@RequestBody\s+(final\s+)?\w*(Entity|Model|Domain)\w*\s+\w+'
advice = "Bind a dedicated DTO to avoid mass assignment and over-posting."

[[rules]]
id = "FA-001"
title = "CORS allows every origin"
severity = "medium"
cwe = "CWE-942"
languages = ["python"]
pattern = "allow_origins\\s*=\\s*\\[\\s*[\\\"']\\*[\\\"']"
advice = "List explicit origins, especially when credentials are allowed."

[[rules]]
id = "FA-002"
title = "JWT signature verification disabled"
severity = "critical"
cwe = "CWE-347"
languages = ["python"]
pattern = "(verify_signature[\\\"']?\\s*[:=]\\s*False|algorithms\\s*=\\s*\\[[^\\]]*[\\\"']none[\\\"'])"
advice = "Always verify the signature with a fixed algorithm list."

[[rules]]
id = "PY-011"
title = "Archive extraction without member validation"
severity = "medium"
cwe = "CWE-22"
languages = ["python"]
pattern = '\.extractall\s*\('
advice = "Validate member names (no absolute paths or '..') or use the 'data' filter."

[[rules]]
id = "PY-012"
title = "Template autoescape disabled"
severity = "medium"
cwe = "CWE-79"
languages = ["python"]
pattern = 'autoescape\s*=\s*False'
advice = "Enable autoescape for HTML templates."

[[rules]]
id = "PY-013"
title = "Unverified TLS context"
severity = "high"
cwe = "CWE-295"
languages = ["python"]
pattern = '(_create_unverified_context|CERT_NONE|check_hostname\s*=\s*False)'
advice = "Use ssl.create_default_context() and keep hostname checking on."

[[rules]]
id = "NG-006"
title = "postMessage with wildcard target origin"
severity = "medium"
cwe = "CWE-345"
languages = ["angular", "javascript", "typescript"]
pattern = "postMessage\\s*\\([^)]*,\\s*[\\\"']\\*[\\\"']\\s*\\)"
advice = "Specify the exact target origin and validate event.origin on reception."

[[rules]]
id = "NG-007"
title = "Cookie written from JavaScript"
severity = "low"
cwe = "CWE-1004"
languages = ["angular", "javascript", "typescript"]
pattern = 'document\.cookie\s*='
advice = "Prefer HttpOnly, Secure, SameSite cookies set by the backend."

[[rules]]
id = "GEN-005"
title = "Sensitive value written to a log"
severity = "medium"
cwe = "CWE-532"
languages = ["python", "java", "javascript", "typescript", "angular"]
pattern = '''\b(log(ger|ging)?|console)\.(trace|debug|info|warn|warning|error|critical|exception|log)\s*\([^)\n]*[,+{]\s*[\w.]*(password|passwd|secret|token|api_?key|credentials?)\b'''
advice = "Never log credentials or tokens; log an identifier or a masked value instead."

[[rules]]
id = "GEN-006"
title = "Token with a known service format"
severity = "high"
cwe = "CWE-798"
languages = ["*"]
pattern = '\b(gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|glpat-[A-Za-z0-9_-]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|(sk|rk)_live_[0-9A-Za-z]{20,}|npm_[A-Za-z0-9]{36})'
advice = "Revoke the token at the provider, purge it from history and load it from a vault."
ignore_case = false

[[rules]]
id = "GEN-007"
title = "Credentials embedded in a URL"
severity = "high"
cwe = "CWE-798"
languages = ["*"]
pattern = '''(?<![\w+.-])[a-z][a-z0-9+.-]*://[^:/\s@'"$<{]+:[^@/\s'"$<{]+@[\w.-]+'''
advice = "Pass credentials separately (vault, environment, credential helper), never in the URL."

[[rules]]
id = "GEN-008"
title = "Hard-coded JSON Web Token"
severity = "medium"
cwe = "CWE-798"
languages = ["*"]
pattern = '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
advice = "Remove the token; if it is still valid, revoke it or rotate the signing key."
ignore_case = false

[[rules]]
id = "GEN-009"
title = "Obsolete SSL/TLS protocol version"
severity = "medium"
cwe = "CWE-326"
languages = ["*"]
pattern = '(SSLv[23]|TLSv1([._][01])?)\b(?![._]\d)'  # secreview:ignore GEN-009 (rule text, not configuration)
advice = "Allow TLS 1.2 and 1.3 only."

[[rules]]
id = "PY-014"
title = "XML parser resolving entities or reaching the network"
severity = "high"
cwe = "CWE-611"
languages = ["python"]
pattern = '(resolve_entities|load_dtd|huge_tree)\s*=\s*True|no_network\s*=\s*False'
advice = "Parse untrusted XML with defusedxml, or keep entity resolution and network access off."

[[rules]]
id = "PY-015"
title = "Template rendered from a dynamic string (SSTI)"
severity = "medium"
cwe = "CWE-1336"
languages = ["python"]
pattern = '\b(render_template_string|from_string)\s*\(|\bTemplate\s*\([^)]*\)\s*\.\s*render\s*\('
advice = "Render templates from files; pass user data only as context variables."

[[rules]]
id = "PY-016"
title = "Hard-coded framework secret key"
severity = "high"
cwe = "CWE-798"
languages = ["python"]
pattern = '''SECRET_KEY['"]?\]?\s*=\s*[rbu]?['"]'''
advice = "Load SECRET_KEY from the environment or a vault and rotate the exposed value."

[[rules]]
id = "PY-017"
title = "Every host name accepted"
severity = "medium"
cwe = "CWE-183"
languages = ["python"]
pattern = '''\ballowed_hosts\s*=\s*\[\s*['"]\*['"]'''
advice = "List the expected host names to prevent Host header attacks."

[[rules]]
id = "PY-018"
title = "CSRF protection disabled"
severity = "medium"
cwe = "CWE-352"
languages = ["python"]
pattern = '@csrf_exempt\b|@csrf\.exempt\b|WTF_CSRF_ENABLED\s*=\s*False'
advice = "Keep CSRF checks for cookie-authenticated views; exempt only stateless token APIs."

[[rules]]
id = "PY-019"
title = "HTML marked as safe"
severity = "medium"
cwe = "CWE-79"
languages = ["python"]
pattern = '\b(mark_safe|Markup|SafeString)\s*\('
advice = "Let the template engine escape values; sanitize with an allow-list if HTML is required."

[[rules]]
id = "PY-020"
title = "Cookie without Secure or HttpOnly"
severity = "medium"
cwe = "CWE-614"
languages = ["python"]
pattern = '(SESSION_COOKIE_SECURE|CSRF_COOKIE_SECURE|SESSION_COOKIE_HTTPONLY|REMEMBER_COOKIE_SECURE)\s*=\s*False|set_cookie\s*\([^)]*\b(secure|httponly)\s*=\s*False'
advice = "Set Secure, HttpOnly and SameSite on session and authentication cookies."

[[rules]]
id = "PY-021"
title = "Weak cipher or ECB mode"
severity = "medium"
cwe = "CWE-327"
languages = ["python"]
pattern = '\bMODE_ECB\b|\bmodes\.ECB\s*\(|\b(DES|DES3|ARC2|ARC4|Blowfish)\.new\s*\(|\balgorithms\.(TripleDES|Blowfish|ARC4|IDEA)\s*\('
advice = "Use AES-GCM or ChaCha20-Poly1305 (e.g. cryptography's AESGCM)."

[[rules]]
id = "PY-022"
title = "Pickle-based loader"
severity = "high"
cwe = "CWE-502"
languages = ["python"]
pattern = '\b(jsonpickle\.decode|joblib\.load|dill\.loads?|(pd|pandas)\.read_pickle)\s*\(|\btorch\.load\s*\((?![^)]*weights_only\s*=\s*True)|allow_pickle\s*=\s*True'
advice = "These loaders run code from the file: load trusted files only, or use torch.load(weights_only=True) and safetensors."

[[rules]]
id = "PY-023"
title = "Hard-coded path in a shared temporary directory"
severity = "low"
cwe = "CWE-377"
languages = ["python"]
pattern = '''['"]/(tmp|var/tmp|dev/shm)/'''
advice = "Use the tempfile module to get a private, unpredictable path."

[[rules]]
id = "PY-024"
title = "Request to a user-supplied URL (SSRF)"
severity = "high"
cwe = "CWE-918"
languages = ["python"]
pattern = '\b(requests|httpx|urllib\.request)\.(get|post|put|patch|delete|head|request|urlopen)\s*\([^)]*\brequest\.(args|form|values|GET|POST|json|query_params)'
advice = "Validate the URL against an allow-list of hosts and block private and link-local addresses."

[[rules]]
id = "PY-025"
title = "Secret compared with a non-constant-time operator"
severity = "low"
cwe = "CWE-208"
languages = ["python"]
pattern = '''\b(password|passwd|token|secret|api_?key|signature|hmac)\s*[!=]=\s*(?!None\b)[\w.]|[\w.\])]\s*[!=]=\s*[\w.]*\b(password|passwd|token|secret|api_?key|signature|hmac)\b'''
advice = "Compare secrets with hmac.compare_digest or secrets.compare_digest."

[[rules]]
id = "JV-009"
title = "LDAP filter built by concatenation"
severity = "medium"
cwe = "CWE-90"
languages = ["java"]
pattern = '\.search\s*\([^;]*"[^"]*\([\w-]+=\s*"\s*\+'
advice = "Escape values with an LDAP encoder or use a parameterized filter (filterArgs)."

[[rules]]
id = "JV-010"
title = "File path built from a request parameter"
severity = "high"
cwe = "CWE-22"
languages = ["java"]
pattern = '(new\s+(File|FileInputStream|FileOutputStream|FileReader|FileWriter|RandomAccessFile)|Paths\.get|Path\.of)\s*\([^;]*getParameter\s*\('
advice = "Resolve the path against a base directory, normalize it and check that it stays inside."

[[rules]]
id = "JV-011"
title = "Redirect to a user-supplied URL"
severity = "medium"
cwe = "CWE-601"
languages = ["java"]
pattern = '''sendRedirect\s*\([^;]*getParameter\s*\(|"redirect:"\s*\+|"Location"\s*,\s*[^;]*getParameter\s*\('''
advice = "Redirect only to relative paths or to an allow-list of destinations."

[[rules]]
id = "JV-012"
title = "Expression language evaluation"
severity = "medium"
cwe = "CWE-917"
languages = ["java"]
pattern = '\.parseExpression\s*\(|\bcreateValueExpression\s*\('
advice = "Never evaluate SpEL/EL built from user input; use SimpleEvaluationContext if evaluation is required."

[[rules]]
id = "JV-013"
title = "Cookie without Secure or HttpOnly"
severity = "medium"
cwe = "CWE-614"
languages = ["java"]
pattern = '\.set(Secure|HttpOnly)\s*\(\s*false\s*\)'
advice = "Set Secure, HttpOnly and SameSite on session and authentication cookies."

[[rules]]
id = "JV-014"
title = "Predictable random generator"
severity = "low"
cwe = "CWE-338"
languages = ["java"]
pattern = '\bnew\s+(java\.util\.)?Random\s*\(|\bMath\.random\s*\('
advice = "Use SecureRandom for tokens, identifiers, passwords and keys."

[[rules]]
id = "JV-015"
title = "Stack trace printed"
severity = "low"
cwe = "CWE-209"
languages = ["java"]
pattern = '\.printStackTrace\s*\(\s*\)'
advice = "Log the exception with the logging framework and return a generic error to clients."

[[rules]]
id = "JV-016"
title = "Deserialization library with permissive defaults"
severity = "medium"
cwe = "CWE-502"
languages = ["java"]
pattern = '\bnew\s+XStream\s*\(|\bnew\s+Yaml\s*\(\s*\)|\bnew\s+Yaml\s*\(\s*new\s+Constructor\s*\('
advice = "Configure an allow-list of types (XStream allowTypes, SnakeYAML SafeConstructor / LoaderOptions)."

[[rules]]
id = "JV-017"
title = "Server-side request to a user-supplied URL"
severity = "high"
cwe = "CWE-918"
languages = ["java"]
pattern = '(new\s+URL|URI\.(create|parse)|getForObject|getForEntity|exchange|\.uri)\s*\([^;\n]*(getParameter|getQueryString|getHeader)\s*\('
advice = "Do not fetch arbitrary client-supplied URLs; allow-list schemes and hosts, block private and link-local addresses, and revalidate resolved destinations."

[[rules]]
id = "JV-018"
title = "JNDI lookup uses a request value"
severity = "high"
cwe = "CWE-74"
languages = ["java"]
pattern = '''\b(?:ctx|context|initialContext|ic)\s*\.\s*lookup\s*\([^;\n]*(?:getParameter|getQueryString|getHeader)\s*\('''
advice = "Never build JNDI names from request data; use fixed names and validate any lookup key against an explicit allow-list."

[[rules]]
id = "NG-008"
title = "Redirect to a user-supplied URL"
severity = "medium"
cwe = "CWE-601"
languages = ["angular", "javascript", "typescript"]
pattern = '(location\.(href\s*=|assign\s*\(|replace\s*\()|window\.open\s*\()[^;\n]*(queryParam|searchParams|params\[|snapshot\.params|location\.(search|hash))|\bres\.redirect\s*\([^;\n]*req\.(query|params|body)'
advice = "Redirect only to relative paths or to an allow-list of destinations."

[[rules]]
id = "NG-009"
title = "Timer with a string argument"
severity = "medium"
cwe = "CWE-95"
languages = ["angular", "javascript", "typescript"]
pattern = '''\bset(Timeout|Interval)\s*\(\s*['"`]'''
advice = "Pass a function, not a string evaluated as code."

[[rules]]
id = "NG-010"
title = "HTML injection sink"
severity = "medium"
cwe = "CWE-79"
languages = ["angular", "javascript", "typescript"]
pattern = '\.insertAdjacentHTML\s*\(|\bcreateContextualFragment\s*\(|\.srcdoc\s*=|\[srcdoc\]'
advice = "Insert text nodes, or sanitize the HTML with a strict allow-list (e.g. DOMPurify)."

[[rules]]
id = "NG-011"
title = "Sanitization disabled with SecurityContext.NONE"
severity = "medium"
cwe = "CWE-79"
languages = ["angular", "typescript"]
pattern = 'SecurityContext\.NONE'
advice = "Sanitize in the context where the value is used (HTML, URL, STYLE, RESOURCE_URL)."

[[rules]]
id = "NG-012"
title = "Shell command built from dynamic data (Node.js)"
severity = "high"
cwe = "CWE-78"
languages = ["javascript", "typescript"]
pattern = '\bexec(Sync)?\s*\(\s*`[^`]*\$\{|\bshell\s*:\s*true\b'
advice = "Use execFile/spawn with an argument array and no shell; validate the arguments."

[[rules]]
id = "NG-013"
title = "Weak hash or cipher (Node.js)"
severity = "medium"
cwe = "CWE-327"
languages = ["javascript", "typescript"]
pattern = '''createHash\s*\(\s*['"](md5|sha1)['"]|\bcreateCipher\s*\(|createCipheriv\s*\(\s*['"][^'"]*-ecb['"]'''
advice = "Use SHA-256+, AES-GCM with createCipheriv and a random IV, and scrypt/argon2 for passwords."

[[rules]]
id = "NG-014"
title = "TLS verification disabled (Node.js)"
severity = "high"
cwe = "CWE-295"
languages = ["angular", "javascript", "typescript"]
pattern = 'rejectUnauthorized\s*:\s*false'
advice = "Keep certificate verification on; supply the internal CA with the ca option."

[[rules]]
id = "NG-015"
title = "JWT decoded without signature verification"
severity = "medium"
cwe = "CWE-347"
languages = ["javascript", "typescript"]
pattern = '''\bjwt\.decode\s*\(|algorithms\s*:\s*\[[^\]]*['"]none['"]'''
advice = "jwt.decode does not check the signature: use jwt.verify with a fixed algorithms list on the server."

[[rules]]
id = "NG-016"
title = "Angular XSRF protection disabled"
severity = "medium"
cwe = "CWE-352"
languages = ["angular", "typescript"]
pattern = '\bwithNoXsrfProtection\s*\(|HttpClientXsrfModule\.disable\s*\('
advice = "Keep XSRF protection when the API authenticates with cookies."

[[rules]]
id = "NG-017"
title = "CORS allows every origin (Node.js)"
severity = "medium"
cwe = "CWE-942"
languages = ["javascript", "typescript"]
pattern = '''\bcors\s*\(\s*\)|\borigin\s*:\s*(true|['"]\*['"])'''
advice = "List the allowed origins explicitly, especially when credentials are allowed."

[[rules]]
id = "NG-018"
title = "SQL built with string interpolation (Node.js)"
severity = "high"
cwe = "CWE-89"
languages = ["javascript", "typescript"]
pattern = '''\.(query|execute|raw)\s*\(\s*(`[^`]*\$\{|['"][^'"]*['"]\s*\+)'''
advice = "Use placeholders and bound parameters (query(sql, [values]))."

[[rules]]
id = "NG-019"
title = "MongoDB $where operator"
severity = "medium"
cwe = "CWE-943"
languages = ["javascript", "typescript"]
pattern = '''['"]?\$where['"]?\s*:'''
advice = "Avoid $where (server-side JavaScript); use query operators and validate input types."

[[rules]]
id = "NG-020"
title = "File path built from the request (Node.js)"
severity = "high"
cwe = "CWE-22"
languages = ["javascript", "typescript"]
pattern = '\b(sendFile|readFile|readFileSync|createReadStream|download)\s*\([^;\n]*req\.(query|params|body)'
advice = "Resolve the path against a base directory and check that it stays inside (or use the root option)."

[[rules]]
id = "CFG-010"
title = "Container runs as root"
severity = "medium"
cwe = "CWE-250"
languages = ["config", "docker", "yaml"]
pattern = '''^\s*USER\s+(root|0)(:\S*)?\s*$|^\s*user\s*:\s*['"]?(root|0)(:0)?['"]?\s*$'''
advice = "Run the process as an unprivileged user (USER 10001)."

[[rules]]
id = "CFG-011"
title = "ADD from a remote URL"
severity = "medium"
cwe = "CWE-494"
languages = ["docker"]
pattern = '^\s*ADD\s+[^\n]*\bhttps?://'
advice = "Download with a pinned checksum (ADD --checksum or RUN with verification), or COPY a vetted file."

[[rules]]
id = "CFG-012"
title = "Secret passed through ENV or ARG"
severity = "high"
cwe = "CWE-538"
languages = ["docker"]
pattern = '^\s*(ENV|ARG)\s+\w*(PASSWORD|PASSWD|SECRET|SECRET_KEY|TOKEN|API_?KEY)\s*=\s*\S'
advice = "ENV and ARG values stay in the image history: use build secrets (RUN --mount=type=secret) or runtime injection."

[[rules]]
id = "CFG-013"
title = "Host namespace shared with the container"
severity = "high"
cwe = "CWE-250"
languages = ["config", "docker", "yaml"]
pattern = '''\b(hostNetwork|hostPID|hostIPC)\s*:\s*true|\b(network_mode|pid|ipc)\s*:\s*['"]?host\b|--(net|network|pid|ipc)[= ]host\b'''
advice = "Keep the container in its own network, PID and IPC namespaces."

[[rules]]
id = "CFG-014"
title = "Privilege escalation allowed in the pod"
severity = "medium"
cwe = "CWE-250"
languages = ["config", "yaml"]
pattern = '\ballowPrivilegeEscalation\s*:\s*true|\brunAsNonRoot\s*:\s*false|\brunAsUser\s*:\s*0\b'
advice = "Set allowPrivilegeEscalation: false and runAsNonRoot: true with a non-zero runAsUser."

[[rules]]
id = "CFG-015"
title = "Dangerous Linux capability added"
severity = "high"
cwe = "CWE-250"
languages = ["config", "docker", "yaml"]
pattern = '''\b(CAP_)?(SYS_ADMIN|SYS_PTRACE|SYS_MODULE|SYS_RAWIO|NET_ADMIN|DAC_READ_SEARCH)\b|--cap-add[= ]['"]?ALL\b|\bcap_add\s*:\s*\[[^\]]*\bALL\b'''  # secreview:ignore CFG-015 (rule text, not configuration)
advice = "Drop ALL capabilities and add back only the ones that are strictly needed."

[[rules]]
id = "CFG-016"
title = "Sensitive host path mounted"
severity = "medium"
cwe = "CWE-668"
languages = ["config", "docker", "yaml"]
pattern = '''\bhostPath\s*:|(^\s*-|\s-v|--volume[= ])\s*['"]?/(etc|proc|sys|root|boot|var/lib/docker|var/lib/kubelet)?/?:/'''
advice = "Mount only dedicated data directories, read-only when possible; prefer volumes to host paths."

[[rules]]
id = "CFG-017"
title = "Database or admin port published on every interface"
severity = "medium"
cwe = "CWE-668"
languages = ["config", "docker", "yaml"]
pattern = '''^\s*-\s*['"]?(0\.0\.0\.0:)?(22|23|2375|2379|3306|5432|5984|6379|9200|11211|27017)\s*:\s*\d+'''
advice = "Keep the port on the internal network or bind it to 127.0.0.1."

[[rules]]
id = "CFG-018"
title = "Default or trivial password"
severity = "high"
cwe = "CWE-1392"
languages = ["config", "docker", "yaml"]
pattern = '''\b\w*(PASSWORD|PASSWD|PWD)\s*[:=]\s*['"]?(admin|password|changeme|changeit|root|123456|secret|default|postgres|test|guest)['"]?\s*$'''
advice = "Generate a strong random password per environment and inject it from a vault."

[[rules]]
id = "CFG-019"
title = "Wildcard or cluster-admin RBAC permission"
severity = "high"
cwe = "CWE-269"
languages = ["config", "yaml"]
pattern = '''\b(verbs|resources|apiGroups)\s*:\s*\[\s*['"]?\*['"]?\s*[,\]]|\bname\s*:\s*['"]?cluster-admin\b'''
advice = "Grant the exact verbs and resources needed, in a namespaced Role when possible."

[[rules]]
id = "CFG-020"
title = "Publicly readable storage bucket"
severity = "high"
cwe = "CWE-732"
languages = ["config", "yaml"]
pattern = '''\bacl\s*[:=]\s*['"]?public-read(-write)?\b|\bblock_public_(acls|policy)\s*=\s*false'''
advice = "Keep buckets private and block public access; share objects with signed URLs."

[[rules]]
id = "CFG-021"
title = "CORS header allows every origin"
severity = "medium"
cwe = "CWE-942"
languages = ["config", "yaml"]
pattern = '''Access-Control-Allow-Origin['"]?\s*[:,]?\s*['"]?\*'''
advice = "Return an explicit origin from an allow-list; never combine * with credentials."

[[rules]]
id = "CFG-022"
title = "Directory listing enabled"
severity = "medium"
cwe = "CWE-548"
languages = ["config"]
pattern = '\bautoindex\s+on\b|\bOptions\s+([^\n-]*\s)?\+?Indexes\b'
advice = "Disable directory listing (autoindex off, Options -Indexes)."

[[rules]]
id = "CFG-023"
title = "Weak SSH daemon setting"
severity = "medium"
cwe = "CWE-287"
languages = ["config", "docker", "yaml"]
pattern = '^\s*(PermitRootLogin|PasswordAuthentication|PermitEmptyPasswords)\s+yes\b'
advice = "Disable root login and password authentication; use keys or certificates."

[[rules]]
id = "CFG-024"
title = "Service authentication disabled"
severity = "high"
cwe = "CWE-306"
languages = ["config", "docker", "yaml"]
pattern = '''^\s*protected-mode\s+no\b|\b(xpack\.security\.enabled|security\.authorization)\s*[:=]\s*['"]?(false|disabled)|ALLOW_EMPTY_PASSWORD\s*[:=]\s*['"]?(yes|true|1)|POSTGRES_HOST_AUTH_METHOD\s*[:=]\s*['"]?trust'''
advice = "Enable authentication on every data service, even on an internal network."

[[rules]]
id = "GL-006"
title = "Untrusted CI variable evaluated by a shell"
severity = "high"
cwe = "CWE-78"
languages = ["gitlab-ci"]
pattern = '\b(eval|sh\s+-c|bash\s+-c)\b[^\n]*\$\{?CI_(COMMIT_(MESSAGE|TITLE|DESCRIPTION|TAG_MESSAGE|BRANCH|REF_NAME)|MERGE_REQUEST_(TITLE|DESCRIPTION|SOURCE_BRANCH_NAME))\b'
advice = "Commit messages, MR titles and branch names are attacker-controlled: never evaluate them; use CI_COMMIT_REF_SLUG for names."

[[rules]]
id = "GL-007"
title = "Debug trace exposes secrets"
severity = "high"
cwe = "CWE-532"
languages = ["gitlab-ci"]
pattern = '''\bCI_DEBUG_(TRACE|SERVICES)\s*:\s*['"]?(true|1)'''
advice = "Debug trace prints every variable, masked ones included: remove it and rotate exposed secrets."

[[rules]]
id = "GL-008"
title = "Public job artifacts"
severity = "medium"
cwe = "CWE-200"
languages = ["gitlab-ci"]
pattern = '^\s*public\s*:\s*true\b'
advice = "Check that the artifacts contain no secret, report or internal data before making them public."

[[rules]]
id = "GL-009"
title = "Git TLS verification disabled"
severity = "high"
cwe = "CWE-295"
languages = ["config", "docker", "gitlab-ci", "jenkins"]
pattern = '''\bGIT_SSL_NO_VERIFY\s*[:=]\s*['"]?(true|1)|http\.sslVerify\s*=?\s*false'''
advice = "Fix the trust chain (internal CA bundle) instead of disabling verification."

[[rules]]
id = "JK-005"
title = "Credential interpolated in a Groovy string"
severity = "high"
cwe = "CWE-214"
languages = ["jenkins"]
pattern = '\bsh\b[^\n]*"[^"\n]*\$\{?[\w.]*(PSW|PASSWORD|PASSWD|TOKEN|SECRET|API_?KEY)\b'
advice = "Use single quotes so that the shell, not Groovy, expands the credential ('$TOKEN')."

[[rules]]
id = "JK-006"
title = "Jenkins internal API used from a pipeline"
severity = "medium"
cwe = "CWE-269"
languages = ["jenkins"]
pattern = '\bJenkins\.(instance|get\s*\(\s*\))|\bHudson\.instance\b'
advice = "Pipelines should not reach the controller internals; move the logic to a reviewed plugin or shared library."

[[rules]]
id = "CI-003"
title = "Shell command tracing enabled"
severity = "low"
cwe = "CWE-532"
languages = ["config", "docker", "gitlab-ci", "jenkins"]
pattern = '\bset\s+-[a-z]*x'
advice = "Tracing prints expanded commands, secrets included: disable it around commands that use credentials."

[[rules]]
id = "CI-004"
title = "Dependencies installed without the lockfile"
severity = "low"
cwe = "CWE-1357"
languages = ["config", "docker", "gitlab-ci", "jenkins"]
pattern = '\bnpm\s+(install|i)\s*($|&&|;|\|)|\byarn\s+install\b(?![^\n]*--(frozen-lockfile|immutable))'
advice = "Use npm ci or yarn install --frozen-lockfile so that the build uses the reviewed lockfile."

[[rules]]
id = "SP-007"
title = "Error details returned to clients"
severity = "medium"
cwe = "CWE-209"
languages = ["config", "yaml"]
pattern = 'server\.error\.include-(stacktrace|message|exception|binding-errors)\s*[:=]\s*(always|true)'
advice = "Keep the defaults (never) and log the details on the server."

[[rules]]
id = "SP-008"
title = "Password set in Spring configuration"
severity = "high"
cwe = "CWE-798"
languages = ["config", "yaml"]
pattern = 'spring\.(security\.user|datasource|data\.redis|rabbitmq|mail)\.password\s*[:=]\s*[^\s$]'
advice = "Reference an environment variable or a secret store (${DB_PASSWORD})."

[[rules]]
id = "SP-009"
title = "Requests excluded from the security filter chain"
severity = "medium"
cwe = "CWE-862"
languages = ["java"]
pattern = '\.ignoring\s*\(\s*\)'
advice = "Use permitAll() in the HttpSecurity chain instead: ignored requests get no security headers or protection."

[[rules]]
id = "SP-010"
title = "Security headers disabled"
severity = "medium"
cwe = "CWE-1021"
languages = ["java"]
pattern = '\b(headers|frameOptions|contentSecurityPolicy|httpStrictTransportSecurity|contentTypeOptions)\s*\(\s*\)\s*\.\s*disable\s*\(|\b(headers|frameOptions|httpStrictTransportSecurity|contentTypeOptions)\s*\(\s*\w+\s*->\s*\w+\s*\.\s*disable\s*\(|(HeadersConfigurer|FrameOptionsConfig)::disable'
advice = "Keep the default headers; relax frame options to sameOrigin() only where needed."

[[rules]]
id = "SP-011"
title = "Actuator security disabled"
severity = "high"
cwe = "CWE-306"
languages = ["config", "yaml"]
pattern = '(management\.security\.enabled|endpoints\.[\w.-]*sensitive)\s*[:=]\s*false'
advice = "Protect management endpoints with authentication and a dedicated port."

[[rules]]
id = "SP-012"
title = "Sensitive actuator endpoint exposed"
severity = "high"
cwe = "CWE-200"
languages = ["config", "yaml"]
pattern = 'management\.endpoints?\.web\.exposure\.include\s*[:=][^\n]*\b(heapdump|env|shutdown|jolokia|threaddump|logfile|configprops)\b|management\.endpoint\.shutdown\.enabled\s*[:=]\s*true'
advice = "heapdump, env and similar endpoints leak secrets: do not expose them over HTTP."

[[rules]]
id = "FA-003"
title = "CORS origin regex matches everything"
severity = "medium"
cwe = "CWE-942"
languages = ["python"]
pattern = '''allow_origin_regex\s*=\s*r?['"]\.\*'''
advice = "Anchor the regex on the expected domains and keep it as strict as an explicit list."

[[rules]]
id = "FA-004"
title = "Auto-reload server mode"
severity = "low"
cwe = "CWE-489"
languages = ["python", "config", "docker", "yaml"]
pattern = '\buvicorn\.run\s*\([^)]*reload\s*=\s*True|\buvicorn\b[^\n]*--reload\b|\bfastapi\s+dev\b'
advice = "Reload mode is for local development only; run without it in production."

[[checklist]]
domain = "python"
id = "PY-01"
title = "Injection (SQL / command / template)"
what_to_look_for = "String-built SQL, subprocess with shell=True or user input, os.system, Jinja2 from_string or render of untrusted templates."
cwe = "CWE-89"

[[checklist]]
domain = "python"
id = "PY-02"
title = "Unsafe deserialization"
what_to_look_for = "pickle/marshal/shelve on untrusted data, yaml.load without SafeLoader."
cwe = "CWE-502"

[[checklist]]
domain = "python"
id = "PY-03"
title = "Dynamic code execution"
what_to_look_for = "eval, exec, compile, __import__ driven by user input."
cwe = "CWE-95"

[[checklist]]
domain = "python"
id = "PY-04"
title = "Path traversal and file handling"
what_to_look_for = "open/send_file/extractall with user-controlled paths, tarfile/zipfile without member validation, insecure temp files (mktemp)."
cwe = "CWE-22"

[[checklist]]
