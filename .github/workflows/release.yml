name: GitHub release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.0.0)"
        type: string
        required: true
      artifact:
        description: "Name of the uploaded artifact holding the distributions"
        type: string
        default: dist

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: dist/

      # Pre-release when the tag carries a PEP 440 pre-release suffix (a, b, rc, dev)
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ matches(inputs.tag, '(a|b|rc|\\.dev)[0-9]+$') }}
          files: dist/*
