name: GitHub release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.0.0)"
        type: string
        required: true
      artifact:
        description: "Name of the uploaded artifact holding the distributions"
        type: string
        default: dist

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist/

      # Pre-release when the tag carries a PEP 440 pre-release suffix (a, b, rc, dev)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          FLAGS=()
          if [[ "$TAG" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${FLAGS[@]}"
