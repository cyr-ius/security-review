name: Documentation

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      # included in the pages (manifests) or used to build them (version of the links)
      - "examples/**"
      - "pyproject.toml"
      - "scripts/mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  # every pull request, so that the required "build" check always reports: the job
  # skips the build when the pull request changes none of the paths of the push trigger
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the merge commit of a pull request and its first parent, the target branch
          fetch-depth: 2
      # same paths as the push trigger: a pull request that changes none of them passes
      - id: changes
        name: Detect documentation changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || git diff --name-only HEAD^1 HEAD | grep -qE '^(docs/|mkdocs\.yml$|examples/|pyproject\.toml$|scripts/mkdocs_hooks\.py$|\.github/workflows/docs\.yml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "No documentation change: build skipped"
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.changes.outputs.docs == 'true'
        with:
          python-version: "3.14"
          enable-cache: true
      - if: steps.changes.outputs.docs == 'true'
        run: uv sync --locked --extra docs
      # --strict turns broken links and nav warnings into errors
      - if: steps.changes.outputs.docs == 'true'
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
