name: Docker image

# Builds the image (amd64 and arm64), which holds the PostgreSQL driver: one image for SQLite and
# PostgreSQL, and its "-opengrep" variant with the OpenGrep engine (target "opengrep", about
# 250 MB more). The "-pg" tags of the former PostgreSQL variant are kept as deprecated aliases of
# the image without OpenGrep, until the next major version. Every pull request builds and smoke-tests it,
# whatever files it touches: the image holds the whole package, and the protection of master
# requires the "image" checks. A release (called by publish.yml on a vX.Y.Z tag) or a manual run
# with "push" publishes it to GitHub Container Registry and Docker Hub.
#
# Docker Hub needs the repository secret DOCKERHUB_TOKEN (access token with read/write scope
# on the cyrius44/security-review repository). GHCR uses the workflow token.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      push:
        description: "Publish the images (tagged with the branch name)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      push:
        description: "Publish the images"
        type: boolean
        default: true

# Only the push job may write packages (pull request builds never get that permission)
permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: cyrius44
  # Annotations on the multi-platform index too, so that registries show the description
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Native platform first, loaded into the local daemon to check that both entry points start
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: security-review:smoke-test
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # The OpenGrep stages have their own cache: the default build does not go through them
      - name: Build the OpenGrep variant for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: opengrep
          platforms: linux/amd64
          load: true
          tags: security-review:smoke-test-opengrep
          cache-from: |
            type=gha,scope=image
            type=gha,scope=image-opengrep
          cache-to: type=gha,mode=max,scope=image-opengrep

      - name: Smoke test
        run: |
          for image in security-review:smoke-test security-review:smoke-test-opengrep; do
            # The first argument chooses the process: mcp (default) or controller
            docker run --rm "$image" mcp --help | grep -q security-review-mcp
            docker run --rm "$image" controller --help | grep -q security-review-controller
            docker run --rm --entrypoint security-review-controller "$image" --help
            # The MCP server in stdio (SECREVIEW_TRANSPORT): prepares its database, ends on EOF
            docker run -i --rm -e SECREVIEW_TRANSPORT=stdio "$image" mcp < /dev/null
            # Runs as the non-root user of the Dockerfile
            test "$(docker run --rm --entrypoint id "$image" -u)" = "10001"
          done
          # OpenGrep in the "-opengrep" variant only
          docker run --rm -e HOME=/tmp --entrypoint opengrep security-review:smoke-test-opengrep --version
          # A real scan by the bundle extracted at build time (no self-extracting launcher)
          docker run --rm -e HOME=/tmp -w /tmp --entrypoint sh security-review:smoke-test-opengrep -c '
            printf "import os\nos.system(input())\n" > app.py
            printf "rules:\n- id: smoke\n  pattern: os.system(...)\n  message: m\n  languages: [python]\n  severity: ERROR\n" > rule.yml
            opengrep scan --config rule.yml --json app.py' | grep -q '"check_id":"smoke"'
          test "$(docker run --rm --entrypoint sh security-review:smoke-test \
            -c 'command -v opengrep || echo absent')" = "absent"

  push:
    needs: image
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry names must be lowercase
      - name: Image names
        id: names
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/security-review"
            echo "docker.io/${DOCKERHUB_NAMESPACE}/security-review"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.names.outputs.images }}
          # vX.Y.Z -> X.Y.Z, X.Y, X and latest; a pre-release (a, b, rc) only gets its version
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=security-review
            org.opencontainers.image.description=Security code review: MCP server and controller (REST API, web interface, CI/CD gate)
          annotations: |
            org.opencontainers.image.title=security-review
            org.opencontainers.image.description=Security code review: MCP server and controller (REST API, web interface, CI/CD gate)

      # Same tags with "-opengrep" (X.Y.Z-opengrep... latest-opengrep): the image with OpenGrep
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-opengrep
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto
            suffix=-opengrep,onlatest=true
          labels: |
            org.opencontainers.image.title=security-review
            org.opencontainers.image.description=Security code review: MCP server and controller (REST API, web interface, CI/CD gate), with OpenGrep
          annotations: |
            org.opencontainers.image.title=security-review
            org.opencontainers.image.description=Security code review: MCP server and controller (REST API, web interface, CI/CD gate), with OpenGrep

      # Deprecated aliases (X.Y.Z-pg... latest-pg) of the former PostgreSQL variant
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-pg
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto
            suffix=-pg,onlatest=true

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN is missing"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every platform, reusing the cache of the smoke-test build; SBOM and provenance attached
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-pg.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Build and push the OpenGrep variant
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: opengrep
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-opengrep.outputs.tags }}
          labels: ${{ steps.meta-opengrep.outputs.labels }}
          annotations: ${{ steps.meta-opengrep.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=image
            type=gha,scope=image-opengrep
          cache-to: type=gha,mode=max,scope=image-opengrep
