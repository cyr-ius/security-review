name: Docker image

# Builds the image (amd64 and arm64), which holds the PostgreSQL driver: one image for SQLite and
# PostgreSQL. The "-pg" tags of the former PostgreSQL variant are kept as deprecated aliases of
# the same image, until the next major version. Every pull request builds and smoke-tests it,
# whatever files it touches: the image holds the whole package, and the protection of master
# requires the "image" checks. A release (called by publish.yml on a vX.Y.Z tag) or a manual run
# with "push" publishes it to GitHub Container Registry and Docker Hub.
#
# Docker Hub needs the repository secret DOCKERHUB_TOKEN (access token with read/write scope
# on the cyrius44/security-review repository). GHCR uses the workflow token.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      push:
        description: "Publish the images (tagged with the branch name)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      push:
        description: "Publish the images"
        type: boolean
        default: true

# Only the push job may write packages (pull request builds never get that permission)
permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: cyrius44
  # Annotations on the multi-platform index too, so that registries show the description
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Native platform first, loaded into the local daemon to check that both entry points start
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: security-review:smoke-test
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Smoke test
        run: |
          docker run --rm security-review:smoke-test --help
          docker run --rm --entrypoint security-review-controller security-review:smoke-test --help
          # Runs as the non-root user of the Dockerfile
          test "$(docker run --rm --entrypoint id security-review:smoke-test -u)" = "10001"

  push:
    needs: image
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry names must be lowercase
      - name: Image names
        id: names
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/security-review"
            echo "docker.io/${DOCKERHUB_NAMESPACE}/security-review"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.names.outputs.images }}
          # vX.Y.Z -> X.Y.Z, X.Y, X and latest; a pre-release (a, b, rc) only gets its version
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=security-review
            org.opencontainers.image.description=Security code review: MCP server and controller (REST API, web interface, CI/CD gate)
          annotations: |
            org.opencontainers.image.title=security-review
            org.opencontainers.image.description=Security code review: MCP server and controller (REST API, web interface, CI/CD gate)

      # Deprecated aliases (X.Y.Z-pg... latest-pg) of the former PostgreSQL variant
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-pg
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto
            suffix=-pg,onlatest=true

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN is missing"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every platform, reusing the cache of the smoke-test build; SBOM and provenance attached
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-pg.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
