site_name: Security Review MCP
site_description: MCP server for security-oriented code review
site_url: https://cyr-ius.github.io/security-review-mcp/
repo_url: https://github.com/cyr-ius/security-review-mcp
repo_name: cyr-ius/security-review-mcp
edit_uri: edit/master/docs/
copyright: Security Review MCP

theme:
  name: material
  language: en
  # Same icon as the web interface (src/security_review_mcp/favicon.svg, kept identical by a test)
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light theme

plugins:
  - search:
      lang:
        - en
        - fr
  # English pages are page.md, French ones page.fr.md next to them (served under /fr/)
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: Serveur MCP pour la revue de code orientée sécurité
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: indigo
                toggle:
                  icon: material/weather-night
                  name: Thème sombre
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: indigo
                toggle:
                  icon: material/weather-sunny
                  name: Thème clair
          nav_translations:
            Home: Accueil
            Getting started: Démarrage
            Host configuration: Configuration de l'hôte
            HTTP server, authentication and TLS: Serveur HTTP, authentification et TLS
            Architecture and deployment: Architecture et déploiement
            Usage: Utilisation
            Prompts and tools: Prompts et outils
            Whole codebase scan: Scan du code complet
            Dependency analysis: Analyse des dépendances
            Internal rules: Règles internes
            Development standards: Normes de développement
            Web interface: Interface web
            Audit log and metrics: Journal d'audit et métriques
            SARIF export: Export SARIF
            Trend report: Rapport de tendance
            Reference: Référence
            Command line: Ligne de commande
            Security and limits: Sécurité et limites
            Contributing: Contribuer

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Host configuration: getting-started/host.md
      - HTTP server, authentication and TLS: getting-started/http.md
      - Docker: getting-started/docker.md
      - Architecture and deployment: getting-started/kubernetes.md
  - Usage:
      - Prompts and tools: usage/prompts-tools.md
      - Whole codebase scan: usage/code-scan.md
      - Dependency analysis: usage/dependencies.md
      - Internal rules: usage/rules.md
      - Development standards: usage/standards.md
      - Web interface: usage/web-interface.md
      - Audit log and metrics: usage/audit-metrics.md
  - CI/CD:
      - Gate: ci-cd/gate.md
      - SARIF export: ci-cd/sarif.md
      - Trend report: ci-cd/trends.md
  - Reference:
      - Configuration: reference/configuration.md
      - Command line: reference/cli.md
      - Security and limits: reference/security.md
  - Contributing: contributing.md
