site_name: Security Review MCP
site_description: MCP server for security-oriented code review
site_url: https://cyr-ius.github.io/security-review-mcp/
repo_url: https://github.com/cyr-ius/security-review-mcp
repo_name: cyr-ius/security-review-mcp
edit_uri: edit/dev/docs/
copyright: Security Review MCP

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light theme

plugins:
  - search:
      lang:
        - en
        - fr
  # English pages are page.md, French ones page.fr.md next to them (served under /fr/)
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: Serveur MCP pour la revue de code orientée sécurité
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: indigo
                toggle:
                  icon: material/weather-night
                  name: Thème sombre
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: indigo
                toggle:
                  icon: material/weather-sunny
                  name: Thème clair
          nav_translations:
            Home: Accueil
            Getting started: Démarrage
            Deploying the server: Mise en service du serveur
            Connecting the host: Connexion de l'hôte
            Advanced: Avancé
            Deployment: Déploiement
            Analysis: Analyse
            Reports and monitoring: Rapports et suivi
            OIDC login: Connexion OIDC
            Roles, groups and permissions: Rôles, groupes et permissions
            "Installation: other cases": "Installation : autres cas"
            Local mode (stdio): Mode local (stdio)
            HTTP server, authentication and TLS: Serveur HTTP, authentification et TLS
            Architecture and deployment: Architecture et déploiement
            Usage: Utilisation
            How a review works: Fonctionnement d'une revue
            Prompts and tools: Prompts et outils
            Whole codebase scan: Scan du code complet
            Dependency analysis: Analyse des dépendances
            Security review: Revue de sécurité
            Rules: Règles
            Checklists: Checklists
            Development standards: Normes de développement
            Read guard for AI assistants: Garde de lecture des assistants IA
            Web interface: Interface web
            Audit log and metrics: Journal d'audit et métriques
            Connectors: Connecteurs
            Overview: Présentation
            Third-party connectors: Connecteurs tiers
            SARIF export: Export SARIF
            Trend report: Rapport de tendance
            Reference: Référence
            Command line: Ligne de commande
            Security and limits: Sécurité et limites
            Contributing: Contribuer
            Shared mode (HTTP): Mode partagé (HTTP)
            Kubernetes: Kubernetes
            Manual installation (without containers): Installation manuelle (sans conteneur)

hooks:
  - scripts/mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [examples]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Deployment:
          - Shared mode (HTTP): getting-started/deploy.md
          - Local mode (stdio): getting-started/stdio.md
      - Connecting the host: getting-started/host.md
  - Usage:
      - Prompts and tools: usage/prompts-tools.md
      - Web interface: usage/web-interface.md
      - Gate: usage/gate.md
  - Security review:
      - How a review works: usage/how-it-works.md
      - Rules: usage/rules.md
      - Checklists: usage/checklists.md
      - Development standards: usage/standards.md
  - Connectors:
      - Overview: connectors/index.md
      - Jira: connectors/jira.md
      - ServiceNow: connectors/servicenow.md
      - Third-party connectors: connectors/third-party.md
  - Advanced:
      - Deployment:
          - Architecture and deployment: advanced/architecture.md
          - Docker: advanced/docker.md
          - Kubernetes: advanced/kubernetes.md
          - Manual installation (without containers): advanced/manual-install.md
          - HTTP server, authentication and TLS: advanced/http.md
          - OIDC login: advanced/sso.md
          - Roles, groups and permissions: advanced/access-control.md
          - "Installation: other cases": advanced/installation.md
      - Analysis:
          - Whole codebase scan: advanced/code-scan.md
          - Dependency analysis: advanced/dependencies.md
          - Read guard for AI assistants: advanced/read-guard.md
      - Reports and monitoring:
          - SARIF export: advanced/sarif.md
          - Trend report: advanced/trends.md
          - Audit log and metrics: advanced/audit-metrics.md
  - Reference:
      - Configuration: reference/configuration.md
      - Command line: reference/cli.md
      - Security and limits: reference/security.md
  - Contributing: contributing.md
