site_name: Security Review MCP
site_description: MCP server for security-oriented code review
site_url: https://cyr-ius.github.io/security-review/
repo_url: https://github.com/cyr-ius/security-review
repo_name: cyr-ius/security-review
edit_uri: edit/dev/docs/
copyright: Security Review MCP

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  features:
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light theme

plugins:
  - search:
      lang:
        - en
        - fr
  # English pages are page.md, French ones page.fr.md next to them (served under /fr/)
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: Serveur MCP pour la revue de code orientée sécurité
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: indigo
                toggle:
                  icon: material/weather-night
                  name: Thème sombre
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: indigo
                toggle:
                  icon: material/weather-sunny
                  name: Thème clair
          nav_translations:
            "Installation: other cases": "Installation : autres cas"
            Access control through the REST API: Contrôle d'accès par l'API REST
            Advanced: Avancé
            Analysis: Analyse
            Audit log in detail: Journal d'audit en détail
            Audit log: Journal d'audit
            Bearer tokens: Jetons Bearer
            Checklists: Checklists
            Checks, reviews and releases: Vérifications, revues et publication
            Command line: Ligne de commande
            Commit hooks: Hooks de commit
            Connecting the host: Connexion de l'hôte
            Connectors in detail: Connecteurs en détail
            Connectors: Connecteurs
            Contributing: Contribuer
            Controller server (FastAPI): Serveur Controller (FastAPI)
            Controller server: Serveur Controller
            Database: Base de données
            Dependency analysis: Analyse des dépendances
            Deploying the server: Mise en service du serveur
            Deployment: Déploiement
            Development standards: Normes de développement
            Getting started: Démarrage
            Home: Accueil
            Three services, three roles: Trois services, trois rôles
            How a review works: Fonctionnement d'une revue
            Kubernetes: Kubernetes
            Reverse proxy: Reverse proxy
            Local mode (stdio): Mode local (stdio)
            Manual installation (without containers): Installation manuelle (sans conteneur)
            MCP server: Serveur MCP
            OAuth login of MCP clients: Connexion OAuth des clients MCP
            OIDC login in detail: Connexion OIDC en détail
            OIDC login: Connexion OIDC
            Overview: Présentation
            Pipeline client (CI/CD): Client de pipeline (CI/CD)
            Projects: Projets
            Prometheus metrics: Métriques Prometheus
            Prompts and tools: Prompts et outils
            Read guard for AI assistants: Garde de lecture des assistants IA
            References: Références
            Reports and monitoring: Rapports et suivi
            Roles, groups and permissions: Rôles, groupes et permissions
            Rules: Règles
            SARIF export: Export SARIF
            Security and limits: Sécurité et limites
            Security review: Revue de sécurité
            Shared mode (HTTP): Mode partagé (HTTP)
            Centralized standards: Normes centralisées
            Third-party connectors: Connecteurs tiers
            TLS and certificates: TLS et certificats
            Tokens: Jetons
            Triage of findings: Triage des findings
            Triage through the REST API: Triage par l'API REST
            User accounts: Comptes utilisateurs
            Web interface (Angular): Interface web (Angular)
            Web interface: Interface web
            Whole codebase analysis: Analyse du code complet
            Writing a connector: Écrire un connecteur

hooks:
  - scripts/mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [examples]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Three services, three roles: services.md
  - Getting started:
      - Shared mode (HTTP): getting-started/deploy.md
      - Local mode (stdio): getting-started/stdio.md
      - Connecting the host: getting-started/host.md
      - Commit hooks: getting-started/commit-hooks.md
      - Centralized standards: getting-started/stored-standards.md
  - Security review:
      - How a review works: review/index.md
      - Rules: review/rules.md
      - Checklists: review/checklists.md
      - Development standards: review/standards.md
      - Gate: review/gate.md
      - Analysis:
          - Whole codebase analysis: review/analysis/code-scan.md
          - Dependency analysis: review/analysis/dependencies.md
          - Read guard for AI assistants: review/analysis/read-guard.md
  - Application:
      - Overview: usage/index.md
      - Projects: usage/projects.md
      - Triage of findings: usage/triage.md
      - User accounts: usage/user-accounts.md
      - Roles, groups and permissions: usage/access-control.md
      - Tokens: usage/tokens.md
      - OIDC login: usage/sso.md
      - Audit log: usage/audit-metrics.md
      - Connectors:
          - Overview: usage/connectors/index.md
          - Jira: usage/connectors/jira.md
          - ServiceNow: usage/connectors/servicenow.md
          - Third-party connectors: usage/connectors/third-party.md
  - Advanced:
      - Architecture:
          - Overview: advanced/architecture/index.md
          - MCP server: advanced/architecture/mcp-server.md
          - Controller server: advanced/architecture/controller.md
          - Pipeline client (CI/CD): advanced/architecture/ci.md
      - Access control through the REST API: advanced/access-control-api.md
      - Audit log in detail: advanced/audit-log.md
      - Bearer tokens: advanced/bearer-tokens.md
      - Connectors in detail: advanced/connectors.md
      - Database: advanced/database.md
      - Deployment:
          - Docker: advanced/deployment/docker.md
          - Kubernetes: advanced/deployment/kubernetes.md
          - Manual installation (without containers): advanced/deployment/manual-install.md
          - "Installation: other cases": advanced/deployment/installation.md
      - OAuth login of MCP clients: advanced/mcp-oauth.md
      - OIDC login in detail: advanced/oidc.md
      - Reports and monitoring:
          - SARIF export: advanced/reports/sarif.md
          - Triage through the REST API: advanced/reports/triage-api.md
      - Reverse proxy: advanced/reverse-proxy.md
      - TLS and certificates: advanced/tls.md
  - References:
      - Command line: reference/cli.md
      - Configuration: reference/configuration.md
      - Prometheus metrics: reference/metrics.md
      - Security and limits: reference/security.md
  - Contributing:
      - Overview: contributing/index.md
      - MCP server: contributing/mcp-server.md
      - "Controller server (FastAPI)": contributing/controller.md
      - "Web interface (Angular)": contributing/web-ui.md
      - Writing a connector: contributing/connectors.md
      - Tests: contributing/tests.md
      - Documentation: contributing/documentation.md
      - Checks, reviews and releases: contributing/checks-and-releases.md
