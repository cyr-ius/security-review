<div class="tiles">
  @for (tile of tiles(); track tile.severity) {
    <div class="tile" [class]="'sev-' + tile.severity" [class.zero]="tile.value === 0">
      <div class="tile-label">
        <i class="bi" [class]="tile.icon" aria-hidden="true"></i>
        {{ tile.label | t }}
      </div>
      <div class="tile-value">{{ tile.value }}</div>
    </div>
  }
</div>
