<div class="tiles">
  @for (tile of tiles(); track tile.severity) {
    @if (link() && tile.value > 0) {
      <a
        class="tile tile-link"
        [class]="'sev-' + tile.severity"
        [routerLink]="link()"
        [queryParams]="{ severity: tile.severity }"
      >
        <ng-container *ngTemplateOutlet="content; context: { $implicit: tile }" />
      </a>
    } @else {
      <div class="tile" [class]="'sev-' + tile.severity" [class.zero]="tile.value === 0">
        <ng-container *ngTemplateOutlet="content; context: { $implicit: tile }" />
      </div>
    }
  }
</div>

<ng-template #content let-tile>
  <div class="tile-label">
    <i class="bi" [class]="tile.icon" aria-hidden="true"></i>
    {{ tile.label | t }}
  </div>
  <div class="tile-value">{{ tile.value }}</div>
</ng-template>
