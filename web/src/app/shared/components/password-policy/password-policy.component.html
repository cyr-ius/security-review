<div class="form-text" [id]="id()" aria-live="polite">
  <span>{{ 'password.rules' | t }}</span>
  <ul class="list-unstyled mb-0">
    @for (item of rules(); track item.rule) {
      <li [class.text-success]="item.ok" [class.text-body-secondary]="!item.ok">
        <i
          class="bi"
          [class]="item.ok ? 'bi-check-circle-fill' : 'bi-circle'"
          aria-hidden="true"
        ></i>
        {{ labels[item.rule] | t: { min, max } }}
        <span class="visually-hidden"
          >({{ (item.ok ? 'password.met' : 'password.notMet') | t }})</span
        >
      </li>
    }
  </ul>
  @if (matches() !== null) {
    <p class="mb-0 mt-1" [class.text-success]="matches()" [class.text-danger]="!matches()">
      <i
        class="bi"
        [class]="matches() ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"
        aria-hidden="true"
      ></i>
      {{ (matches() ? 'password.match' : 'password.differ') | t }}
    </p>
  }
</div>
