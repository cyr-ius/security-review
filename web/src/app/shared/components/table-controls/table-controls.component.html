<div
  class="row g-2 align-items-end mb-3"
  role="group"
  [attr.aria-label]="'common.tableControls' | t"
>
  <div class="col-12 col-md-4">
    <label class="form-label small" [for]="idPrefix() + '-search'">{{ 'common.search' | t }}</label>
    <div class="input-group input-group-sm">
      <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
      <input
        [id]="idPrefix() + '-search'"
        type="search"
        class="form-control"
        maxlength="200"
        [placeholder]="'common.search' | t"
        [value]="search()"
        [attr.aria-label]="'common.search' | t"
        (input)="onSearch($event)"
      />
    </div>
  </div>

  @for (filter of filters(); track filter.key) {
    <div class="col-6 col-md-2">
      <label class="form-label small" [for]="idPrefix() + '-filter-' + filter.key">
        {{ filter.label }}
      </label>
      <select
        [id]="idPrefix() + '-filter-' + filter.key"
        class="form-select form-select-sm"
        [value]="filter.value"
        (change)="onFilter(filter.key, $event)"
      >
        @for (option of filter.options; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  }
</div>
