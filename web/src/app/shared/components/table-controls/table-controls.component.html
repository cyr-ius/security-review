<!--
  The projected content (count, selection) on the left, the search and the filters on the right;
  an element marked "control" (a filter the page handles itself) comes right after the search.
-->
<div
  class="d-flex flex-wrap align-items-center gap-2 mb-3"
  role="group"
  [attr.aria-label]="'common.tableControls' | t"
>
  <div class="me-auto d-flex flex-wrap align-items-center gap-2 small text-body-secondary">
    <ng-content />
  </div>

  <div class="input-group input-group-sm search">
    <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
    <input
      [id]="idPrefix() + '-search'"
      type="search"
      class="form-control"
      maxlength="200"
      [placeholder]="searchPlaceholder() || ('common.search' | t)"
      [attr.aria-label]="searchPlaceholder() || ('common.search' | t)"
      [value]="search()"
      (input)="onSearch($event)"
    />
  </div>

  <ng-content select="[control]" />

  @for (filter of multiFilters(); track filter.key) {
    <app-multi-select-dropdown
      class="filter"
      [id]="idPrefix() + '-filter-' + filter.key"
      [label]="filter.label"
      [allLabel]="filter.allLabel"
      [options]="filter.options"
      [selected]="filter.values"
      [searchLabel]="filter.options.length > searchFrom ? ('common.search' | t) : null"
      [filterLocally]="true"
      [toggleAll]="true"
      (selectedChange)="multiFilterChange.emit({ key: filter.key, values: $event })"
    />
  }
</div>
