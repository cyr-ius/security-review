<div class="dropdown">
  <button
    #button
    type="button"
    class="form-select form-select-sm text-start text-truncate"
    [id]="id()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="id() + '-menu'"
    (click)="toggleOpen()"
  >
    <span class="visually-hidden">{{ label() }}, </span>{{ summary() }}
  </button>
  @if (open()) {
    <div
      #menu
      class="dropdown-menu show px-3 py-2"
      role="group"
      [style]="menuStyle()"
      [id]="id() + '-menu'"
      [attr.aria-label]="label()"
    >
      @for (option of options(); track option.value) {
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            [id]="id() + '-' + $index"
            [checked]="isSelected(option.value)"
            (change)="toggle(option.value)"
          />
          <label class="form-check-label text-nowrap" [for]="id() + '-' + $index">
            {{ option.label }}
          </label>
        </div>
      }
      @if (selected().length > 0) {
        <hr class="dropdown-divider" />
        <button type="button" class="btn btn-link btn-sm p-0" (click)="clear()">
          {{ 'common.clearSelection' | t }}
        </button>
      }
    </div>
  }
</div>
