@if (auth.sessionExpired()) {
  <div
    class="modal d-block"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="session-expired-title"
    aria-describedby="session-expired-text"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="session-expired-title" class="modal-title h5">
            <i class="bi bi-hourglass-bottom" aria-hidden="true"></i>
            {{ 'session.expiredTitle' | t }}
          </h2>
        </div>
        <div class="modal-body">
          <p id="session-expired-text" class="mb-0">{{ 'session.expiredText' | t }}</p>
        </div>
        <div class="modal-footer">
          <button #loginButton type="button" class="btn btn-primary" (click)="loginAgain()">
            <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
            {{ 'session.loginAgain' | t }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop show"></div>
}
