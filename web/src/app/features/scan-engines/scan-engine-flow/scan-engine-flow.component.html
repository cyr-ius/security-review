@let total = totals();
<div class="flow">
  <svg
    (pointermove)="onPointerMove($event)"
    (pointerleave)="hovered.set(null)"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    [style.min-width.px]="width() * 0.75"
    [style.max-width.px]="width()"
    role="img"
    [attr.aria-label]="
      'scanEngines.flowLabel'
        | t
          : {
              active: total.active,
              total: data().engines.length,
              controllers: controllerNodes().length,
              mcp: mcpNodes().length,
              codebase: total.activeCodebase,
              fragments: total.activeFragment,
            }
    "
  >
    <!-- Links first, under the nodes -->
    @for (source of sources(); track source.kind) {
      @if (source.path) {
        <path
          class="link"
          [class]="'link-' + source.kind"
          [class.idle]="!source.busy"
          [attr.d]="source.path"
        />
        @if (source.busy) {
          <circle class="dot" [class]="'dot-' + source.kind" r="5">
            <animateMotion dur="2.4s" repeatCount="indefinite" [attr.path]="source.path" />
          </circle>
        }
      }
    }
    <!-- The agents call the tools and prompts of an MCP server; it delegates the code scans to
         the Controller server: one dot per family of requests running, from the agent to its MCP
         server, then on to the Controller server for a delegated code scan -->
    <!-- Each agent seen lately, linked to the MCP server it calls -->
    @for (agent of agentNodes(); track agent.id) {
      @for (path of agent.paths; track path) {
        <path class="link link-fragment" [class.idle]="!agent.busy" [attr.d]="path" />
      }
    }
    @for (node of mcpNodes(); track node.instance.id) {
      @if (node.inPath) {
        <path class="link link-fragment" [class.idle]="!node.busy" [attr.d]="node.inPath" />
      }
      <path
        class="link link-fragment"
        [class.idle]="!node.outBusy"
        [class.inactive]="!node.instance.delegated"
        [attr.d]="node.outPath"
      />
    }
    <!-- The dots after every link, so that the links drawn later never hide them -->
    @for (agent of agentNodes(); track agent.id) {
      @for (dot of agent.dots; track dot.kind + dot.path) {
        <circle class="dot" [class]="'dot-' + dot.kind" r="5">
          <animateMotion
            dur="2.4s"
            repeatCount="indefinite"
            [attr.begin]="dot.begin"
            [attr.path]="dot.path"
          />
        </circle>
      }
    }
    @for (node of mcpNodes(); track node.instance.id) {
      @for (dot of node.dots; track dot.kind + dot.path) {
        <circle class="dot" [class]="'dot-' + dot.kind" r="5">
          <animateMotion
            dur="2.4s"
            repeatCount="indefinite"
            [attr.begin]="dot.begin"
            [attr.path]="dot.path"
          />
        </circle>
      }
    }
    @for (node of nodes(); track node.engine.id) {
      <path
        class="link link-engine"
        [class.inactive]="!node.engine.active"
        [class.idle]="node.idle"
        [attr.d]="node.path"
      />
      @if (node.busyCodebase) {
        <circle class="dot dot-codebase" r="5">
          <animateMotion dur="2.4s" repeatCount="indefinite" [attr.path]="node.path" />
        </circle>
      }
      @if (node.busyFragment) {
        <circle class="dot dot-fragment" r="5">
          <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" [attr.path]="node.path" />
        </circle>
      }
      <!-- Each new heartbeat recreates the pulse, which travels once from the engine -->
      @if (node.engine.active) {
        @for (beat of [node.engine.heartbeat_at]; track beat) {
          <path class="beat" [attr.d]="node.path" pathLength="100" />
        }
      }
    }

    <!-- Sources: the code scans of the pipelines, the fragments of the agents -->
    @for (source of sources(); track source.kind) {
      <g
        class="node"
        [class.source-codebase]="source.kind === 'codebase'"
        [class.source-fragment]="source.kind === 'fragment'"
        [class.idle]="!source.busy"
        (pointerenter)="hovered.set('source:' + source.kind)"
        (pointerleave)="hovered.set(null)"
      >
        <circle class="surface" [attr.cx]="source.x" [attr.cy]="source.y" [attr.r]="source.r" />
        <circle
          class="ring ring-track"
          [attr.cx]="source.x"
          [attr.cy]="source.y"
          [attr.r]="source.r - ringInset"
          [attr.stroke-width]="ring"
        />
        @for (arc of source.arcs; track arc.kind) {
          <circle
            class="ring"
            [class]="'ring-' + arc.kind"
            [attr.cx]="source.x"
            [attr.cy]="source.y"
            [attr.r]="source.r - ringInset"
            [attr.stroke-width]="ring"
            [attr.stroke-dasharray]="arc.dash"
            [attr.stroke-dashoffset]="arc.offset"
            [attr.transform]="'rotate(-90 ' + source.x + ' ' + source.y + ')'"
          />
        }
        <foreignObject
          [attr.x]="source.x - source.r"
          [attr.y]="source.y - source.r"
          [attr.width]="source.r * 2"
          [attr.height]="source.r * 2"
        >
          <div class="content">
            <i
              class="bi"
              [class]="source.kind === 'codebase' ? 'bi-diagram-3' : 'bi-robot'"
              aria-hidden="true"
            ></i>
            <!-- Slots of the engines: none to count without an engine -->
            @if (data().engines.length) {
              <span class="value">{{ source.active }}/{{ source.capacity }}</span>
              <span class="detail">{{ 'scanEngines.flowSlotsShort' | t }}</span>
            }
            <!-- The scans security-review-ci sends to the Controller server, engines or not -->
            @if (source.kind === 'codebase') {
              @if (data().engines.length) {
                <span class="detail">
                  {{
                    pipelineSent() === 1
                      ? ('scanEngines.flowSentOne' | t)
                      : ('scanEngines.flowSent' | t: { count: pipelineSent() })
                  }}
                </span>
              } @else {
                <span class="value">{{ pipelineSent() }}</span>
                <span class="detail">{{ 'scanEngines.flowSentShort' | t }}</span>
              }
            }
          </div>
        </foreignObject>
        <text class="label" [attr.x]="source.x" [attr.y]="source.labelY">
          {{
            (source.kind === 'codebase' ? 'scanEngines.flowPipelines' : 'scanEngines.flowAgents')
              | t
          }}
        </text>
      </g>
    }

    <!-- One node per agent seen lately (its MCP client, never a person), or "+N" for the others -->
    @for (agent of agentNodes(); track agent.id) {
      <g
        class="node source-fragment"
        [class.idle]="!agent.busy"
        (pointerenter)="hovered.set('agent:' + agent.id)"
        (pointerleave)="hovered.set(null)"
      >
        <circle class="surface" [attr.cx]="agent.x" [attr.cy]="agent.y" [attr.r]="agentRadius" />
        <circle
          class="ring ring-track"
          [attr.cx]="agent.x"
          [attr.cy]="agent.y"
          [attr.r]="agentRing"
          [attr.stroke-width]="ring"
        />
        <!-- Its requests running, in proportion by family -->
        @for (arc of agent.arcs; track arc.kind) {
          <circle
            class="ring"
            [class]="'ring-' + arc.kind"
            [attr.cx]="agent.x"
            [attr.cy]="agent.y"
            [attr.r]="agentRing"
            [attr.stroke-width]="ring"
            [attr.stroke-dasharray]="arc.dash"
            [attr.stroke-dashoffset]="arc.offset"
            [attr.transform]="'rotate(-90 ' + agent.x + ' ' + agent.y + ')'"
          />
        }
        <foreignObject
          [attr.x]="agent.x - agentRadius"
          [attr.y]="agent.y - agentRadius"
          [attr.width]="agentRadius * 2"
          [attr.height]="agentRadius * 2"
        >
          <div class="content compact">
            @if (agent.agent) {
              <i class="bi bi-robot" aria-hidden="true"></i>
              <span class="value">{{ agent.total }}</span>
              <span class="detail">{{ 'scanEngines.flowRequestsShort' | t }}</span>
            } @else {
              <span class="value">+{{ agent.more }}</span>
            }
          </div>
        </foreignObject>
        <text class="label" [attr.x]="agent.x" [attr.y]="agent.y + agentRadius + 18">
          {{ agent.agent ? agent.label : ('scanEngines.flowMoreAgents' | t) }}
        </text>
      </g>
    }

    <!-- One node per active MCP server (HTTP transport): the requests of the agents it runs -->
    @for (node of mcpNodes(); track node.instance.id) {
      <g
        class="node mcp"
        [class.idle]="!node.busy"
        (pointerenter)="hovered.set('mcp:' + node.instance.id)"
        (pointerleave)="hovered.set(null)"
      >
        @for (beat of [node.instance.heartbeat_at]; track beat) {
          <circle
            class="beat-ring beat-ring-mcp"
            [attr.cx]="node.x"
            [attr.cy]="node.y"
            [attr.r]="node.r"
          />
        }
        <circle class="surface" [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="node.r" />
        <circle
          class="ring ring-track"
          [attr.cx]="node.x"
          [attr.cy]="node.y"
          [attr.r]="mcpRing"
          [attr.stroke-width]="ring"
        />
        <!-- The requests it runs, in proportion by family -->
        @for (arc of node.arcs; track arc.kind) {
          <circle
            class="ring"
            [class]="'ring-' + arc.kind"
            [attr.cx]="node.x"
            [attr.cy]="node.y"
            [attr.r]="mcpRing"
            [attr.stroke-width]="ring"
            [attr.stroke-dasharray]="arc.dash"
            [attr.stroke-dashoffset]="arc.offset"
            [attr.transform]="'rotate(-90 ' + node.x + ' ' + node.y + ')'"
          />
        }
        <foreignObject
          [attr.x]="node.x - mcpRadius"
          [attr.y]="node.y - mcpRadius"
          [attr.width]="mcpRadius * 2"
          [attr.height]="mcpRadius * 2"
        >
          <div class="content">
            <i class="bi bi-plug" aria-hidden="true"></i>
            <span class="value">{{ node.total }}</span>
            <span class="detail">{{ 'scanEngines.flowRequestsShort' | t }}</span>
            <!-- Earlier MCP servers name no agent: nothing to count -->
            @if (agentNodes().length) {
              <span class="detail">
                {{
                  node.agentCount === 1
                    ? ('scanEngines.flowAgentCountOne' | t)
                    : ('scanEngines.flowAgentCount' | t: { count: node.agentCount })
                }}
              </span>
            }
          </div>
        </foreignObject>
        <text class="label" [attr.x]="node.x" [attr.y]="node.labelY">
          {{ 'scanEngines.flowMcpInstance' | t: { number: node.number } }}
        </text>
        <text class="label detail" [attr.x]="node.x" [attr.y]="node.labelY + 18">
          {{
            (node.instance.delegated ? 'scanEngines.flowMcpDelegated' : 'scanEngines.flowMcpLocal')
              | t
          }}
        </text>
      </g>
    }

    <!-- One vertically stacked node per active Controller process -->
    @for (node of controllerNodes(); track node.instance.id) {
      <g
        class="node"
        (pointerenter)="hovered.set('controller:' + node.instance.id)"
        (pointerleave)="hovered.set(null)"
      >
        @if (node.instance.heartbeat_at) {
          @for (beat of [node.instance.heartbeat_at]; track beat) {
            <circle
              class="beat-ring beat-ring-controller"
              [attr.cx]="node.x"
              [attr.cy]="node.y"
              [attr.r]="node.r"
            />
          }
        }
        <circle class="surface" [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="node.r" />
        <circle
          class="ring ring-track"
          [attr.cx]="node.x"
          [attr.cy]="node.y"
          [attr.r]="controllerRing"
          [attr.stroke-width]="ring"
        />
        @for (arc of total.arcs; track arc.kind) {
          <circle
            class="ring"
            [class]="'ring-' + arc.kind"
            [attr.cx]="node.x"
            [attr.cy]="node.y"
            [attr.r]="controllerRing"
            [attr.stroke-width]="ring"
            [attr.stroke-dasharray]="arc.dash"
            [attr.stroke-dashoffset]="arc.offset"
            [attr.transform]="'rotate(-90 ' + node.x + ' ' + node.y + ')'"
          />
        }
        <!-- Inner ring: the scans this process receives, in proportion by family -->
        @for (arc of node.requestArcs; track arc.kind) {
          <circle
            class="ring"
            [class]="'ring-' + arc.kind"
            [attr.cx]="node.x"
            [attr.cy]="node.y"
            [attr.r]="controllerRequestRing"
            [attr.stroke-width]="ring"
            [attr.stroke-dasharray]="arc.dash"
            [attr.stroke-dashoffset]="arc.offset"
            [attr.transform]="'rotate(-90 ' + node.x + ' ' + node.y + ')'"
          />
        }
        <foreignObject
          [attr.x]="node.x - controllerRadius"
          [attr.y]="node.y - controllerRadius"
          [attr.width]="controllerRadius * 2"
          [attr.height]="controllerRadius * 2"
        >
          <div class="content">
            <i class="bi bi-hdd-network" aria-hidden="true"></i>
            @if (data().engines.length) {
              <span class="value">{{ total.active }}/{{ data().engines.length }}</span>
              <span class="detail">{{ 'scanEngines.flowActive' | t }}</span>
              <span class="detail">{{ 'scanEngines.flowFiles' | t: { count: total.files } }}</span>
            }
          </div>
        </foreignObject>
        <text class="label" [attr.x]="node.x" [attr.y]="node.labelY">
          {{ 'scanEngines.flowControllerInstance' | t: { number: node.number } }}
        </text>
        <text class="label detail" [attr.x]="node.x" [attr.y]="node.labelY + 18">
          {{
            (!data().enabled
              ? 'scanEngines.flowControllerScans'
              : data().fallback === 'local'
                ? 'scanEngines.flowFallbackLocal'
                : 'scanEngines.flowFallbackRefuse'
            ) | t
          }}
        </text>
      </g>
    }

    <!-- One node per engine: its slots in use, its scans, its failures -->
    @for (node of nodes(); track node.engine.id) {
      <g
        class="node"
        [class.inactive]="!node.engine.active"
        [class.idle]="node.idle"
        (pointerenter)="hovered.set('engine:' + node.engine.id)"
        (pointerleave)="hovered.set(null)"
      >
        @if (node.engine.active) {
          @for (beat of [node.engine.heartbeat_at]; track beat) {
            <circle
              class="beat-ring"
              [attr.cx]="node.x"
              [attr.cy]="node.y"
              [attr.r]="engineRadius"
            />
          }
        }
        <circle class="surface" [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="engineRadius" />
        <circle
          class="ring ring-track"
          [attr.cx]="node.x"
          [attr.cy]="node.y"
          [attr.r]="engineRing"
          [attr.stroke-width]="ring"
        />
        @for (arc of node.arcs; track arc.kind) {
          <circle
            class="ring"
            [class]="'ring-' + arc.kind"
            [attr.cx]="node.x"
            [attr.cy]="node.y"
            [attr.r]="engineRing"
            [attr.stroke-width]="ring"
            [attr.stroke-dasharray]="arc.dash"
            [attr.stroke-dashoffset]="arc.offset"
            [attr.transform]="'rotate(-90 ' + node.x + ' ' + node.y + ')'"
          />
        }
        <foreignObject
          [attr.x]="node.x - engineRadius"
          [attr.y]="node.y - engineRadius"
          [attr.width]="engineRadius * 2"
          [attr.height]="engineRadius * 2"
        >
          <div class="content">
            <i class="bi bi-cpu" aria-hidden="true"></i>
            <span class="value">{{ node.used }}/{{ node.capacity }}</span>
            <span class="detail">{{ 'scanEngines.flowSlotsShort' | t }}</span>
            <!-- Files being scanned, and the failures since it started: one line in the circle -->
            @if (node.engine.processing_files || node.engine.failed_scans) {
              <span class="detail">
                @if (node.engine.processing_files) {
                  {{
                    node.engine.processing_files === 1
                      ? ('scanEngines.flowEngineFilesOne' | t)
                      : ('scanEngines.flowEngineFiles' | t: { count: node.engine.processing_files })
                  }}
                }
                @if (node.engine.processing_files && node.engine.failed_scans) {
                  ·
                }
                @if (node.engine.failed_scans) {
                  <span class="failed">
                    <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
                    {{ node.engine.failed_scans }}
                  </span>
                }
              </span>
            }
          </div>
        </foreignObject>
        <text class="label" [attr.x]="node.x" [attr.y]="node.labelY">{{ node.label }}</text>
        @if (!node.engine.active) {
          <text class="label detail" [attr.x]="node.x" [attr.y]="node.labelY + 16">
            {{ 'scanEngines.inactive' | t }}
          </text>
        }
      </g>
    }
  </svg>
</div>
@if (tooltip(); as text) {
  @if (pointer(); as at) {
    <div
      class="flow-tooltip small"
      [class.flipped]="at.flipped"
      [style.left.px]="at.x"
      [style.top.px]="at.y"
      role="status"
    >
      {{ text }}
    </div>
  }
}
