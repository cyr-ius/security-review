<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
  <h1 class="h3 mb-0">{{ 'layout.reports' | t }}</h1>
  <app-refresh-button [loading]="reports.isLoading()" (refresh)="reports.reload()" />
</div>

<app-table-controls
  idPrefix="reports"
  [search]="search() ?? ''"
  (searchChange)="onSearch($event)"
/>

<div class="card">
  <div class="card-header d-flex flex-wrap gap-2 align-items-center">
    <select
      class="form-select form-select-sm filter"
      [attr.aria-label]="'reportTable.project' | t"
      (change)="onProject($event)"
    >
      <option value="">{{ 'reports.allProjects' | t }}</option>
      @for (p of projects.value() ?? []; track p.project) {
        <option [value]="p.project" [selected]="p.project === project()">{{ p.project }}</option>
      }
    </select>
    <select
      class="form-select form-select-sm filter"
      [attr.aria-label]="'reports.riskLevel' | t"
      (change)="onRisk($event)"
    >
      <option value="">{{ 'reports.allRisks' | t }}</option>
      @for (severity of severities; track severity) {
        <option [value]="severity" [selected]="severity === riskLevel()">
          {{ severityMeta[severity].label | t }}
        </option>
      }
    </select>
  </div>

  @if (reports.error()) {
    <div class="card-body text-danger">
      <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
      {{ 'reports.loadError' | t }}
    </div>
  } @else if (reports.isLoading() && !reports.hasValue()) {
    <div class="text-center my-4">
      <span class="spinner-border text-secondary" aria-hidden="true"></span>
      <span class="visually-hidden">{{ 'common.loading' | t }}</span>
    </div>
  } @else {
    <app-report-table [reports]="rows()" [serverSort]="sort" />
  }

  @if (pageNumber() > 1 || hasNext()) {
    <div class="card-footer d-flex justify-content-between align-items-center">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        [disabled]="pageNumber() <= 1"
        (click)="goToPage(pageNumber() - 1)"
      >
        <i class="bi bi-chevron-left" aria-hidden="true"></i> {{ 'common.previous' | t }}
      </button>
      <span class="small text-body-secondary">{{ 'common.page' | t: { page: pageNumber() } }}</span>
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        [disabled]="!hasNext()"
        (click)="goToPage(pageNumber() + 1)"
      >
        {{ 'common.next' | t }} <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
