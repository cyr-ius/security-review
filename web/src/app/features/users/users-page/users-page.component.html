<div class="mb-3">
  <h1 class="h3 mb-0">{{ 'layout.users' | t }} <app-help-link [topic]="helpTopic()" /></h1>
  <p class="text-body-secondary mb-0">{{ 'users.pageSubtitle' | t }}</p>
</div>

<nav class="nav nav-tabs mb-3" [attr.aria-label]="'users.tabs' | t">
  <a
    class="nav-link"
    routerLink="/users"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    ariaCurrentWhenActive="page"
  >
    <i class="bi bi-people" aria-hidden="true"></i>
    {{ 'users.tabAccounts' | t }}
  </a>
  <a
    class="nav-link"
    routerLink="/users/roles"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
  >
    <i class="bi bi-shield-check" aria-hidden="true"></i>
    {{ 'layout.roles' | t }}
  </a>
  <a
    class="nav-link"
    routerLink="/users/sso"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
  >
    <i class="bi bi-person-badge" aria-hidden="true"></i>
    {{ 'users.tabSso' | t }}
  </a>
</nav>

<router-outlet />
