# security-review-mcp shared server (streamable HTTP, web interface on /ui) with PostgreSQL.
#
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
#   docker compose up -d --build
#   docker compose logs security-review-mcp   # one-time admin password, shown at first start
#
# The server listens on 127.0.0.1:8000 only: enable TLS (SECREVIEW_TLS_*) or put it behind a
# reverse proxy before exposing it. PostgreSQL is not published on the host.

name: security-review-mcp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: secreview
      POSTGRES_USER: secreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - secreview-pg:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secreview -d secreview"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  security-review-mcp:
    build:
      context: .
      args:
        EXTRAS: postgres
    image: security-review-mcp:pg
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # The password is inserted as is in the URL: use URL-safe characters (e.g. hex)
      SECREVIEW_DATABASE_URL: postgresql+psycopg2://secreview:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/secreview
      SECREVIEW_LOG_LEVEL: ${SECREVIEW_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${SECREVIEW_PORT:-8000}:8000"
    volumes:
      # Admin password hash and project tokens (the reports are in PostgreSQL)
      - secreview-data:/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  secreview-pg:
  secreview-data:

networks:
  backend:
