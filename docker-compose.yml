# security-review shared server with PostgreSQL, built from the sources (contributors): the
# MCP server and the controller (REST API, web interface on /ui) run in two containers sharing
# the database. To deploy the published image, use examples/docker/docker-compose.yml.
#
#   (umask 077 && printf 'POSTGRES_PASSWORD=%s\nSECREVIEW_SECRET_KEY=%s\n' \
#       "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" > .env)
#   docker compose up -d --build
#
# The advisory database is empty at first: add SECREVIEW_OSV_AUTO_UPDATE=true to .env to let the
# controller download the OSV advisories at start-up, then every 24 h.
#
# The controller migrates the schema (Alembic) at start; the MCP server waits until it is healthy.
# The MCP server listens on 127.0.0.1:8000 and the controller on 127.0.0.1:8080 only. To publish
# them on another address of the host (DOCKER_PUBLISH_ADDRESS in .env), enable TLS
# (SECREVIEW_TLS_*) or put them behind a reverse proxy first. Inside their containers,
# the servers always listen on every interface (SECREVIEW_HOST=0.0.0.0, set by the image).
# The controller exposes no unauthenticated write endpoint: it can stay on an internal network.
# PostgreSQL is not published on the host.
# The OAuth login of the MCP clients is set in .env (SECREVIEW_MCP_OAUTH_ENABLED, SECREVIEW_MCP_URL,
# with SECREVIEW_PUBLIC_URL in https): see docs/advanced/mcp-oauth.md for the paths a
# reverse proxy publishes.

name: security-review

x-secreview: &secreview
  build:
    context: .
  image: security-review
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: secreview
      POSTGRES_USER: secreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - secreview-pg:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secreview -d secreview"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  controller:
    <<: *secreview
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["security-review-controller"]
    command: ["serve"]
    env_file:
      - path: .env
        required: false
    environment:
      SECREVIEW_DATABASE_URL: postgresql+psycopg2://secreview:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/secreview
      SECREVIEW_LOG_LEVEL: ${SECREVIEW_LOG_LEVEL:-INFO}
    ports:
      - "${DOCKER_PUBLISH_ADDRESS:-127.0.0.1}:8080:8000"

  mcp:
    <<: *secreview
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_healthy
    environment:
      SECREVIEW_DATABASE_URL: postgresql+psycopg2://secreview:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/secreview
      SECREVIEW_LOG_LEVEL: ${SECREVIEW_LOG_LEVEL:-INFO}
    ports:
      - "${DOCKER_PUBLISH_ADDRESS:-127.0.0.1}:8000:8000"

volumes:
  secreview-pg:

networks:
  backend:
