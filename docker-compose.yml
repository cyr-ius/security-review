# security-review-mcp shared server with PostgreSQL: the MCP server and the controller (REST
# API, web interface on /ui) run in two containers sharing the database.
#
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
#   docker compose up -d --build
#   docker compose logs controller   # one-time admin password, shown at first start
#
# The advisory database is empty at first: add SECREVIEW_OSV_AUTO_UPDATE=true to .env to let the
# controller download the OSV advisories at start-up, then every 24 h.
#
# The migrate service migrates the schema (Alembic) before the two servers start.
# The MCP server listens on 127.0.0.1:8000 and the controller on 127.0.0.1:8080 only. To publish
# them on another address (PUBLISH_ADDRESS=0.0.0.0 in .env: every interface), enable TLS
# (SECREVIEW_TLS_*) or put them behind a reverse proxy first. The controller exposes no
# unauthenticated write endpoint: it can stay on an internal network.
# PostgreSQL is not published on the host.

name: security-review-mcp

x-secreview-env: &secreview-env
  SECREVIEW_DATABASE_URL: postgresql+psycopg2://secreview:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/secreview
  SECREVIEW_LOG_LEVEL: ${SECREVIEW_LOG_LEVEL:-INFO}
  SECREVIEW_DB_AUTO_UPGRADE: "false"

x-secreview: &secreview
  build:
    context: .
    args:
      EXTRAS: postgres
  image: security-review-mcp:pg
  environment: *secreview-env
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: secreview
      POSTGRES_USER: secreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ images keep the data in a major-version directory (/var/lib/postgresql/18/
      # docker): mount the parent directory. A volume from PostgreSQL 17 must be dumped and
      # restored, see docs/advanced/docker.md.
      - secreview-pg:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secreview -d secreview"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *secreview
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["security-review-controller"]
    command: ["db", "upgrade"]

  controller:
    <<: *secreview
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["security-review-controller"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *secreview-env
      # Download the OSV advisories at start-up (empty database), then every 24 h. Disabled by
      # default (the MCP server never connects anywhere). Without it, the dependency analysis has
      # no advisory database (import one with `advisories import`).
      SECREVIEW_OSV_AUTO_UPDATE: ${SECREVIEW_OSV_AUTO_UPDATE:-false}
      SECREVIEW_OSV_ECOSYSTEMS: ${SECREVIEW_OSV_ECOSYSTEMS:-PyPI,npm,Maven}
      SECREVIEW_PROXY: ${SECREVIEW_PROXY:-}
      SECREVIEW_NO_PROXY: ${SECREVIEW_NO_PROXY:-}
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${SECREVIEW_CONTROLLER_PORT:-8080}:8000"

  mcp:
    <<: *secreview
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${SECREVIEW_PORT:-8000}:8000"

volumes:
  secreview-pg:

networks:
  backend:
