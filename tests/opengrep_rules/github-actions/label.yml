# Test cases of the bundled OpenGrep rules: "ruleid" lines must match, "ok" lines must not.
name: Label
on: pull_request_target
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # ruleid: secreview.github-actions.pr-target-cache
      - uses: actions/cache@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.0
        with:
          path: ~/.npm
          key: npm
      - uses: actions/setup-node@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          # ruleid: secreview.github-actions.pr-target-cache
          cache: npm
      # ok: secreview.github-actions.pr-target-cache
      - uses: actions/labeler@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
